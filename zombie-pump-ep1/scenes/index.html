<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ซอมบี้ระบาด — ปั๊มริมถนนมิตรภาพ (EP.1)</title>
<style>
  @font-face { font-family: 'Kanit'; font-weight: 400; src: url('../fonts/Kanit-400.ttf') format('truetype'); }
  @font-face { font-family: 'Kanit'; font-weight: 600; src: url('../fonts/Kanit-600.ttf') format('truetype'); }
  @font-face { font-family: 'Kanit'; font-weight: 700; src: url('../fonts/Kanit-700.ttf') format('truetype'); }
  @font-face { font-family: 'Sarabun'; font-weight: 400; src: url('../fonts/Sarabun-400.ttf') format('truetype'); }
  @font-face { font-family: 'Sarabun'; font-weight: 700; src: url('../fonts/Sarabun-700.ttf') format('truetype'); }
  html, body { margin: 0; background: #000; }
  body { font-family: 'Kanit', 'Sarabun', sans-serif; }
  #frame { position: relative; width: 720px; height: 1280px; overflow: hidden; background: #0b0c10; }
  #stage { position: absolute; inset: 0; width: 720px; height: 1280px; }
  #ui, #post { position: absolute; inset: 0; width: 720px; height: 1280px; pointer-events: none; }
  /* ---- ซับไตเติล ---- */
  #sub { position: absolute; left: 40px; right: 40px; top: 760px; text-align: center; color: #fff; font-weight: 600; font-size: 40px; line-height: 1.35;
         text-shadow: 0 2px 2px rgba(0,0,0,.55), 0 6px 22px rgba(0,0,0,.6); transform-origin: 50% 50%; }
  #sub .hi { display: inline-block; background: #d7342c; color: #fff; padding: 0 14px; border-radius: 10px; box-shadow: 0 6px 18px rgba(215,52,44,.35); }
  #sub .yl { color: #f5c542; }
  /* ---- HUD การ์ด (บนซ้าย) ---- */
  #hud { position: absolute; left: 28px; top: 44px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .card { display: flex; align-items: center; gap: 12px; background: rgba(246,239,224,.96); color: #2a2622; border-radius: 14px; padding: 10px 18px 10px 12px;
          box-shadow: 0 10px 30px rgba(0,0,0,.35); border-left: 6px solid #d7342c; transform-origin: 0 50%; }
  .card .ic { width: 44px; height: 44px; border-radius: 12px; background: #2a2622; color: #f5c542; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
  .card .lb { font-size: 16px; font-weight: 400; color: #6b645a; line-height: 1.1; }
  .card .vl { font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .card .vl small { font-size: 16px; font-weight: 400; color: #6b645a; margin-left: 4px; }
  .card.red { background: #d7342c; color: #fff; border-left-color: #8e1d17; } .card.red .lb, .card.red .vl small { color: rgba(255,255,255,.8); } .card.red .ic { background: rgba(0,0,0,.25); color: #fff; }
  .card.green { border-left-color: #2f9e5a; }
  /* ---- ชิปขั้นตอน (ไฟฟ้า → ปั๊ม → น้ำมันไหล) ---- */
  #chips { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; gap: 10px; align-items: center; }
  .chip { width: 96px; height: 86px; background: rgba(246,239,224,.96); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 8px 20px rgba(0,0,0,.3); position: relative; border-bottom: 5px solid #f5c542; }
  .chip .ic { font-size: 28px; line-height: 1; } .chip .lb { font-size: 15px; color: #2a2622; font-weight: 600; }
  .chip .st { position: absolute; right: -8px; top: -8px; width: 26px; height: 26px; border-radius: 50%; background: #2f9e5a; color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .chip.off { filter: grayscale(1) brightness(.85); } .chip.off .st { background: #d7342c; }
  .chip-arrow { color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  /* ---- ตราประทับ "อย่า" ---- */
  #stamp { position: absolute; left: 0; right: 0; top: 470px; text-align: center; color: #fff; font-weight: 700; font-size: 150px; letter-spacing: 2px; transform-origin: 50% 50%; }
  #stamp span { display: inline-block; background: #d7342c; padding: 0 44px; border-radius: 22px; box-shadow: 0 20px 60px rgba(215,52,44,.5); line-height: 1.25; }
  /* ---- การ์ดชื่อตัวละคร ---- */
  #nametag { position: absolute; left: 70px; top: 300px; display: flex; align-items: center; gap: 14px; background: rgba(246,239,224,.97); border-radius: 16px; padding: 12px 22px 12px 12px; box-shadow: 0 14px 34px rgba(0,0,0,.35); transform-origin: 0 100%; }
  #nametag .av { width: 64px; height: 64px; border-radius: 50%; background: #30a05d; border: 4px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.2); overflow: hidden; }
  #nametag .nm { font-size: 34px; font-weight: 700; color: #2a2622; line-height: 1.05; } #nametag .rl { font-size: 18px; color: #6b645a; }
  /* ---- การ์ดเสบียง ---- */
  #inv { position: absolute; left: 60px; right: 60px; top: 150px; background: rgba(246,239,224,.97); border-radius: 18px; padding: 18px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.4); transform-origin: 50% 0; color: #2a2622; }
  #inv h3 { margin: 0 0 10px; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #e2d8c3; padding-bottom: 10px; }
  #inv h3 i { width: 40px; height: 40px; border-radius: 50%; background: #f5c542; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 20px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px dashed #e2d8c3; transform-origin: 0 50%; }
  .row .ri { width: 40px; height: 40px; border-radius: 50%; background: #efe7d6; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .row .rt { flex: 1; } .row .rt b { display: block; font-size: 20px; } .row .bar { height: 10px; border-radius: 5px; background: #e6dfd0; overflow: hidden; margin-top: 6px; } .row .bar i { display: block; height: 100%; background: #2f9e5a; width: 0; }
  .row .rv { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; } .row .rv small { font-size: 15px; font-weight: 400; color: #6b645a; }
  .row .ok { width: 28px; height: 28px; border-radius: 50%; background: #2f9e5a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  /* ---- การ์ดจบ ---- */
  #card { position: absolute; inset: 0; background: #0b0b0f; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  #card .ep { font-size: 110px; font-weight: 700; letter-spacing: 1px; }
  #card .ln { width: 220px; height: 4px; background: #d7342c; margin: 10px 0 26px; }
  #card .tz { font-size: 30px; font-weight: 600; color: #f0b8b3; text-align: center; }
  #card .q { font-size: 170px; font-weight: 700; color: #fff; opacity: .9; margin-bottom: 30px; }
  /* ---- Post FX ---- */
  #grade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,205,150,.14), rgba(90,60,120,.12)); mix-blend-mode: soft-light; }
  #warm  { position: absolute; inset: 0; background: #f0c48a; mix-blend-mode: multiply; opacity: .10; }
  #vig   { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 65% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #grainsvg { position: absolute; inset: 0; width: 720px; height: 1280px; mix-blend-mode: overlay; opacity: .16; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #fade  { position: absolute; inset: 0; background: #000; opacity: 0; }
  #redpulse { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(215,52,44,0) 40%, rgba(215,52,44,.6) 100%); opacity: 0; }
</style>
</head>
<body>
<div id="frame">
  <svg id="stage" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ui">
    <div id="hud"></div>
    <div id="chips" style="display:none"></div>
    <div id="inv" style="display:none"></div>
    <div id="nametag" style="display:none"></div>
    <div id="stamp" style="display:none"></div>
    <div id="sub"></div>
    <div id="card" style="display:none"></div>
  </div>
  <div id="post">
    <div id="warm"></div><div id="grade"></div><div id="vig"></div>
    <svg id="grainsvg" viewBox="0 0 720 1280"><filter id="grainF"><feTurbulence id="grainT" type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="1"/><feColorMatrix type="saturate" values="0"/></filter><rect width="720" height="1280" filter="url(#grainF)"/></svg>
    <div id="redpulse"></div><div id="flash"></div><div id="fade"></div>
  </div>
</div>
<script src="../hyperframe/hyperframe.js"></script>
<script src="art.js"></script>
<script src="timeline.data.js"></script>
<script src="ui.js"></script>
<script src="shots.js"></script>
<script src="shots2.js"></script>
<script>
  // จุดเข้า: render.js เรียก window.render(t) ต่อเฟรม
  const stage = document.getElementById('stage');
  stage.innerHTML = ART.defs() + '<g id="world" clip-path="url(#clipFrame)"></g>';
  HF.mount(document.getElementById('world'), document.getElementById('ui'));
  window.render = t => { HF.seek(t); document.getElementById('grainT').setAttribute('seed', 1 + Math.floor(t * 30) % 60); };
  window.READY = document.fonts.ready.then(() => { window.render(0); return true; });
  // พรีวิวในเบราว์เซอร์: ?t=12.5 หรือกดเล่นด้วย ?play
  const qs = new URLSearchParams(location.search);
  if (qs.has('t')) window.READY.then(() => window.render(parseFloat(qs.get('t'))));
  if (qs.has('play')) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % TIMELINE.total); requestAnimationFrame(loop); }; window.READY.then(loop); }
</script>
</body>
</html>
