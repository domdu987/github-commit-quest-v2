<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../demo/fonts/local.css"></head><body style="margin:0;background:#f1e8da">
<div id="frame" style="width:1080px;height:1920px;position:relative"><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg></div>
<script src="../demo/engine.js"></script><script src="../story2/puppet2.js"></script><script src="../demo/sets.js"></script><script src="chars6.js"></script>
<script>
const s = document.getElementById('s'); const defs = svg('defs', {}, s);
const modes = [['sit', 200, 400], ['stand', 560, 400], ['run', 900, 400], ['lie', 220, 800], ['jump', 600, 800]];
for (const [m, x, y] of modes) { const d = new Luukchin(s, {}); d.pose({ x, y, s: 1.2, f: 1, mode: m, t: 0.5, ph: 0.7, wag: 1, mouth: m === 'run' || m === 'jump' ? 1 : 0, eyes: m === 'jump' ? 'happy' : 'open', rot: m === 'jump' ? -28 : 0 }); }
const old = new Luukchin(s, { old: true }); old.pose({ x: 900, y: 800, s: 1.2, f: -1, mode: 'lie', t: 0.5, wag: 0.1, perk: 0.2, sad: 1, eyes: 'open' });
const own = new Puppet(s, OWNER, defs); own.pose({ x: 250, y: 1250, s: 1.3, f: 1, t: 1, smile: 0.6 });
const home = new Puppet(s, OWNER_HOME, defs); home.pose({ x: 560, y: 1250, s: 1.3, f: -1, t: 1, smile: 0.9, grin: 1 });
dogFace(s, 870, 1100, 80, { happy: true, tongue: true }); dogFace(s, 870, 1400, 80, { old: true });
window.render = () => {}; window.DURATION = 0.1; window.ready = document.fonts.ready.then(() => true);
</script></body></html>
