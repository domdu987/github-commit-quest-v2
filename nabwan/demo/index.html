<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
html, body { margin: 0; background: #000; }
#frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #141a33; font-family: 'Kanit', sans-serif; }
.shot { position: absolute; inset: 0; display: none; overflow: hidden; }
.cam { position: absolute; inset: 0; }
.cam > svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.ui { position: absolute; inset: 0; }
.dim { position: absolute; inset: 0; }

/* data cards: cream paper, colored rail, gold numerals (the video's card language) */
.card { position: absolute; background: #e9e3d7; border-radius: 26px; box-shadow: 0 18px 44px rgba(0,0,0,.38); border-left: 14px solid #ae7f25; padding: 24px 34px 28px; color: #23242f; transform-origin: 0 0; }
.card.pink { border-left-color: #dc6c89; }
.card .lbl { font-weight: 500; font-size: 34px; color: #4d4a55; padding-bottom: 12px; border-bottom: 2px solid #cfc8be; }
.card .num { font-weight: 700; font-size: 128px; line-height: 1; color: #ae7f25; display: flex; align-items: baseline; gap: 22px; padding-top: 16px; font-variant-numeric: tabular-nums; }
.card .num small { font-weight: 600; font-size: 48px; color: #23242f; }

.clock { position: absolute; display: flex; align-items: center; gap: 20px; background: #e9e3d7; border-radius: 22px; border-left: 12px solid #ae7f25; padding: 16px 30px 20px 20px; box-shadow: 0 14px 32px rgba(0,0,0,.38); color: #23242f; transform-origin: 0 0; }
.clock .ic { width: 70px; height: 70px; border-radius: 50%; background: #2a3157; display: grid; place-items: center; }
.clock .tl { font-weight: 500; font-size: 27px; color: #4d4a55; line-height: 1.15; }
.clock .tt { font-weight: 700; font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .sl { height: 8px; border-radius: 8px; background: linear-gradient(90deg, #2a3157, #e2a77d); margin-top: 12px; position: relative; width: 220px; }
.clock .sl i { position: absolute; top: -7px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #555; margin-left: -11px; }

.pill { position: absolute; display: flex; align-items: center; gap: 12px; background: #1d2238; color: #fff; border: 2px solid #3a4060; border-radius: 999px; padding: 12px 28px; font-weight: 500; font-size: 34px; transform-origin: 50% 50%; white-space: nowrap; }
.pill.red b { color: #ff7b6e; }
.pill.green { border-color: #4f9359; }
.pill.green b { color: #8fd49b; }

.bubble { position: absolute; background: #4a7bd8; color: #fff; font-weight: 500; font-size: 38px; padding: 18px 30px; border-radius: 36px 36px 10px 36px; box-shadow: 0 12px 28px rgba(0,0,0,.35); display: flex; align-items: center; gap: 12px; transform-origin: 100% 100%; white-space: nowrap; }

#subs { position: absolute; left: 0; right: 0; top: 1196px; text-align: center; font-weight: 600; font-size: 52px; line-height: 1.35; padding: 0 50px; }
.sub-w { color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.6); }
.sub-y { color: #f2c75f; text-shadow: 0 3px 10px rgba(0,0,0,.7), 0 0 3px rgba(0,0,0,.6); }
.sub-r { background: #cf483d; color: #fff; padding: 4px 22px 9px; border-radius: 14px; margin-left: 12px; box-shadow: 0 8px 18px rgba(0,0,0,.3); }

.waffle { display: grid; grid-template-columns: repeat(26, 28px); gap: 5px; margin-top: 22px; }
.waffle i { display: block; width: 28px; height: 28px; border-radius: 5px; background: #d9d2c4; }
.waffle i.on { background: #c9962b; }
.legend { display: flex; gap: 46px; margin-top: 26px; align-items: flex-end; }
.legend div { display: flex; align-items: baseline; gap: 12px; font-size: 34px; color: #4d4a55; font-weight: 500; }
.legend b { font-weight: 700; font-size: 64px; color: #ae7f25; font-variant-numeric: tabular-nums; }
.legend .gray b { color: #6e6a74; }
.legend s { display: inline-block; width: 26px; height: 26px; border-radius: 5px; background: #c9962b; text-decoration: none; transform: translateY(-4px); }
.legend .gray s { background: #d9d2c4; }

.title { position: absolute; left: 0; right: 0; text-align: center; color: #fff; }
</style>
</head>
<body>
<div id="frame"><div id="subs"></div></div>
<script src="engine.js"></script>
<script src="scenes.js"></script>
</body>
</html>
