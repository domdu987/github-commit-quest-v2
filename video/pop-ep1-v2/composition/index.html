          const x = (i, at) => tl.fromTo(`#t21-x${i}`, { opacity: 0, scale: 1.5, svgOrigin: i === 2 ? "540 950" : i === 0 ? "270 530" : "810 530" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", immediateRender: false }, at);
          x(0, t0 + 0.9); x(1, t0 + F("know3", 0, 1) + 0.6); x(2, t0 + vo("know3", 1) - 0.25);
          tl.fromTo("#t21-verdict", { opacity: 0, scale: 1.4, svgOrigin: "540 1400" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t0 + vo("know3", 1));
          PopUI.source(tl, document.getElementById(`${id}-light`), t0 + 0.4, D("know3") - 0.4, { text: "ที่มา: กรมควบคุมโรค (30 พ.ค. 2569) · คู่มือเห็ดพิษ (2566)", y: 1810 });
        },
      });

      // ---------- 22. the pot cut open on the fire: 100°C, the clock running, the poison still in it ----------
      add("know4", {
        set: "potX", setOpts: { id: "x22" }, dark: 0, light: false, grade: GFIRE,
        cam: { keys: [{ t: 0, ...fr(560, 1080, 0.95, 540, 1000) }, { t: D("know4"), ...fr(560, 1080, 1.02, 540, 1000) }] },
        captions: caps("know4"),
        extra(L) { put(L.light, `<g id="x22-label" opacity="0"><g transform="translate(470,420) rotate(-4)"><rect x="-270" y="-70" width="540" height="124" rx="22" fill="#e8302a"/><text y="20" text-anchor="middle" font-family="Mali" font-weight="700" font-size="66" fill="#fff">พิษยังอยู่!</text></g></g>`); },
        fx(tl, id, t0) {
          tl.fromTo("#x22-tox", { y: 0 }, { y: -16, duration: 0.4, repeat: Math.ceil(D("know4") / 0.4), yoyo: true, ease: "sine.inOut", immediateRender: false }, t0);
          tl.fromTo("#x22-hand", { attr: { transform: "rotate(0)" } }, { attr: { transform: "rotate(1440)" }, duration: 2.0, ease: "none", immediateRender: false }, t0 + F("know4", 0, 1) - 0.2);
          tl.fromTo("#x22-therm", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)", immediateRender: false }, t0 + 0.4);
          tl.fromTo("#x22-label", { opacity: 0, scale: 1.4, svgOrigin: "470 420" }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t0 + F("know4", 0, 2));
          tl.fromTo("#x22-tox", { scale: 1, svgOrigin: "430 1250" }, { scale: 1.1, duration: 0.2, repeat: 5, yoyo: true, immediateRender: false }, t0 + F("know4", 0, 2));
          PopUI.source(tl, document.getElementById(`${id}-light`), t0 + 0.4, D("know4") - 0.4, { text: "ที่มา: สคร.7 ขอนแก่น กรมควบคุมโรค (9 มิ.ย. 2566)", y: 1810 });
        },
      });

      // ---------- 23. dinner on the bench: ต้น on his second bowl; มิ้นท์ with her cup noodles ----------
      add("eat", {
        set: "kitchen2", setOpts: { id: "e23", stove: 980, platform: 330 }, dark: 0.1, blur: { sky: 4, far: 4, mid: 2, fg: 10 }, light: FIRE, grade: GFIRE,
        cam: { keys: [{ t: 0, ...fr(260, GK - 300, 1.35, 540, 1000) }, { t: vo("eat", 1) - 0.15, glide: 0.5, ...fr(520, GK - 300, 1.45, 540, 1000) }] },
        actors: [{ ...TON(200, GK + 40, 0.9, [{ t: 0, mode: "sitChair", eyes: "closed", mouth: "laugh" }, { t: voEnd("eat"), mode: "sitChair", eyes: "closed", mouth: "smile" }]), who: "tonBowl" },
          { ...MINT(520, GK + 40, 1.0, [{ t: 0, mode: "sitChair", eyes: "side", mouth: "flat" }, { t: vo("eat", 1), mode: "sitChair", eyes: "normal", mouth: "smile" }], { flip: true }), who: "mintNoodle" }],
        captions: caps("eat", undefined, { quote: true }),
        fx(tl, id, t0) { oneHand(id, 0); oneHand(id, 1); Pop2.flicker(tl, "e23", t0, D("eat")); },
      });

      // ---------- 24. the village asleep under the stars; the poison is slow (drawn as a timeline) ----------
      add("fine", {
        set: "village2", setOpts: { id: "v24", time: "night", fence: [-700] }, dark: 0.12, blur: { far: 2, fg: 8 }, light: MOON, grade: GNIGHT,
        cam: { keys: [{ t: 0, ...fr(540, 1000, 0.9, 540, 960) }, { t: vo("fine", 1) - 0.1, glide: 1.6, ...fr(140, GV - 560, 1.15, 540, 1080) }] },
        captions: caps("fine"),
        fx(tl, id, t0, L) {
          Pop2.particles(tl, L.glow, { type: "firefly", n: 16, box: [0, 900, 1400, 800], t0, dur: D("fine"), seed: 5 });
          PopUI.timeline(tl, L.light, t0 + vo("fine", 1), D("fine") - vo("fine", 1), { y: 520 });
          PopUI.source(tl, L.light, t0 + vo("fine", 1) + 0.3, D("fine") - vo("fine", 1) - 0.3, { text: "ที่มา: กรมควบคุมโรค (3 เม.ย. 2568)", y: 1380 });
        },
      });

      // ---------- 25. 2 a.m. on the same clock, moonlit ----------
      add("two", {
        set: "clock2", setOpts: { id: "ck25", night: true, hh: 60, mm: 0 }, dark: 0.2, blur: { far: 6 }, grade: GNIGHT,
        cam: { keys: [{ t: 0, ...fr(540, 860, 1.12, 540, 880) }, { t: D("two"), ...fr(540, 860, 1.2, 540, 880) }] },
        captions: caps("two"),
        fx(tl, id, t0) { tl.fromTo("#ck25-ss", { attr: { transform: "rotate(0)" } }, { attr: { transform: "rotate(12)" }, duration: D("two"), ease: "steps(2)", immediateRender: false }, t0); Fx.heart(tl, t0, D("two"), 0.5, 0.5); },
      });

      // ---------- 26. upstairs under the net: มิ้นท์ sits up; chewing sounds come up through the floor ----------
      add("sound", {
        set: "bedroom2", setOpts: { id: "b26", phone: true }, dark: 0.2, blur: { sky: 6, mid: 3, fg: 10 }, light: MOON, grade: GNIGHT,
        cam: { keys: [{ t: 0, ...fr(560, GB + 60 - 400 * 2.0, 1.0, 540, 900) }, { t: D("sound"), ...fr(560, GB + 60 - 400 * 2.0, 1.08, 540, 900) }] },
        actors: [MINT(560, GB + 60, 2.0, [{ t: 0, mode: "sit", eyes: "closed", mouth: "flat" }, { t: 0.4, mode: "sit", eyes: "wide", mouth: "o" }, { t: voEnd("sound") + 0.1, mode: "sit", eyes: "side", mouth: "flat" }])],
        captions: caps("sound", undefined, { quote: true }),
        fx(tl, id, t0, L) {
          PopUI.sfx(tl, L.light, t0 + 0.25, 1.2, "กร้วม…", 330, 1680, { size: 84, rot: -8 }); PopUI.sfx(tl, L.light, t0 + 1.2, 1.3, "กร้วม…", 800, 1850, { size: 100, rot: 6 });
          Fx.heart(tl, t0 + 0.4, D("sound") - 0.4, 0.42, 0.55);
        },
      });

      // ---------- 27. top-down through the gap in the floorboards: dark, embers — two green eyes look up. One hit, cut ----------
      const PB = 1.2, PC = 3.0, PD = 3.4;
      add("peek", {
        set: "gap2", setOpts: { id: "gp27" }, dark: 0.08, blur: { mid: 2 }, grade: GLATE,
        cam: { keys: [{ t: 0, ...fr(560, 960, 1.0, 540, 960) }, { t: PB, glide: 1.6, ...fr(560, 980, 1.35, 540, 960) }] },
        extra(L) { put(L.light, `<g id="pk-face" opacity="0">${Pop2.pobFace(540, 1000, 1.25, { id: "pk-f" })}</g>`); },
        fx(tl, id, t0) {
          tl.set("#gp27-pob-eyes", { opacity: 0 }, t0);
          tl.to("#gp27-pob-eyes", { opacity: 1, duration: 0.5, ease: "power1.in" }, t0 + PB);
          tl.to("#gp27-pob-eyes", { x: "+=8", duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, t0 + PB + 0.8);
          Fx.heart(tl, t0 + 0.3, PC - 0.3, 0.6, 0.65);
          tl.to("#gp27-pob-eyes", { opacity: 0, duration: 0.08 }, t0 + PC);
          tl.fromTo("#pk-face", { opacity: 0, scale: 1.25, svgOrigin: "540 1000" }, { opacity: 1, scale: 1, duration: 0.09, ease: "power4.out", immediateRender: false }, t0 + PD);
          Fx.glitch(tl, `#${id}`, t0 + PD + 0.05, 0.18, 16, 927);
          tl.set("#black", { opacity: 1 }, t0 + PD + 0.22);
        },
      });

      // ---------- 28. morning: in the dirt by the pot, bare prints with toes far too long — and the trail, out across the yard to ลุงทองดี's ----------
      split("clue", vo("clue", 1) - 0.1, {
        set: "printsTop", setOpts: { id: "c28" }, dark: 0, light: false, grade: { top: "#ffe8b8", bottom: "#4a3a5a", op: 0.25 },
        cam: { keys: [{ t: 0, ...fr(540, 760, 1.0, 540, 960) }, { t: vo("clue", 1) - 0.1, ...fr(640, 1300, 1.0, 540, 960) }] },
        captions: caps("clue").filter((c) => c.t < vo("clue", 1) - 0.1),
        fx(tl, id, t0) {
          tl.set("#black", { opacity: 0 }, t0);
          for (let i = 0; i < 8; i++) tl.fromTo(`#c28-p${i}`, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t0 + 0.3 + i * 0.32);
          Fx.heart(tl, t0, vo("clue", 1), 0.45, 0.55);
        },
      }, {
        set: "kok2", setOpts: { id: "c28b", mound: false, house: [940, 0.6], fence: [560, 10, GF + 100], trunks: [[-200, 120], [1300, 110]], fgTrunk: false }, dark: 0, blur: { far: 3, mid: 2, fg: 10 }, light: SUN,
        grade: { top: "#ffe8b8", bottom: "#4a3a5a", op: 0.3 },
        cam: { keys: [{ t: 0, ...fr(480, 1420, 1.0, 540, 1250) }, { t: D("clue") - vo("clue", 1) + 0.1, glide: D("clue") - vo("clue", 1) - 0.3, ...fr(640, 1120, 0.96, 540, 1020) }] },
        actors: [MINT(250, GF + 600, 1.05, [{ t: 0, mode: "idle", eyes: "wide", mouth: "o" }], { flip: false }), TON(120, GF + 650, 0.88, [{ t: 0, mode: "idle", eyes: "side", mouth: "flat" }])],
        captions: capsFrom("clue", vo("clue", 1) - 0.1),
        extra(L) { put(L.set, Pop2.trail(380, 2120, 830, 1450, 7, 0.95, 0.26, { toe: 1.9 })); },
        fx(tl, id, t0) { Fx.heart(tl, t0, D("clue") - vo("clue", 1), 0.45, 0.55); },
      });

      // ---------- 29. under the net at first light: ต้น curled up, holding his stomach; มิ้นท์ beside him ----------
      add("pain", {
        set: "bedroom2", setOpts: { id: "b29" }, dark: 0.12, blur: { sky: 4, mid: 2, fg: 10 }, light: MOON, grade: { top: "#5a6a9a", bottom: "#2a1a3a", op: 0.3 },
        cam: { keys: [{ t: 0, ...fr(560, GB - 160, 1.25, 540, 1050) }, { t: D("pain"), ...fr(560, GB - 160, 1.35, 540, 1050) }] },
        actors: [MINT(430, GB - 40, 0.95, [{ t: 0, mode: "idle", eyes: "worry", mouth: "o" }], { flip: true }), TON(820, GB + 80, 1.05, [{ t: 0, mode: "lie", eyes: "closed", mouth: "frown" }])],
        captions: caps("pain", undefined, { quote: true }),
        fx(tl, id, t0) { Fx.heart(tl, t0, D("pain"), 0.4, 0.6); },
      });

      // ---------- 30. the choice: hospital now / wait for morning — the "wait" side gets taken over ----------
      add("choice", {
        set: "bedroom2", setOpts: { id: "b30" }, dark: 0.35, blur: { sky: 6, mid: 6, set: 6, act: 4, fg: 10 }, light: MOON, grade: GNIGHT,
        cam: { keys: [{ t: 0, ...fr(560, GB - 160, 1.35, 540, 1150) }] },
        actors: [TON(820, GB + 80, 1.05, [{ t: 0, mode: "lie", eyes: "closed", mouth: "frown" }])],
        fx(tl, id, t0, L) {
          PopUI.choice(tl, L.light, t0 + 0.05, D("choice") - 0.05, { q: "จะทำยังไง?", a: "พาไปโรงพยาบาล", b: "รอเช้าค่อยไป", secs: 3, y: 780,
            possessed: { at: 1.0, side: "b", glitch: "รอเช้า…", who: "…นอนเถอะ เดี๋ยวก็หาย" } });
          Fx.heart(tl, t0, D("choice"), 0.38, 0.85); Fx.tunnel(tl, t0, t0 + D("choice") + 0.5, 0.75);
          Fx.glitch(tl, `#${id}`, t0 + 1.0, 0.3, 12, 930); Fx.glitch(tl, `#${id}`, t0 + D("choice") - 0.6, 0.4, 18, 931);
          tl.set("#black", { opacity: 1 }, t0 + D("choice") - 0.2);
        },
      });

      // ---------- 31. end card: the community-forest sign, a note from ยายคำ pinned under it ----------
      add("next", {
        set: "sign2", setOpts: { id: "sg", ep: "ตอนที่ 2", title: "เอาเห็ดไปหาหมอ" }, dark: 0, blur: { far: 6, mid: 5, fg: 10 }, grade: GDAY,
        cam: { keys: [{ t: 0, ...fr(540, 880, 1.0, 540, 900) }, { t: D("next"), ...fr(540, 880, 1.05, 540, 900) }] },
        fx(tl, id, t0, L) {
          tl.set("#black", { opacity: 0 }, t0 + 0.3);
          tl.fromTo("#sg-sign", { rotation: -9, svgOrigin: "540 500" }, { rotation: 0, duration: 1.6, ease: "elastic.out(1,0.4)", immediateRender: false }, t0 + 0.3);
          tl.fromTo("#sg-note", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, t0 + 0.6);
          dust(L, t0, D("next"), 8, 24)(tl);
        },
      });

      shots.forEach((sh) => { const f = sh.fx; sh.fx = (tl, id, t0, L) => { if (f) f(tl, id, t0, L); Pop.life(tl, `#${id}`, t0, sh.dur); }; });
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">เห็ดปอบ · EP.1</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);
      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
