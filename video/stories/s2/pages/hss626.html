<font color="#FF0004" style="margin-left:20px;"><h2 align="left" style="margin-top:0px;margin-bottom: 0px"><b style="margin-left:20px;">กรมสบส.แนะประชาชน ท้องเสีย  ห้าม!! กินยาหยุดถ่าย  ชี้จะทำให้อาการรุนแรงขึ้น แนะดื่มผงน้ำตาลเกลือแร่แทนน้ำ</b></h2></font>
    <label align="left" style=" margin-right:0px; margin-left:5px;width: 100%;text-align: left;">&nbsp;&nbsp;
	กรมสนับสนุนบริการสุขภาพ แนะนำประชาชนป้องกันโรคอุจจาระร่วง ขอให้ดื่มน้ำสะอาดบรรจุขวด  รับประทานอาหารปรุงสุกใหม่  ล้างมือฟอกสบู่หรือล้างด้วยเจลแอลกอฮอล์หลังจากเข้าห้องน้ำและก่อนรับประทานอาหารทุกครั้ง ชี้หากมีอาการท้องเสีย ห้ามกินยาหยุดถ่าย เนื่องจากจะทำให้เชื้ออยู่ร่างกายนาน อาการอาจรุนแรงขึ้น แนะให้ดื่มผงน้ำตาลเกลือแร่แทน
	นายแพทย์วิศิษฎ์  ตั้งนภากร อธิบดีกรมสนับสนุนบริการสุขภาพ (กรมสบส.) กระทรวงสาธารณสุข ให้สัมภาษณ์ว่า จากการวิเคราะห์ปัญหาสุขภาพของประชาชนที่เดินทางไปถวายราชสักการะพระบรมศพพระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดช  และใช้บริการที่หน่วยแพทย์ต่างๆทั้งภาครัฐและเอกชนซึ่งตั้งอยู่ที่บริเวณท้องสนามหลวงและใกล้เคียง 38 แห่ง พบว่าประชาชนเกิดอาการท้องเสียทุกวัน  อย่างเช่นวันที่ 26 ตุลาคม 2559 พบ 45 ราย  วันที่ 25 ตุลาคม พบ 34 ราย ส่วนใหญ่พบในช่วงเช้าจนถึงเที่ยงคืน  จึงขอให้ประชาชนระมัดระวังสุขภาพ  โดยเฉพาะเรื่องความสะอาดของมือ อาหารและน้ำดื่ม   
	สำหรับสาเหตุโรคท้องเสีย  เกิดมาจากการรับประทานอาหารและเครื่องดื่มที่ไม่สะอาด ไม่ล้างมือให้สะอาดก่อนการเตรียมหรือปรุงอาหารหรือก่อนรับประทานอาหาร  และภาชนะใส่อาหารและน้ำสกปรกหรือมีเชื้อโรคปะปน   อาการสำคัญของโรคนี้คือ• ถ่ายอุจจาระเหลวมากกว่า 3 ครั้งต่อวัน หรือถ่ายเป็นน้ำหรือถ่ายเป็นมูกปนเลือด • อาจมีอาเจียนร่วมด้วย  โดยอาการอาจมีเพียงเล็กน้อยจนกระทั่งรุนแรง โรคนี้จะมีผลให้ร่างกายขาดน้ำและเกลือแร่จำนวนมากและรวดเร็ว ทำให้เกิดภาวะขาดน้ำและอ่อนเพลีย  จนทำให้ช็อกหมดสติ ถึงแก่ชีวิตได้ โดยเฉพาะในเด็กเล็กและผู้สูงอายุ 
นายแพทย์วิศิษฏ์ กล่าวต่อว่า เรื่องที่ต้องระมัดระวังคือเมื่อเกิดท้องเสียแล้วไม่ควรซื้อยาหยุดถ่ายมากิน  เนื่องจากยาหยุดถ่ายจะทำให้ลำไส้หยุดบีบตัว และเก็บกักเชื้อโรคที่เป็นต้นเหตุไว้ในลำไส้นานขึ้น  ส่งผลให้ร่างกายกำจัดเชื้อโรคได้ช้าลง และเป็นผลเสีย ทำให้ท้องอืด ปวดแน่นท้องมากขึ้น และอาจทำให้อาการรุนแรงขึ้นได้ การดูแลที่ถูกต้องคือให้รับประทานอาหารอ่อนย่อยง่าย เช่น ข้าวต้ม โจ๊กหรือน้าข้าว เพื่อป้องกันการขาดสารอาหาร และดื่มสารละลายเกลือแร่ (Oral rehydration salts, ORS) เพื่อป้องกันอาการขาดน้ำและเกลือแร่ที่เสียไปจากการท้องเสีย ซึ่งวิธีการรับประทานเกลือแร่ที่ถูกต้องคือ จิบในปริมาณน้อยๆ ไปเรื่อยๆ แต่จิบบ่อยๆ และดื่มให้หมดภายใน 24 ชั่วโมง   หากอาการยังไม่ดีขึ้น และรู้สึกอ่อนเพลียมาก หน้ามืดหรือวิงเวียนเวลาเปลี่ยนท่าทางจากนั่งเป็นยืน ตาลึกบุ๋ม ปัสสาวะไม่ออกหรือปัสสาวะลดลง ปากแห้ง กระหายน้ำบ่อยและมาก ควรไปพบแพทย์
	สำหรับการป้องกันโรคท้องเสีย  ขอให้ประชาชนหมั่นล้างมือบ่อยๆ ด้วยน้ำและสบู่หรือล้างด้วยเจลแอลกอฮอล์ โดยเฉพาะหลังเข้าห้องน้ำและก่อนรับประทานอาหารทุกครั้ง  เพื่อกำจัดเชื้อโรคออกไปจากมือ   รับประทานอาหารที่ปรุงสุกใหม่ ไม่มีส่วนประกอบของกะทิซึ่งบูดเสียได้ง่าย   ดื่มน้ำสะอาดบรรจุขวด  และก่อนการบริโภคทุกครั้ง ขอให้สังเกตวันหมดอายุ และสภาพของอาหารว่ามีกลิ่นและสีเป็นปกติหรือไม่ 
</label><br>
