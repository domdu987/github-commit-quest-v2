      add("ring", { set: "rupYardRich", setOpts: { id: "rg", time: "dusk", muddy: 0.95, crackDraw: true }, dark: 0.15, light: DAWN, grade: GDAWN,
        cam: PUSH("ring", 1.5, 1.65, 300, 180),
        actors: [A("mook", 600, 1500, 0.5, [{ t: 0, mode: "point", eyes: "wide", mouth: "o" }], { talk: [TALK("ring", 0, "o")] })],
        captions: caps("ring", undefined, { quote: true }), fx(tl, id, t0, L) { Rup.cracks(tl, "rgy", t0, 1.8); } });
      // ---------- 28. cutaway under ยาย's house: no water left ----------
      add("close", { set: "rupCut2", setOpts: { id: "cl", stage: 1, wt0: 1240, pumpY: 1480 }, dark: 0, light: false, grade: GDAY, shake: SHAKE(2.9, 4, 1.0),
        cam: TWO("close", 2.6, [-280, -60, 1.5], [-280, -60, 1.56], [-120, 200, 1.3], [-120, 200, 1.36]),
        captions: caps("close"), fx(tl, id, t0, L) { Rup.cutLife(tl, "cl", t0, D("close"), { wt0: 1240, wt1: 1240, at: { pump: 9, drop: 9, drain: 0, ravel: 0.3, fall: 9 } }); } });
      // ---------- 29. the choice ----------
      add("choice", { set: "rupRim2", setOpts: { id: "ch", ...RIM_N, props: false }, dark: 0.5, light: false, grade: GNIGHT, blur: { sky: 4, far: 4, mid: 4, set: 4 },
        cam: { keys: [ID(0), { ...ID(D("choice"), 0, 0, 1.04), glide: D("choice") }] }, captions: caps("choice"),
        fx(tl, id, t0, L) { RupUI.choice(tl, L.light, t0 + 0.1, D("choice") - 0.1, { a: "ตามยายเข้าไป", b: "เรียกเจ้าหน้าที่" }); } });
      // ---------- 30. end card ----------
      add("end", { set: "rupRim2", setOpts: { id: "en", ...RIM_N, props: false }, dark: 0.3, light: false, grade: GNIGHT,
        cam: { keys: [ID(0)] }, captions: [],
        fx(tl, id, t0, L) { RupUI.endCard(tl, L.light, t0, D("end"), { ep: "ตอนที่ 3 (ตอนจบ)", title: "ไหว้ไกลร้อยเมตร" }); } });
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">รูพญานาค · EP.2</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);
      Engine.build(root, tl, shots);
      // numbers on shirts and notes stay readable on characters drawn facing left (flip = scale(-s,s))
      document.querySelectorAll(".rk-txt").forEach((t) => { if (t.parentElement.closest("[transform*='scale(-']")) t.setAttribute("transform", "scale(-1,1)"); });

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      // a render slice (TK_RANGE, same as video/takhian/RENDER-SPLIT.md): play only [a, b) of the episode — the clips are shifted by -a
      // and the published timeline scrubs the real one from a to b, so frame n of the slice is frame round(a*60)+n of the whole episode
      if (window.TK_RANGE) { const [a, b] = window.TK_RANGE;
        document.querySelectorAll(".clip").forEach((c) => { c.dataset.start = (+c.dataset.start - a).toFixed(4); });
        const outer = gsap.timeline({ paused: true }); outer.add(tl.tweenFromTo(a, b, { ease: "none", duration: b - a }), 0);
        window.__timelines["main"] = outer; outer.seek(0);
      } else { window.__timelines["main"] = tl; tl.seek(0); }
