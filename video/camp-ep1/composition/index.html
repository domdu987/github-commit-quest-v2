    <div id="root" data-composition-id="main" data-start="0" data-duration="122.661" data-width="1080" data-height="1920">

    <script>
      const SCHED = {"total": 122.661, "shots": [{"key": "open", "start": 0.0, "dur": 8.439, "vo": [{"id": "d00", "t": 0.3, "dur": 3.459}, {"id": "n00", "t": 1.7, "dur": 5.139}], "voEnd": 6.839}, {"key": "arrive", "start": 8.439, "dur": 8.731, "vo": [{"id": "n01", "t": 0.3, "dur": 4.236}, {"id": "n02", "t": 4.736, "dur": 2.695}], "voEnd": 7.431}, {"key": "ranger", "start": 17.17, "dur": 7.679, "vo": [{"id": "d01", "t": 0.4, "dur": 6.779}], "voEnd": 7.179}, {"key": "van", "start": 24.849, "dur": 6.513, "vo": [{"id": "n03", "t": 0.3, "dur": 1.916}, {"id": "d02", "t": 2.416, "dur": 3.297}], "voEnd": 5.713}, {"key": "fire", "start": 31.362, "dur": 8.046, "vo": [{"id": "n04", "t": 0.4, "dur": 2.83}, {"id": "n05", "t": 3.43, "dur": 3.516}], "voEnd": 6.946}, {"key": "call", "start": 39.408, "dur": 6.502, "vo": [{"id": "d03", "t": 0.1, "dur": 4.41}, {"id": "d04", "t": 4.21, "dur": 1.992}], "voEnd": 6.202}, {"key": "choice", "start": 45.91, "dur": 6.475, "vo": [{"id": "d05", "t": 2.5, "dur": 1.975}], "voEnd": 4.475}, {"key": "lost", "start": 52.385, "dur": 4.041, "vo": [{"id": "n07", "t": 0.7, "dur": 2.841}], "voEnd": 3.541}, {"key": "stop", "start": 56.426, "dur": 5.684, "vo": [{"id": "n08", "t": 0.2, "dur": 4.484}], "voEnd": 4.684}, {"key": "whistle", "start": 62.11, "dur": 9.56, "vo": [{"id": "n09", "t": 1.4, "dur": 3.213}, {"id": "n10", "t": 6.513, "dur": 2.347}], "voEnd": 8.86}, {"key": "hide", "start": 71.67, "dur": 9.86, "vo": [{"id": "n11", "t": 0.8, "dur": 2.151}, {"id": "n12", "t": 3.251, "dur": 5.609}], "voEnd": 8.86}, {"key": "snake", "start": 81.53, "dur": 3.856, "vo": [{"id": "d06", "t": 1.0, "dur": 2.256}], "voEnd": 3.256}, {"key": "firstaid", "start": 85.386, "dur": 11.751, "vo": [{"id": "n13", "t": 0.2, "dur": 6.529}, {"id": "d07", "t": 6.929, "dur": 3.822}], "voEnd": 10.751}, {"key": "radio", "start": 97.137, "dur": 8.127, "vo": [{"id": "d08", "t": 0.3, "dur": 3.179}, {"id": "n15", "t": 3.679, "dur": 3.848}], "voEnd": 7.527}, {"key": "message", "start": 105.264, "dur": 6.696, "vo": [{"id": "d09", "t": 2.2, "dur": 4.096}], "voEnd": 6.296}, {"key": "who", "start": 111.96, "dur": 4.428, "vo": [{"id": "d10", "t": 0.2, "dur": 3.828}], "voEnd": 4.028}, {"key": "window", "start": 116.388, "dur": 6.273, "vo": [{"id": "d11", "t": 0.8, "dur": 4.173}], "voEnd": 4.973}]};
      const SH = Object.fromEntries(SCHED.shots.map((s) => [s.key, s]));
      const vo = (k, i = 0) => SH[k].vo[i].t;            // voice start, relative to shot
      const voEnd = (k, i = 0) => SH[k].vo[i].t + SH[k].vo[i].dur;
      const D = (k) => SH[k].dur;
      const root = document.getElementById("root");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // extra poses for this episode
      Rig.MODES.crouchShush = (u, o) => ({ ...Rig.MODES.crouch(u, o), uaF: -100, faF: -150, torso: 14, head: -6 });
      Rig.MODES.sitHurt = (u, o) => ({ ...Rig.MODES.sit(u, o), uaF: 20, faF: -20, uaB: 30, faB: -10, torso: -8 + 1.5 * Math.sin(u * 7), head: -10 });

      const cap = (k, text, t, end) => ({ text, t: t ?? vo(k), end });
      const walkV = (s) => Rig.footSpeed(0.96, 16) * s;   // px/s that keeps a walking foot planted
      const runV = (s) => Rig.footSpeed(0.56, 30) * s;
      const shots = [];
      const add = (k, spec) => shots.push({ start: SH[k].start, dur: SH[k].dur, key: k, ...spec });
      const scope = (id) => `#${id}`;
      const flick = (id, t0, k) => Camp.flicker(tl, scope(id), t0, D(k));
      const CAMP_DUSK = { time: "dusk" }, CAMP_NIGHT = { time: "night" };

      // ---------- 1. cold open: a whisper on black, a torch clicks on, the choice appears ----------
      add("open", {
        set: "forest", setOpts: { seed: 7, width: 2400 }, dark: 0.62,
        cam: { from: { x: 20, y: 240, s: 1.3 }, to: { x: 20, y: 190, s: 1.45 } },
        actors: [{ who: "pin", x: 560, y: 1600, s: 1.1, flip: true, track: [
          { t: 0, mode: "torch", torch: true, eyes: "wide", mouth: "o" },
          { t: vo("open", 1) - 0.2, mode: "torch", torch: true, look: -10, eyes: "side", mouth: "flat", blend: 0.4 },
          { t: vo("open", 1) + 2.8, mode: "tremble", torch: true, eyes: "wide", mouth: "o", blend: 0.5 }] }],
        captions: [cap("open", "ถ้าวันหนึ่ง… [ใครเรียกชื่อ]คุณกลางป่า", vo("open", 1))],
        sfxText: [{ text: "ปิ่น…", x: 760, y: 560, t: 0.45, end: 1.6, size: 64, color: "#9fb8bf", rot: -4 },
                  { text: "ปิ่นนน…", x: 120, y: 720, t: 1.8, end: 3.6, size: 58, color: "#7f969c", rot: 5 }],
        ui: [{ type: "choice", t: vo("open", 1) + 2.6, q: "ถ้าเป็นคุณ… จะทำยังไง?", a: "ขานรับ", b: "เงียบไว้", secs: 5, top: 160 }],
        fx(tl, id, t0) {
          tl.set("#black", { opacity: 1 }, t0); tl.set("#black", { opacity: 0 }, t0 + 1.15);
          tl.fromTo(`#${id}-dark`, { opacity: 0.9 }, { opacity: 0.62, duration: 0.6, immediateRender: false }, t0 + 1.15);
          tl.set("#black", { opacity: 1 }, t0 + D("open") - 0.16); tl.set("#black", { opacity: 0 }, t0 + D("open"));
          flick(id, t0, "open");
        },
      });

      // ---------- 2. ten hours earlier: the camp at golden hour; cast intro tags ----------
      add("arrive", {
        set: "camp", setOpts: CAMP_DUSK, dark: 0.04,

        ui: [
          { type: "tip", t: 0.35, end: vo("firstaid", 1) - 0.1, ill: "snake", tone: "danger", label: "งูกัด · ปฐมพยาบาล", text: "ห้าม [กรีด · ดูด · ขันชะเนาะ]<br>ขยับให้น้อย → รีบไปโรงพยาบาล", top: 160 },
          { type: "rel", t: vo("firstaid", 1) + 0.2, end: voEnd("firstaid", 1) + 0.25, a: "kla", b: "pin", text: "กล้า ↔ ปิ่น · ความไว้ใจ", from: 3, top: 170 },
          { type: "tip", t: voEnd("firstaid", 1) + 0.3, ill: "map", tone: "rule", label: "เป้าหมายใหม่", text: "พาปิ่นไป [หน่วยพิทักษ์ป่า]", top: 170 },
        ],
        extra(L) { L.fg.innerHTML = ""; },
        fx(tl, id, t0) {
          // a splint (two sticks + cloth ties) on Pin's front shin; actors exist by the time fx runs
          document.getElementById(`${id}-a0-shF`).insertAdjacentHTML("beforeend", `<g id="${id}-splint" opacity="0"><rect x="-27" y="4" width="10" height="126" rx="4" fill="#7a5c3c" stroke="#2e2a26" stroke-width="3"/>
            <rect x="17" y="4" width="10" height="126" rx="4" fill="#7a5c3c" stroke="#2e2a26" stroke-width="3"/><rect x="-30" y="30" width="60" height="14" rx="5" fill="#e07a4f" stroke="#2e2a26" stroke-width="3"/>
            <rect x="-30" y="92" width="60" height="14" rx="5" fill="#e07a4f" stroke="#2e2a26" stroke-width="3"/></g>`);
          flick(id, t0, "firstaid"); tl.fromTo(`#${id}-splint`, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, t0 + SPLINT); },
      });

      // ---------- 14. the ranger station: radio call, help is coming ----------
      add("radio", {
        set: "hut", dark: 0.12,
        cam: { from: { x: 20, y: 200, s: 1.1 }, to: { x: 40, y: 210, s: 1.16 } },
        actors: [
          { who: "chai", x: 470, y: 1520, s: 0.95, flip: true, prop: "mic", track: [{ t: 0, mode: "phoneEar", mouth: "o", eyes: "wide" }, { t: vo("radio", 1), mode: "idle", blend: 0.5, mouth: "smile" }] },
          { who: "pin", x: 640, y: 1540, s: 0.85, track: [{ t: 0, mode: "sitHurt", eyes: "pain", mouth: "frown" }, { t: vo("radio", 1) + 0.6, mode: "sit", eyes: "closed", mouth: "smile", blend: 0.6 }] },
          { who: "kla", x: 900, y: 1530, s: 0.9, flip: true, track: [{ t: 0, mode: "idle", mouth: "flat", sweat: true }, { t: vo("radio", 1) + 0.4, mode: "idle", mouth: "smile", blend: 0.5 }] },
        ],
        bubbles: [{ text: "“ศูนย์ ศูนย์… [ขอรถฉุกเฉินด่วน]!”", x: 70, y: 700, t: vo("radio"), end: voEnd("radio") + 0.2, tail: 340 }],
        captions: [cap("radio", "ทุกอย่าง… [กำลังจะโอเค]", vo("radio", 1))],
        ui: [
          { type: "tip", t: 0.6, end: voEnd("radio") + 0.2, ill: "sos", tone: "danger", label: "เจ็บป่วยฉุกเฉิน", text: "โทร [1669]", top: 160 },
          { type: "status", t: vo("radio", 1) + 0.5, who: "pin", name: "ปิ่น", text: "ปลอดภัยแล้ว", tone: "safe", side: "right", top: 170 },
        ],
        fx(tl, id, t0) { flick(id, t0, "radio"); },
      });

      // ---------- 15. a message that was sent at 15:12 ----------
      add("message", {
        set: "hut", dark: 0.22,
        cam: { from: { x: 20, y: -110, s: 1.4 }, to: { x: 30, y: -100, s: 1.56 } },
        actors: [{ who: "kla", x: 540, y: 1560, s: 1.25, prop: "phone", track: [{ t: 0, mode: "phoneLook", mouth: "flat" }, { t: 1.5, mode: "phoneLook", eyes: "wide", mouth: "o", sweat: true, blend: 0.2 }] }],
        bubbles: [{ text: "“พี่โจ้… [ไม่ได้ขึ้นมาตั้งแต่บ่าย]”", x: 160, y: 1180, t: vo("message"), end: D("message") - 0.1, tail: 300 }],
        ui: [{ type: "phone", t: 0.15, who: "joe", name: "พี่โจ้ (หัวหน้าค่าย)", msg: "ติดธุระในเมือง [คืนนี้พี่ขึ้นไปไม่ทัน]<br>ฝากแคมป์ด้วยนะ", time: "15:12", typing: 1.0, top: 150 }],
        extra(L) { L.glow.insertAdjacentHTML("beforeend", `<circle cx="790" cy="980" r="330" fill="url(#phoneglow)" opacity=".75"/>`); },
      });

      // ---------- 16. "then who was with us all day?" ----------
      add("who", {
        set: "hut", dark: 0.28,
        cam: { from: { x: 0, y: -100, s: 1.45 }, to: { x: 0, y: -90, s: 1.6 } },
        actors: [{ who: "pin", x: 560, y: 1580, s: 1.25, flip: true, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "frown" }] }],
        bubbles: [{ text: "“แล้วคนที่อยู่กับเราทั้งวัน… [คือใคร]”", x: 60, y: 1180, t: vo("who"), end: D("who") - 0.05, tail: 420 }],
        ui: [{ type: "status", t: 1.0, who: "unknown", name: "“พี่โจ้” ที่แคมป์", text: "ไม่ทราบตัวตน", tone: "unknown", side: "right", top: 170 }],
      });

      // ---------- 17. he is waiting at the treeline… then at the glass ----------
      const SCARE = D("window") - 0.95;
      add("window", {
        set: "hutWindow", dark: 0.3,
        cam: { from: { x: 0, y: -40, s: 1.0 }, to: { x: 200, y: 60, s: 1.55 } },
        extra(L, id) {
          const view = document.getElementById(id).querySelector(".winview");
          view.insertAdjacentHTML("beforeend", `<circle cx="740" cy="1010" r="120" fill="url(#lampglow)" opacity=".7"/>`);
          Rig.build(view, `${id}-jf`, Rig.CAST.joe).setAttribute("transform", "translate(740,1110) scale(-0.3,0.3)");
          Rig.drive(tl, `${id}-jf`, SH.window.start, D("window"), [{ t: 0, mode: "idle", mouth: "smile" }, { t: vo("window"), mode: "wave", blend: 0.6, mouth: "smile" }], []);
          view.insertAdjacentHTML("beforeend", `<g id="${id}-big" opacity="0"><circle cx="740" cy="1010" r="300" fill="url(#lampglow)" opacity=".8"/></g>`);
          Rig.build(document.getElementById(`${id}-big`), `${id}-jb`, Rig.CAST.joe).setAttribute("transform", "translate(740,2440) scale(-2.6,2.6)");
          Rig.drive(tl, `${id}-jb`, SH.window.start, D("window"), [{ t: 0, mode: "idle", eyes: "wide", mouth: "smile" }], []);
        },
        fx(tl, id, t0) {
          tl.set(`#${id}-jf`, { opacity: 0 }, t0 + SCARE); tl.set(`#${id}-big`, { opacity: 1 }, t0 + SCARE);
          tl.set("#flashw", { opacity: 0.35 }, t0 + SCARE); tl.to("#flashw", { opacity: 0, duration: 0.12 }, t0 + SCARE + 0.01);
          tl.set("#black", { opacity: 1 }, t0 + D("window") - 0.4);
        },
        shake: (t) => (t > SCARE ? Math.sin(t * 80) * 9 : 0),
      });

      // global overlays first: shot fx target them while the shots are being built
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">ค่ายคืนสุดท้าย · EP.1</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);

      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
