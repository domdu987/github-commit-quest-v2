36, "vo": [{"id": "d15", "t": 0.3, "dur": 3.636}], "voEnd": 3.936}]};

        fx(tl, id, t0) {
          this._pov.drive(tl, t0, D("open"));

      // ---------- 2. five hours earlier: the clock winds back to golden hour; cast tags ----------
      add("arrive", {
        set: "camp", setOpts: CAMP_DUSK, dark: 0.04,

        actors: [
          { who: "joe", x: 760, y: 1625, s: 0.62, flip: true, track: [{ t: 0, mode: "wave", mouth: "smile" }, { t: 3.4, mode: "idle", blend: 0.5 }] },
          { who: "kla", x: 380 - walkV(0.62) * 3.0, y: 1648, s: 0.62, track: [{ t: 0, mode: "walk" }, { t: 3.0, mode: "idle", blend: 0.4 }], moveTo: { x: 380, dur: 3.0 } },
          { who: "pin", x: 230 - walkV(0.6) * 2.8, y: 1660, s: 0.6, track: [{ t: 0, mode: "walk" }, { t: 2.8, mode: "idle", blend: 0.4, look: -4 }], moveTo: { x: 230, dur: 2.8 } },

          { type: "clock", t: 0.2, end: vo("arrive", 1) - 0.15, from: "22:00", to: "17:00", sweep: 1.6, label: "ย้อนเวลา · 5 ชั่วโมงก่อน", top: 150 },

      // ---------- 3. the ranger's two rules ----------
      add("ranger", {

      // ---------- 7. Pin's eyes: something blinks in the treeline; Kla's hand grabs her ----------

          L.light.insertAdjacentHTML("beforeend", `<g id="${id}-grab"><path d="M-260,1500L120,1330L150,1400L-200,1600Z" fill="#9c4a3c" stroke="#2e2a26" stroke-width="5"/>

          tl.set(`#${id}-eyes`, { opacity: 0 }, t0 + 1.05); tl.set(`#${id}-eyes`, { opacity: 1 }, t0 + 1.2); tl.set(`#${id}-eyes`, { opacity: 0 }, t0 + 1.9);
          tl.fromTo(`#${id}-grab`, { x: -420, y: 120 }, { x: 0, y: 0, duration: 0.22, ease: "power3.out", immediateRender: false }, t0 + vo("callpov") - 0.15);
          Fx.punch(tl, `#${id} .stage`, t0 + 0.75, 1.1, 0.6); Fx.heart(tl, t0, D("callpov"), 0.6, 0.7); Fx.tunnel(tl, t0, t0 + D("callpov"), 0.6);

      // ---------- 8. the choice; she runs into the dark, he follows ----------
      const RUN_F = voEnd("choice") + 0.1, RUN_P = RUN_F + 0.6;
      add("choice", {

            { t: RUN_F, mode: "run", torch: true, blend: 0.25, eyes: "wide", mouth: "o" }], moveTo: { at: RUN_F, x: 730 + runV(0.84) * (D("choice") - RUN_F), dur: D("choice") - RUN_F } },
        ],
        bubbles: [{ text: "“ถ้าพี่โจ้[เจ็บจริง]ล่ะ!”", x: 380, y: 700, t: vo("choice"), end: voEnd("choice") + 0.1, tail: 300 }],
        captions: [cap("choice", "ป่ากลางคืน… [ห้ามแยกกันเดิน]", vo("choice", 1))],
        ui: [
          { type: "choice", t: 0.1, end: 2.75, q: "ปิ่นจะทำยังไง?", a: "ตามเสียงไป", b: "อยู่ที่แคมป์", secs: 3, pickAt: 2.25, pick: "a", who: "ปิ่นเลือก… ตามเสียงไป", top: 160 },

      // ---------- 9. ten minutes later the trail is gone (tracking walk + minimap) ----------
      const WALK_T = 2.7, WV = walkV(0.95);
      add("lost", {
        set: "forest", setOpts: { seed: 11, width: 3000 }, dark: 0.45,
        cam: { from: { x: 60, y: 180, s: 1.1 }, to: { x: 60 + WV * WALK_T, y: 180, s: 1.1 }, ease: "linear", dur: WALK_T },
        actors: [
          { who: "kla", x: 360, y: 1580, s: 0.95, track: [{ t: 0, mode: "walk", torch: true }, { t: WALK_T, mode: "idle", torch: true, blend: 0.4, look: -8, eyes: "side" }], moveTo: { x: 360 + WV * WALK_T, dur: WALK_T } },
          { who: "pin", x: 640, y: 1590, s: 0.93, track: [{ t: 0, mode: "walk", torch: true }, { t: WALK_T, mode: "torch", torch: true, blend: 0.4, eyes: "wide", mouth: "o" }], moveTo: { x: 640 + walkV(0.93) * WALK_T, dur: WALK_T } },
        ],
        captions: [cap("lost", "[10 นาทีต่อมา]… ทางหายไป")],
        ui: [
          { type: "clock", t: 0.15, from: "21:05", to: "21:15", sweep: 0.9, label: "10 นาทีต่อมา", top: 150 },
          { type: "minimap", t: 0.4, text: "ทางเดินหายไป", label: "แผนที่", lostAt: 1.8, walk: 2.4, top: 520, side: "right", x: 30 },
        ],
        fx(tl, id, t0) {
          flick(id, t0, "lost");
          tl.fromTo(`#${id} .trail`, { opacity: 1 }, { opacity: 0.08, duration: 2.0, immediateRender: false }, t0 + 1.6);
          tl.fromTo(`#${id}-fog`, { opacity: 0 }, { opacity: 0.12, duration: 2.0, immediateRender: false }, t0 + 1.6);
        },
      });

      // ---------- 10. S.T.O.P. ----------
      add("stop", {
        set: "forest", setOpts: { seed: 11, width: 3000, path: false }, dark: 0.45,
        cam: { from: { x: 940, y: 200, s: 1.15 }, to: { x: 940, y: 220, s: 1.22 } },
        actors: [
          { who: "kla", x: 1290, y: 1590, s: 0.95, track: [{ t: 0, mode: "point", mouth: "flat" }, { t: 2.6, mode: "idle", blend: 0.5, mouth: "flat" }] },
          { who: "pin", x: 1570, y: 1598, s: 0.93, flip: true, track: [{ t: 0, mode: "torch", torch: true, eyes: "wide", mouth: "flat" }, { t: 2.8, mode: "idle", blend: 0.5 }] },
        ],
        captions: [cap("stop", "หลงป่า = [หยุดอยู่กับที่]")],
        ui: [{ type: "steps", t: 0.25, end: D("stop") - 0.05, label: "หลงป่า · จำ 4 ข้อ", items: [["hand", "หยุด"], ["think", "คิด"], ["eye", "สังเกต"], ["map", "วางแผน"]], top: 160 }],
        fx(tl, id, t0) { flick(id, t0, "stop"); },
      });

      // ---------- 11. three blasts… and three answer from behind ----------
      const ANS = [vo("whistle", 1) - 2.1, vo("whistle", 1) - 1.65, vo("whistle", 1) - 1.2], TURN = vo("whistle", 1) - 0.5;
      add("whistle", {
        set: "forest", setOpts: { seed: 11, width: 3000, path: false }, dark: 0.5,
        cam: { from: { x: 1000, y: 160, s: 1.2 }, to: { x: 960, y: 200, s: 1.38 } },
        actors: [
          { who: "pin", x: 1540, y: 1598, s: 0.93, prop: "whistle", until: TURN, track: [{ t: 0, mode: "whistle", eyes: "closed" }, { t: 1.4, mode: "idle", blend: 0.4, eyes: "side" }, { t: ANS[0], mode: "idle", eyes: "wide", mouth: "o" }] },
          { who: "kla", x: 1300, y: 1590, s: 0.95, until: TURN, track: [{ t: 0, mode: "idle", mouth: "flat" }, { t: ANS[0], mode: "tremble", eyes: "wide", mouth: "o", blend: 0.2 }] },
          { who: "pin", x: 1540, y: 1598, s: 0.93, flip: true, from: TURN, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o" }] },
          { who: "kla", x: 1300, y: 1590, s: 0.95, flip: true, from: TURN, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o", sweat: true }] },
        ],
        sfxText: [0.15, 0.6, 1.05].map((t, i) => ({ text: "ปี๊ด!", x: 690 + i * 70, y: 640 - i * 60, t, end: t + 0.4, size: 64, color: "#f2c55c" }))
          .concat(ANS.map((t, i) => ({ text: "ปี๊ด…", x: 60 + i * 40, y: 980 + i * 50, t, end: t + 0.6, size: 46, color: "#7f969c", rot: 4 }))),
        captions: [cap("whistle", "นกหวีด [3 ครั้ง] = ขอความช่วยเหลือ", vo("whistle", 0), voEnd("whistle", 0) + 0.2), cap("whistle", "เสียงตอบ… [จากข้างหลัง]", vo("whistle", 1))],
        ui: [
          { type: "tip", t: 1.4, end: ANS[0] - 0.15, ill: "whistle", label: "ความรู้เอาตัวรอด", text: "เป่า [3 ครั้ง] = ขอความช่วยเหลือ", top: 160 },
          { type: "radar", t: ANS[0] - 0.05, dir: 180, text: "ข้างหลัง!", pulses: ANS, end: D("whistle") - 0.05, top: 160, side: "right", x: 40 },
        ],
        shake: (t) => (t > ANS[0] && t < TURN + 1.0 ? Math.sin(t * 61) * 3 : 0),
        fx(tl, id, t0) {
          flick(id, t0, "whistle");
          Fx.desat(tl, `#${id} .stage`, t0 + ANS[0], undefined, 0.3); Fx.letterbox(tl, t0 + ANS[0], t0 + D("whistle") + 4.2);
          Fx.heart(tl, t0 + ANS[0], D("whistle") - ANS[0], 0.6, 0.55);
        },
      });

      // ---------- 12. torch off, hold your breath (QTE with a noise meter) ----------
      add("hush", {
        set: "forest", setOpts: { seed: 13, width: 2400, path: false, branch: false }, dark: 0.72,
        cam: { from: { x: 40, y: 330, s: 1.35 }, to: { x: 40, y: 360, s: 1.48 } },
        actors: [
          { who: "kla", x: 470, y: 1640, s: 0.95, track: [{ t: 0, mode: "crouchShush", eyes: "wide", sweat: true }] },
          { who: "pin", x: 650, y: 1650, s: 0.92, flip: true, track: [{ t: 0, mode: "crouch", eyes: "closed", mouth: "flat" }, { t: 2.5, mode: "crouch", eyes: "wide", mouth: "flat", blend: 0.2 }] },
        ],
        sfxText: [{ text: "กรอบ…", x: 760, y: 1240, t: 1.4, end: 2.2, size: 52, color: "#7f969c", rot: 8 }, { text: "แกรก…", x: 120, y: 1180, t: 2.6, end: 3.4, size: 52, color: "#7f969c", rot: -6 }],
        ui: [{ type: "qte", t: 0.2, label: "กลั้นหายใจ · ห้ามส่งเสียง", okAt: 3.4, okText: "เงียบไว้ได้", meter: "เสียงของคุณ", top: 170 }],
        fx(tl, id, t0) { Fx.tunnel(tl, t0, t0 + D("hush") + 0.2, 0.85); Fx.heart(tl, t0, D("hush"), 0.5, 0.6); Fx.hold(tl, `#${id} .stage`, t0, t0 + D("hush"), 1.05); },
      });

      // ---------- 13. Kla's eyes: the torch clicks on and finds "Joe" ----------
      const FIND = 2.3;
      const P3 = (id) => Fx.pov(id, { ...KLA_ARM, shake: hand, off: [[0, 0.5]], flicker: [[3.6, 0.5]], keys: [
        { t: 0.5, x: 300, y: 1110, r: 230 }, { t: 1.3, x: 780, y: 1010, r: 240 }, { t: 1.9, x: 440, y: 960, r: 230 }, { t: FIND, x: 605, y: 960, r: 210 }, { t: 6.4, x: 600, y: 940, r: 190 }] });
      add("reveal", {
        set: "forest", setOpts: { seed: 13, width: 2400, path: false }, dark: 0.3,
        cam: { from: { x: 0, y: 100, s: 1.1 }, to: { x: 0, y: 110, s: 1.16 } }, shake: (t) => hand(t).x * 0.5,
        actors: [{ who: "joe", x: 595, y: 1415, s: 0.72, flip: true, blinks: [], track: [{ t: 0, mode: "idle", look: 22, eyes: "closed", mouth: "flat" }, { t: FIND + 0.25, mode: "idle", look: 0, eyes: "glow", mouth: "smile", blend: 0.5 }, { t: 4.8, mode: "idle", look: -14, eyes: "glow", mouth: "smile", blend: 0.6 }] }],
        bubbles: [{ text: "“มาช้าจังนะ… [ปิ่น]”", x: 300, y: 1180, t: vo("reveal"), end: D("reveal") - 0.05, tail: 260 }],
        ui: [{ type: "pov", t: 0.4, name: "กล้า", bpm: [132, 176], top: 150, x: 36 }],
        extra(L, id) { this._pov = P3(id); L.light.insertAdjacentHTML("beforeend", this._pov.markup); },
        fx(tl, id, t0) {
          this._pov.drive(tl, t0, D("reveal"));
          Fx.punch(tl, `#${id} .stage`, t0 + FIND, 1.12, 0.8); Fx.glitch(tl, `#${id}`, t0 + vo("reveal"), 0.4, 10, 41); Fx.glitch(tl, `#${id}`, t0 + vo("reveal") + 2.0, 0.3, 8, 42);
          Fx.heart(tl, t0 + FIND, D("reveal") - FIND, 0.5, 0.7); Fx.tunnel(tl, t0 + FIND, t0 + D("reveal"), 0.6);
        },
      });

      // ---------- 14. Pin runs toward him; Kla pulls her back ----------
      add("twoshot", {
        set: "forest", setOpts: { seed: 13, width: 2400, path: false }, dark: 0.55,
        cam: { from: { x: -40, y: 260, s: 1.22 }, to: { x: 0, y: 270, s: 1.3 } },
        actors: [
          { who: "kla", x: 360, y: 1600, s: 0.95, track: [{ t: 0, mode: "torchLow", torch: true, eyes: "wide", mouth: "flat" }, { t: vo("twoshot", 1) - 0.3, mode: "point", blend: 0.25, torch: false, eyes: "wide", mouth: "o", sweat: true }] },
          { who: "pin", x: 520, y: 1610, s: 0.93, track: [{ t: 0, mode: "idle", eyes: "wide", mouth: "o" }, { t: vo("twoshot"), mode: "walk", blend: 0.3, mouth: "smile" }, { t: vo("twoshot") + 0.7, mode: "idle", blend: 0.4, mouth: "flat" },
            { t: vo("twoshot", 1) + 0.6, mode: "tremble", eyes: "wide", mouth: "o", blend: 0.3 }], moveTo: { at: vo("twoshot"), x: 520 + walkV(0.93) * 0.7, dur: 0.7 } },
        ],
        bubbles: [
          { text: "“พี่โจ้! [เป็นอะไรรึเปล่า]”", x: 420, y: 760, t: vo("twoshot"), end: voEnd("twoshot") + 0.1, tail: 160 },
          { text: "“ปิ่น… [ดูตาพี่โจ้สิ]”", x: 90, y: 760, t: vo("twoshot", 1), end: D("twoshot") - 0.05, tail: 200 },
        ],
        extra(L) { L.glow.insertAdjacentHTML("beforeend", `<circle cx="1180" cy="1140" r="40" fill="#e9ffc0" opacity=".85"/><circle cx="1180" cy="1140" r="120" fill="#d8ff9a" opacity=".15"/>`); },
        fx(tl, id, t0) { flick(id, t0, "twoshot"); Fx.heart(tl, t0 + vo("twoshot", 1), D("twoshot") - vo("twoshot", 1), 0.5, 0.7); Fx.punch(tl, `#${id} .stage`, t0 + vo("twoshot", 1), 1.06, 0.6); },
      });

      // ---------- 15. the eyes; a fact ----------
      const P4 = (id) => Fx.pov(id, { ...KLA_ARM, shake: hand, keys: [{ t: 0, x: 540, y: 980, r: 320 }, { t: 4.7, x: 540, y: 990, r: 300 }] });
      add("eyes", {
        set: "forest", setOpts: { seed: 13, width: 2400, path: false }, dark: 0.3,
        cam: { from: { x: 0, y: 120, s: 1.0 }, to: { x: 0, y: 120, s: 1.06 } }, shake: (t) => hand(t).x * 0.4,
        actors: [{ who: "joe", x: 540, y: 1930, s: 1.75, flip: true, blinks: [], track: [{ t: 0, mode: "idle", eyes: "glow", mouth: "smile", look: -6 }, { t: 2.5, mode: "idle", eyes: "glow", mouth: "smile", look: -16, blend: 1.5 }] }],
        captions: [cap("eyes", "ตาคน… [ไม่สะท้อนแสง]แบบนี้")],
        ui: [{ type: "figure", kind: "eyeshine", t: 0.5, artW: 330, label: "ความรู้", text: "ตาเรืองแสงเมื่อโดนไฟ", text2: "= [ตาสัตว์กลางคืน]", second: 0.5, top: 150, side: "center", w: 1000 }],
        extra(L, id) { this._pov = P4(id); L.light.insertAdjacentHTML("beforeend", this._pov.markup); },
        fx(tl, id, t0) {
          this._pov.drive(tl, t0, D("eyes"));
          Fx.punch(tl, `#${id} .stage`, t0 + 0.05, 1.15, 1.0); Fx.desat(tl, `#${id} .stage`, t0, undefined, 0.35);
          Fx.heart(tl, t0, D("eyes"), 0.48, 0.65); Fx.glitch(tl, `#${id}`, t0 + 0.05, 0.25, 12, 51);
        },
      });

      // ---------- 16. "why didn't you answer?" — he lurches closer; the choice pulls toward "answer" ----------
      const P5 = (id) => Fx.pov(id, { ...KLA_ARM, shake: (t) => ({ x: hand(t).x * 2, y: hand(t).y * 2 }), flicker: [[1.2, 0.5], [3.2, 0.7], [5.2, 1.2]], keys: [{ t: 0, x: 560, y: 1000, r: 260 }, { t: 6.8, x: 540, y: 980, r: 300 }] });
      const LURCH = [1.3, 2.1, 2.9, 3.6];
      add("final", {
        set: "forest", setOpts: { seed: 13, width: 2400, path: false }, dark: 0.3,
        cam: { from: { x: 0, y: 100, s: 1.05 }, to: { x: 0, y: 100, s: 1.12 } }, shake: (t) => hand(t).x,
        bubbles: [{ text: "“ทำไม… [ไม่ขานล่ะ]”", x: 260, y: 1220, t: vo("final"), end: voEnd("final") + 0.2, tail: 240 }],
        ui: [
          { type: "pov", t: 0.1, name: "กล้า", bpm: [160, 190], top: 150, x: 36 },
          { type: "choice", t: voEnd("final") + 0.1, q: "จะทำยังไง?", a: "ขานรับ", b: "วิ่งหนี", secs: 3, top: 270,
            possessed: { at: 0.9, side: "a", glitch: "ขานสิ…", who: "…มีบางอย่างอยากให้คุณ ขาน" } },
        ],
        extra(L, id) {
          L.act.insertAdjacentHTML("beforeend", `<g id="${id}-jw" transform="translate(560,1400) scale(.6)"></g>`);
          Rig.build(document.getElementById(`${id}-jw`), `${id}-j`, Rig.CAST.joe).setAttribute("transform", "scale(-1,1)");
          Rig.drive(tl, `${id}-j`, SH.final.start, D("final"), [{ t: 0, mode: "idle", eyes: "glow", mouth: "smile", look: -10 }, { t: LURCH[0], mode: "wave", eyes: "glow", mouth: "smile", blend: 0.2 }], []);
          this._pov = P5(id); L.light.insertAdjacentHTML("beforeend", this._pov.markup);
        },
        fx(tl, id, t0) {
          this._pov.drive(tl, t0, D("final"));
          [[0.75, 1440], [0.95, 1490], [1.2, 1560], [1.5, 1650]].forEach(([k, y], i) => {
            tl.set(`#${id}-jw`, { attr: { transform: `translate(560,${y}) scale(${k})` } }, t0 + LURCH[i]);
            Fx.punch(tl, `#${id} .stage`, t0 + LURCH[i], 1.04, 0.2);
          });
          Fx.glitch(tl, `#${id}`, t0 + vo("final"), 0.5, 12, 61); Fx.glitch(tl, `#${id}`, t0 + LURCH[3], 0.4, 14, 62);
          Fx.heart(tl, t0, D("final"), 0.4, 0.8); Fx.tunnel(tl, t0, t0 + D("final") + 0.5, 0.8); Fx.letterbox(tl, t0, undefined);
          tl.set("#black", { opacity: 1 }, t0 + D("final") - 0.22);
        },
      });

      // global overlays first: shot fx target them while the shots are being built
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">ค่ายคืนสุดท้าย · EP.1</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);

      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
