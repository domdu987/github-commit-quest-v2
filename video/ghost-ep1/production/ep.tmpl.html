<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <script src="assets/sets.js"></script>
    <script src="assets/ui.js"></script>
    <script src="assets/engine.js"></script>
    <style>
      @font-face { font-family: 'Kanit'; font-weight: 400; src: url(assets/fonts/f1.ttf); }
      @font-face { font-family: 'Kanit'; font-weight: 700; src: url(assets/fonts/f2.ttf); }
      @font-face { font-family: 'Kanit'; font-weight: 900; src: url(assets/fonts/f3.ttf); }
      @font-face { font-family: 'Orbitron'; font-weight: 900; src: url(assets/fonts/f5.ttf); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05080a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Kanit, sans-serif; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .stage { position: absolute; inset: 0; }
      .fgblur { filter: blur(6px); }
      .puff { display: none; }
      .sfxw { position: absolute; font-family: Kanit; font-weight: 900; letter-spacing: -1px; opacity: 0;
        text-shadow: -4px -4px 0 #2e2a26, 4px -4px 0 #2e2a26, -4px 4px 0 #2e2a26, 4px 4px 0 #2e2a26, 8px 8px 0 #2e2a26; }
      .badge { z-index: 56; position: absolute; right: 36px; bottom: 330px; font: 700 26px/1 Kanit; color: #f4ecd8; opacity: .75; letter-spacing: 2px;
        background: rgba(5,8,10,.55); padding: 8px 14px; border-radius: 8px; }
      #vig { z-index: 55; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 78% 62% at 50% 48%, transparent 52%, rgba(3,6,8,.78) 100%); }
      #grain { z-index: 57; position: absolute; inset: -60px; opacity: .12; mix-blend-mode: overlay; pointer-events: none; }
      #flashw { z-index: 60; position: absolute; inset: 0; background: #e8f0ff; opacity: 0; pointer-events: none; }
      #black { z-index: 61; position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
      /*__UICSS__*/
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*__TOTAL__*/" data-width="1080" data-height="1920">
      <svg id="grain" width="1200" height="2040"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" /></filter><rect width="1200" height="2040" filter="url(#nz)" /></svg>
    </div>
    <script>
      const SCHED = /*__SCHEDULE__*/;
      const SH = Object.fromEntries(SCHED.shots.map((s) => [s.key, s]));
      const vo = (k, i = 0) => SH[k].vo[i].t;            // voice start, relative to shot
      const voEnd = (k, i = 0) => SH[k].vo[i].t + SH[k].vo[i].dur;
      const root = document.getElementById("root");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const MANSION = { houseX: 50, houseY: 255, houseScale: 0.83, banyanX: 1180 };
      const EXT_S = 0.42, EXT_Y = 1600;
      const P = Sets.props;
      const cap = (k, text, t, end) => ({ text, t: t ?? vo(k), end });
      const fade = (sel, a, b, t, d) => tl.fromTo(sel, { opacity: a }, { opacity: b, duration: d, immediateRender: false }, t);
      const at = (k, t) => SH[k].start + t;

      const shots = [];
      const add = (k, spec) => shots.push({ start: SH[k].start, dur: SH[k].dur, key: k, ...spec });

      // 1. cold open: black, knock, lightning reveals the mansion, a shadow passes the lit window
      add("open", {
        set: "mansionExterior", setOpts: MANSION, dark: 0.55,
        cam: { from: { x: 0, y: 260, s: 1.3 }, to: { x: 0, y: 120, s: 1.14 } },
        captions: [cap("open", "ถ้าวันหนึ่ง… คุณได้ยิน[เสียงเคาะ]ทั้งคืน", 0)],
        extra(L, id) {
          L.set.insertAdjacentHTML("beforeend", `<clipPath id="${id}-wclip"><rect x="332" y="902" width="66" height="141"/></clipPath>
            <g clip-path="url(#${id}-wclip)"><rect id="${id}-shade" x="250" y="890" width="60" height="170" fill="#0b0b0b" opacity=".9"/></g>`);
          document.getElementById(`${id}-light`).insertAdjacentHTML("beforeend", P.rain(`${id}-rain`, 160, 4));
        },
        fx(tl, id, t0) {
          tl.set(`#${id}-dark`, { opacity: 1 }, t0);
          tl.set(`#${id}-dark`, { opacity: 0.55 }, t0 + 0.95);
          tl.fromTo("#flashw", { opacity: 0.85 }, { opacity: 0, duration: 0.35, immediateRender: false }, t0 + 0.95);
          tl.fromTo(`#${id}-shade`, { x: 0 }, { x: 170, duration: 0.7, ease: "power1.inOut", immediateRender: false }, t0 + 1.05);
          tl.fromTo(`#${id}-rain`, { y: 0 }, { y: 2400, duration: 1.6, repeat: 4, ease: "none", immediateRender: false }, t0);
        },
      });

      // 2. flash-forward: Fon lit from below, then the seated figure in the net
      add("flash", {
        set: "bedroom", dark: 0.62,
        cam: { from: { x: -200, y: -380, s: 2.0 }, to: { x: 160, y: 150, s: 1.35 } },
        actors: [{ who: "fon", x: 300, y: 1530, s: 1.05, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o", torch: true }] }],
        captions: [cap("flash", "มองไม่เห็น… แต่[ฆ่าคนได้]")],
        extra(L, id) { L.set.insertAdjacentHTML("afterbegin", P.ghostSeated(`${id}-g`, 700, 1470, 1.2)); },
        fx(tl, id, t0) {
          tl.set("#flashw", { opacity: 0.7 }, t0 + 1.0); tl.to("#flashw", { opacity: 0, duration: 0.15 }, t0 + 1.01);
          tl.set(`#${id}-g`, { opacity: 1 }, t0 + 1.0);
          tl.set(`#${id}-g-face`, { opacity: 1 }, t0 + 2.0);
          tl.set("#black", { opacity: 1 }, t0 + SH.flash.dur - 0.18);
          tl.set("#black", { opacity: 0 }, t0 + SH.flash.dur);
        },
      });

      // 3. eight hours earlier: golden hour arrival
      add("arrive", {
        set: "mansionExterior", setOpts: { ...MANSION, time: "dusk" }, dark: 0.02,
        cam: { from: { x: -60, y: 260, s: 1.12 }, to: { x: 60, y: 300, s: 1.18 } },
        actors: [
          { who: "phum", x: 120, y: EXT_Y, s: EXT_S, track: [{ t: 0, mode: "walk" }, { t: SH.arrive.dur - 0.7, mode: "idle", blend: 0.4 }], moveTo: { x: 470, dur: SH.arrive.dur - 0.7 } },
          { who: "fon", x: 30, y: EXT_Y + 8, s: EXT_S, track: [{ t: 0, mode: "walk", opts: { period: 0.9 } }, { t: SH.arrive.dur - 0.7, mode: "idle", blend: 0.4 }], moveTo: { x: 380, dur: SH.arrive.dur - 0.7 } },
          { who: "cat", x: 700, y: 1500, s: 0.32, track: [{ t: 0, mode: "sit" }, { t: SH.arrive.dur * 0.6, mode: "alert" }] },
        ],
        captions: [cap("arrive", "[8 ชั่วโมงก่อน] ที่พักเหลือหลังเดียว")],
        cards: [{ t: 0.2, icon: "clock", label: "ไซต์งานต่างจังหวัด", text: "17:50 น.", side: "right" }],
        extra(L) { L.act.insertAdjacentHTML("afterbegin", P.landlady("lady", 600, 1490, 0.4)); },
      });

      // 4. storm, power cut, the landlady lends a generator
      add("storm", {
        set: "verandah", dark: 0.5,
        cam: { from: { x: 0, y: 0, s: 1.05 }, to: { x: 40, y: 20, s: 1.12 } },
        actors: [
          { who: "fon", x: 860, y: 1520, s: 0.98, flip: true, track: [{ t: 0, mode: "idle" }, { t: 0.7, mode: "torch", torch: true, blend: 0.3, eyes: "wide" }] },
          { who: "phum", x: 400, y: 1520, s: 1.0, track: [{ t: 0, mode: "idle", look: -6 }, { t: 1.2, mode: "idle", look: 6, blend: 0.4, eyes: "side" }] },
        ],
        captions: [cap("storm", "ไฟดับ… ได้[เครื่องปั่นไฟ]มาแทน")],
        sfxText: [{ text: "ปึ้ก!", x: 120, y: 330, t: 0.5, size: 100 }],
        extra(L, id) {
          L.mid.insertAdjacentHTML("beforeend", P.landlady(`${id}-lady`, 180, 1300, 0.55, true) + P.generator(`${id}-gen`, 360, 1300, 0.42));
          L.set.insertAdjacentHTML("beforeend", `<g id="${id}-bulb"><circle cx="540" cy="300" r="22" fill="#ffd58a"/><circle cx="540" cy="300" r="300" fill="url(#lampglow)"/></g>`);
          document.getElementById(`${id}-light`).insertAdjacentHTML("beforeend", P.rain(`${id}-rain`, 180, 9));
        },
        fx(tl, id, t0) {
          tl.set(`#${id}-bulb`, { opacity: 0 }, t0 + 0.5);
          tl.fromTo(`#${id}-dark`, { opacity: 0.3 }, { opacity: 0.6, duration: 0.05, immediateRender: false }, t0 + 0.5);
          tl.set("#flashw", { opacity: 0.6 }, t0 + 1.6); tl.to("#flashw", { opacity: 0, duration: 0.3 }, t0 + 1.61);
          tl.fromTo(`#${id}-rain`, { y: 0 }, { y: 2400, duration: 1.5, repeat: 4, ease: "none", immediateRender: false }, t0);
        },
      });

      // 5. mistake 1: running the generator in the back room, shutters shut
      add("mistake1", {
        set: "backroom", dark: 0.28,
        cam: { from: { x: 60, y: 120, s: 1.1 }, to: { x: 100, y: 160, s: 1.2 } },
        actors: [
          { who: "phum", x: 420, y: 1525, s: 1.0, track: [{ t: 0, mode: "crouch" }, { t: vo("mistake1", 1), mode: "idle", blend: 0.5 }] },
          { who: "fon", x: 900, y: 1525, s: 0.95, flip: true, track: [{ t: 0, mode: "idle" }, { t: 0.5, mode: "raise", blend: 0.4 }, { t: 1.6, mode: "idle", blend: 0.4 }] },
        ],
        bubbles: [{ text: "“ไว้ห้องหลังนะ [กันขโมย]”", x: 120, y: 560, t: vo("mistake1", 0), end: voEnd("mistake1", 0) + 0.3, tail: 220 }],
        captions: [cap("mistake1", "พลาด[ข้อ 1]: ติดเครื่องปั่นไฟในบ้าน", vo("mistake1", 1))],
        sfxText: [{ text: "บรื้นนน", x: 560, y: 980, t: 0.3, size: 90 }],
        extra(L, id) {
          document.getElementById(`${id}-light`).insertAdjacentHTML("beforeend",
            `<rect id="${id}-ring" x="520" y="1220" width="400" height="300" rx="30" fill="none" stroke="#e0503a" stroke-width="14" opacity="0"/>`);
        },
        fx(tl, id, t0) {
          tl.fromTo(`#${id} #shutter`, { opacity: 0 }, { opacity: 1, duration: 0.25, immediateRender: false }, t0 + 1.4);
          const tf = t0 + SH.mistake1.dur - 0.9;
          tl.set(`#${id}-world`, { filter: "grayscale(1) brightness(.8)" }, tf);
          tl.fromTo(`#${id}-ring`, { opacity: 1, scale: 1.08, transformOrigin: "720px 1370px" }, { scale: 1, duration: 0.25, repeat: 3, yoyo: true, immediateRender: false }, tf);
          tl.set(`#${id}-world`, { filter: "none" }, t0 + SH.mistake1.dur);
        },
      });

      // 6. what comes out of the pipe: no visible smoke, just shimmer, camera rises to pillow height
      add("exhaust", {
        set: "backroom", dark: 0.45,
        cam: { from: { x: 380, y: 300, s: 2.4 }, to: { x: 0, y: -120, s: 1.15 } },
        captions: [cap("exhaust", "21:40 · ไม่มีใคร[เห็น]")],
        extra(L, id) {
          L.set.insertAdjacentHTML("beforeend", `<g id="${id}-shim">${[0, 1, 2, 3].map((i) => `<path d="M${880 + i * 20},1210q-14,-40 0,-80t0,-80t0,-80" stroke="#e8efe6" stroke-width="4" fill="none" opacity=".35"/>`).join("")}</g>`);
        },
        fx(tl, id, t0) {
          tl.fromTo(`#${id}-shim`, { y: 0, opacity: 0.6 }, { y: -60, opacity: 0.2, duration: 0.9, repeat: 4, ease: "none", immediateRender: false }, t0);
        },
        sfxText: [{ text: "ก๊อก!", x: 640, y: 420, t: SH.exhaust.dur - 0.7, size: 120 }],
      });

      // 7. the cat stumbles and stares at the back-room door
      add("cat", {
        set: "hall", dark: 0.5,
        cam: { from: { x: -40, y: 260, s: 1.35 }, to: { x: 20, y: 240, s: 1.45 } },
        actors: [
          { who: "cat", x: 560, y: 1500, s: 0.9, track: [{ t: 0, mode: "sit" }, { t: 1.0, mode: "sick" }, { t: SH.cat.dur - 1.2, mode: "alert" }] },
          { who: "fon", x: 80, y: 1525, s: 1.0, track: [{ t: 0, mode: "walk", opts: { period: 0.9 } }, { t: 1.5, mode: "crouch", blend: 0.4, eyes: "wide", look: -8 }], moveTo: { x: 300, dur: 1.5 } },
        ],
        captions: [cap("cat", "แมว[เห็นผี]?")],
        extra(L) { L.set.insertAdjacentHTML("beforeend", `<ellipse cx="760" cy="1505" rx="48" ry="14" fill="#9fb3b8" stroke="#2e2a26" stroke-width="4"/><ellipse cx="760" cy="1498" rx="32" ry="7" fill="#c9b98f"/>`); },
      });

      // 8. 23:10 the knocking starts — jump scare 1
      add("knock", {
        set: "bedroom", dark: 0.6,
        cam: { from: { x: 120, y: 160, s: 1.25 }, to: { x: 140, y: 180, s: 1.35 } },
        actors: [{ who: "phum", x: 640, y: 1480, s: 0.92, track: [{ t: 0, mode: "sit", look: -4 }, { t: 1.0, mode: "sit", look: -14, blend: 0.3, eyes: "side" }, { t: SH.knock.dur - 1.3, mode: "sit", eyes: "wide", mouth: "o", blend: 0.15 }] }],
        captions: [cap("knock", "[23:10] ก๊อก… ก๊อก… ก๊อก")],
        sfxText: [{ text: "ก๊อก ก๊อก ก๊อก", x: 160, y: 380, t: 0.1, size: 96, end: 1.0 }],
        extra(L, id) { L.far.insertAdjacentHTML("beforeend", P.shadowSweep(`${id}-sh`)); },
        fx(tl, id, t0) {
          const ts = t0 + SH.knock.dur - 1.4;
          tl.fromTo(`#${id}-sh`, { attr: { cx: -300 }, opacity: 0.85 }, { attr: { cx: 1400 }, duration: 0.55, ease: "power2.in", immediateRender: false }, ts);
          tl.fromTo(`#${id}-dark`, { opacity: 0.6 }, { opacity: 0.85, duration: 0.06, repeat: 3, yoyo: true, immediateRender: false }, ts);
        },
        shake: (t) => (t > SH.knock.dur - 1.0 ? Math.sin(t * 90) * 6 * Math.max(0, SH.knock.dur - 0.5 - t) : 0),
      });

      // 9. the knocks follow the rhythm of Phum's headache
      add("headache", {
        set: "bedroom", dark: 0.55,
        cam: { from: { x: 110, y: 290, s: 2.2 }, to: { x: 100, y: 280, s: 2.4 } },
        actors: [{ who: "phum", x: 640, y: 1480, s: 0.92, track: [{ t: 0, mode: "sit", eyes: "pain", mouth: "frown", sweat: true }] }],
        captions: [cap("headache", "เคาะ หรือ[ปวดหัว]?")],
        fx(tl, id, t0) { tl.fromTo(`#${id}-dark`, { opacity: 0.45 }, { opacity: 0.75, duration: 0.42, repeat: 7, yoyo: true, ease: "sine.inOut", immediateRender: false }, t0); },
      });

      // 10. mistake 2: pills and sleep; Fon blames the som tam
      add("mistake2", {
        set: "bedroom", dark: 0.55,
        cam: { from: { x: 0, y: 120, s: 1.15 }, to: { x: 0, y: 140, s: 1.2 } },
        actors: [
          { who: "phum", x: 1010, y: 1470, s: 0.9, track: [{ t: 0, mode: "sit", eyes: "pain" }, { t: 1.2, mode: "lie", blend: 0.6, eyes: "closed", mouth: "flat" }] },
          { who: "fon", x: 300, y: 1560, s: 0.95, flip: true, track: [{ t: 0, mode: "sit", eyes: "pain", mouth: "frown", sweat: true }] },
        ],
        captions: [cap("mistake2", "พลาด[ข้อ 2]: กินยาแล้วนอนต่อ")],
        extra(L, id) { L.set.insertAdjacentHTML("beforeend", P.mat(40, 1575, 420) + `<path d="M380,1555q30,-50 60,0z" fill="#e8e2d4" stroke="#2e2a26" stroke-width="3"/>`); },
        fx(tl, id, t0) { tl.set(`#${id}-fog`, { fill: "#6f8f4f", opacity: 0.12 }, t0); },
      });

      // 11. lost time: Fon wakes on the floor at 01:52
      add("losttime", {
        set: "hall", dark: 0.72,
        cam: { from: { x: -60, y: 300, s: 1.5 }, to: { x: -40, y: 260, s: 1.45 } },
        actors: [{ who: "fon", x: 520, y: 1520, s: 1.0, track: [{ t: 0, mode: "lie", eyes: "closed", mouth: "flat" }, { t: 1.4, mode: "sit", blend: 0.7, eyes: "side" }, { t: 2.4, mode: "sit", eyes: "wide", look: 6, blend: 0.3 }] }],
        captions: [cap("losttime", "เวลา[หายไป] 2 ชั่วโมง")],
        cards: [{ t: 1.0, icon: "phone", label: "ฝนดูเวลา", text: "01:52 น.", side: "right" }],
        fx(tl, id, t0) { tl.set("#black", { opacity: 1 }, t0); tl.set("#black", { opacity: 0 }, t0 + 0.5); },
      });

      // 12. POV: someone is sitting in the net beside Phum — the big scare
      add("ghost", {
        set: "bedroom", dark: 0.7,
        cam: { from: { x: 140, y: 150, s: 1.3 }, to: { x: 160, y: 120, s: 1.55 } },
        actors: [{ who: "phum", x: 940, y: 1470, s: 0.9, track: [{ t: 0, mode: "lie", eyes: "closed", mouth: "flat" }] }],
        captions: [cap("ghost", "ใคร[อยู่ในมุ้ง]?")],
        extra(L, id) {
          L.set.insertAdjacentHTML("afterbegin", P.ghostSeated(`${id}-g`, 640, 1475, 1.25));
          document.getElementById(`${id}-light`).insertAdjacentHTML("beforeend", `<path id="${id}-beam" d="M120,1920L520,1000H980L760,1920Z" fill="url(#beamg)" opacity=".55" transform="rotate(180 540 1460)"/>`);
        },
        fx(tl, id, t0) {
          tl.set(`#${id}-g`, { opacity: 1 }, t0);
          const ts = t0 + SH.ghost.dur - 1.0;
          tl.set(`#${id}-beam`, { opacity: 0 }, ts); tl.set(`#${id}-beam`, { opacity: 0.55 }, ts + 0.09);
          tl.set(`#${id}-g-face`, { opacity: 1 }, ts + 0.09);
          tl.fromTo(`#${id}-g`, { scale: 1 }, { scale: 1.15, transformOrigin: "640px 1300px", duration: 0.12, immediateRender: false }, ts + 0.09);
        },
        shake: (t) => (t > SH.ghost.dur - 0.9 ? Math.sin(t * 110) * 9 : 0),
      });

      // 13. the figure is gone; Phum sits up in the same spot, confused
      add("wake", {
        set: "bedroom", dark: 0.6,
        cam: { from: { x: 60, y: 120, s: 1.25 }, to: { x: 80, y: 130, s: 1.3 } },
        actors: [
          { who: "phum", x: 780, y: 1470, s: 0.9, track: [{ t: 0, mode: "lie", eyes: "closed" }, { t: 0.4, mode: "sit", blend: 0.8, eyes: "side", mouth: "flat" }, { t: 1.8, mode: "sit", look: 12, eyes: "pain", blend: 0.3 }] },
          { who: "fon", x: 330, y: 1540, s: 1.0, track: [{ t: 0, mode: "torch", torch: true, eyes: "wide", mouth: "o" }] },
        ],
        captions: [cap("wake", "ภูมิ[สับสน]")],
        fx(tl, id, t0) {
          tl.set("#black", { opacity: 1 }, t0); tl.set("#black", { opacity: 0 }, t0 + 0.12);
          tl.fromTo(`#${id} #net`, { skewX: 0 }, { skewX: 2.5, transformOrigin: "50% 0%", duration: 0.5, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, t0);
        },
      });

      // 14. everyone is sick at once
      add("symptoms", {
        set: "bedroom", dark: 0.55,
        cam: { from: { x: -310, y: 60, s: 1.9 }, to: { x: -300, y: 50, s: 2.0 } },
        actors: [{ who: "fon", x: 220, y: 1540, s: 1.0, track: [{ t: 0, mode: "holdHead", eyes: "pain", mouth: "frown", sweat: true }, { t: SH.symptoms.dur - 1.0, mode: "point", blend: 0.3, eyes: "wide", look: 6 }] }],
        captions: [cap("symptoms", "ทุกคนป่วย[พร้อมกัน]")],
        cards: [{ t: 0.25, icon: "head", label: "อาการ", text: "ปวดหัว เวียนหัว คลื่นไส้" }],
        fx(tl, id, t0) { tl.set(`#${id}-fg`, { opacity: 0 }, t0); },
      });

      // 15. the cat by the back-room door: the first warning
      add("catfirst", {
        set: "hall", dark: 0.55,
        cam: { from: { x: 20, y: 300, s: 1.6 }, to: { x: 40, y: 300, s: 1.7 } },
        actors: [
          { who: "cat", x: 620, y: 1500, s: 0.9, track: [{ t: 0, mode: "sick" }] },
          { who: "fon", x: 380, y: 1525, s: 1.0, track: [{ t: 0, mode: "crouch", eyes: "wide", mouth: "o" }] },
        ],
        captions: [cap("catfirst", "[ส้มโอ] คือสัญญาณแรก")],
        cards: [{ t: 0.25, icon: "cat", text: "สัตว์เลี้ยงอาจมีอาการก่อนคน" }],
      });

      // 16. x-ray through the wall: the generator, shutters closed
      add("xray", {
        set: "backroom", dark: 0.35,
        cam: { from: { x: 0, y: 80, s: 1.05 }, to: { x: 140, y: 200, s: 1.35 } },
        captions: [cap("xray", "[ไม่ใช่ผี] แต่อันตรายกว่า")],
        cards: [{ t: 0.25, icon: "co", label: "คาร์บอนมอนอกไซด์", text: "CO · ไม่มีสี ไม่มีกลิ่น" }],
        fx(tl, id, t0) {
          tl.set(`#${id} #shutter`, { opacity: 1 }, t0);
          tl.set(`#${id}-fog`, { fill: "#5fd0e0", opacity: 0.16 }, t0);
          tl.set(`#${id}-world`, { filter: "saturate(.35) brightness(1.05)" }, t0);
        },
      });

      // 17. get out, now
      add("escape", {
        set: "mansionExterior", setOpts: MANSION, dark: 0.45,
        cam: { from: { x: 40, y: 330, s: 1.25 }, to: { x: 140, y: 360, s: 1.32 } },
        actors: [
          { who: "fon", x: 480, y: EXT_Y, s: EXT_S, track: [{ t: 0, mode: "run" }], moveTo: { x: 860, dur: SH.escape.dur } },
          { who: "cat", x: 520, y: 1520, s: 0.24, track: [{ t: 0, mode: "alert" }], },
          { who: "phum", x: 360, y: EXT_Y - 4, s: EXT_S, track: [{ t: 0, mode: "run" }, { t: SH.escape.dur - 1.2, mode: "fall", blend: 0.2, eyes: "pain" }], moveTo: { x: 620, dur: SH.escape.dur - 1.2 } },
        ],
        captions: [cap("escape", "ออกไป[ข้างนอก] เดี๋ยวนี้!")],
        cards: [{ t: 0.2, icon: "air", text: "ออกไปที่อากาศโล่งทันที" }],
        fx(tl, id, t0) {
          const cat = `#${id}-a1`;
          tl.fromTo(cat, { x: 0 }, { x: 360, duration: SH.escape.dur, ease: "none", immediateRender: false }, t0);
        },
      });

      // 18. "don't go back in!"
      add("block", {
        set: "mansionExterior", setOpts: MANSION, dark: 0.42,
        cam: { from: { x: 60, y: 450, s: 1.9 }, to: { x: 80, y: 460, s: 2.0 } },
        actors: [
          { who: "phum", x: 760, y: EXT_Y, s: EXT_S, flip: true, track: [{ t: 0, mode: "walk" }, { t: 1.2, mode: "idle", blend: 0.3, eyes: "wide" }], moveTo: { x: 640, dur: 1.2 } },
          { who: "fon", x: 470, y: EXT_Y + 4, s: EXT_S, track: [{ t: 0, mode: "run" }, { t: 0.55, mode: "point", blend: 0.25, eyes: "wide", mouth: "scream" }], moveTo: { x: 560, dur: 0.55, ease: "power2.out" } },
        ],
        bubbles: [{ text: "“ห้าม[กลับเข้าไป]!”", x: 300, y: 620, t: vo("block"), end: SH.block.dur - 0.2 }],
        captions: [cap("block", "เกือบพลาด[ข้อ 3]: กลับไปเอางาน", 0.2)],
        cards: [{ t: 0.3, icon: "warn", text: "ห้ามกลับเข้าไป จนกว่าเจ้าหน้าที่บอก" }],
      });

      // 19. one bar of signal: 1669
      add("call", {
        set: "mansionExterior", setOpts: { houseX: 560, houseY: 700, houseScale: 0.42, banyanX: 1400 }, dark: 0.4,
        cam: { from: { x: -40, y: 220, s: 1.15 }, to: { x: -20, y: 200, s: 1.2 } },
        actors: [
          { who: "phum", x: 200, y: 1660, s: 0.62, track: [{ t: 0, mode: "sit", eyes: "pain", mouth: "flat" }] },
          { who: "fon", x: 560, y: 1660, s: 0.66, track: [{ t: 0, mode: "raise", eyes: "wide" }, { t: SH.call.dur - 1.4, mode: "phoneEar", blend: 0.3, mouth: "o" }] },
        ],
        captions: [cap("call", "โทร[1669]")],
        cards: [{ t: 0.2, icon: "phone", label: "เจ็บป่วยฉุกเฉิน", text: "โทร 1669", value: "24 ชม." }],
      });

      // 20. the rescue team: "a little longer asleep and he might not have woken"
      add("rescue", {
        set: "mansionExterior", setOpts: { houseX: 560, houseY: 700, houseScale: 0.42, banyanX: 1400 }, dark: 0.42,
        cam: { from: { x: -20, y: 200, s: 1.2 }, to: { x: 0, y: 220, s: 1.26 } },
        actors: [
          { who: "phum", x: 160, y: 1660, s: 0.62, track: [{ t: 0, mode: "sit", eyes: "closed", mouth: "flat" }] },
          { who: "fon", x: 430, y: 1665, s: 0.62, track: [{ t: 0, mode: "sit", eyes: "pain" }] },
          { who: "cat", x: 700, y: 1655, s: 0.36, track: [{ t: 0, mode: "alert" }] },
        ],
        captions: [cap("rescue", "[หลับอยู่] อาจไม่ตื่นอีกเลย")],
        cards: [{ t: 0.25, icon: "warn", text: "หลับ/เมา อาจเสียชีวิตก่อนรู้ตัว" }],
        extra(L, id) { L.set.insertAdjacentHTML("beforeend", P.beacon(`${id}-bc`, 880, 1600)); },
        fx(tl, id, t0) { tl.fromTo(`#${id}-bc-glow`, { opacity: 0.2 }, { opacity: 0.95, duration: 0.25, repeat: 15, yoyo: true, immediateRender: false }, t0); },
      });

      // 21. morning: everything open, the generator out in the yard
      add("morning", {
        set: "mansionExterior", setOpts: { ...MANSION, time: "day" }, dark: 0.0,
        cam: { from: { x: 0, y: 240, s: 1.08 }, to: { x: 20, y: 260, s: 1.12 } },
        actors: [
          { who: "phum", x: 420, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair", eyes: "closed" }] },
          { who: "fon", x: 560, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair" }] },
          { who: "cat", x: 700, y: 1660, s: 0.3, track: [{ t: 0, mode: "sit" }] },
        ],
        captions: [cap("morning", "กลับจาก รพ. · บ้าน[ปลอดภัย]แล้ว")],
        cards: [{ t: 0.3, icon: "fuel", text: "ปั่นไฟ เตาถ่าน · นอกบ้านเท่านั้น", value: "6 ม.+" }],
        extra(L) {
          L.set.insertAdjacentHTML("beforeend", P.bench(490, 1660, 0.42) + P.generator("yardgen", 960, 1560, 0.3) +
            `<path d="M900,1520Q700,1580 420,1470" stroke="#2e2a26" stroke-width="5" fill="none"/>`);
        },
      });

      // 22. Fon tells herself it was only confusion
      add("thinks", {
        set: "mansionExterior", setOpts: { ...MANSION, time: "day" }, dark: 0.04,
        cam: { from: { x: -40, y: 560, s: 2.4 }, to: { x: -30, y: 560, s: 2.5 } },
        actors: [
          { who: "phum", x: 420, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair", eyes: "closed", mouth: "flat" }] },
          { who: "fon", x: 560, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair", look: -10, eyes: "side" }, { t: 1.6, mode: "sitChair", look: 4, blend: 0.6, mouth: "flat" }] },
        ],
        captions: [cap("thinks", "ก็แค่[สับสน]…ใช่ไหม?")],
        cards: [{ t: 0.25, icon: "head", text: "บางราย สับสนจนเหมือนเห็นสิ่งที่ไม่มี" }],
        extra(L) { L.set.insertAdjacentHTML("beforeend", P.bench(490, 1660, 0.42)); },
      });

      // 23. "the long-haired woman who woke me… who was she?"
      add("who", {
        set: "mansionExterior", setOpts: { ...MANSION, time: "day" }, dark: 0.12,
        cam: { from: { x: -100, y: 560, s: 2.6 }, to: { x: -60, y: 560, s: 3.0 } },
        actors: [
          { who: "phum", x: 420, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair", eyes: "closed" }, { t: 0.3, mode: "sitChair", look: 6, mouth: "smile", blend: 0.3 }] },
          { who: "fon", x: 560, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair" }, { t: voEnd("who") + 0.1, mode: "sitChair", eyes: "wide", mouth: "o", look: -8, blend: 0.15 }] },
        ],
        bubbles: [{ text: "“ผู้หญิง[ผมยาว]ที่ปลุกผม… ใครอะ?”", x: 60, y: 520, t: vo("who"), end: SH.who.dur - 0.3 }],
        captions: [cap("who", "สองคน… เห็น[คนเดียวกัน]", voEnd("who") + 0.1)],
        extra(L) { L.set.insertAdjacentHTML("beforeend", P.bench(490, 1660, 0.42)); },
      });

      // 24. something is still there: the cat hisses, the net billows inward, three knocks
      add("stillhere", {
        set: "mansionExterior", setOpts: { ...MANSION, time: "day" }, dark: 0.3,
        cam: { from: { x: 0, y: 260, s: 1.1 }, to: { x: -50, y: -70, s: 3.2 } },
        actors: [
          { who: "phum", x: 420, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair", look: -6, eyes: "wide" }] },
          { who: "fon", x: 560, y: 1660, s: EXT_S, track: [{ t: 0, mode: "sitChair", look: -10, eyes: "wide" }] },
          { who: "cat", x: 700, y: 1660, s: 0.3, track: [{ t: 0, mode: "hiss" }] },
        ],
        captions: [cap("stillhere", "แล้ว[ใครเคาะ]?", voEnd("stillhere") + 0.1)],
        sfxText: [{ text: "ก๊อก… ก๊อก… ก๊อก", x: 150, y: 330, t: SH.stillhere.dur - 1.4, size: 96, end: SH.stillhere.dur }],
        extra(L, id) {
          L.set.insertAdjacentHTML("beforeend", P.bench(490, 1660, 0.42));
          L.set.insertAdjacentHTML("beforeend", `<g transform="translate(50,255) scale(.83)"><path id="${id}-curtain" d="M790,790Q820,880 790,940L850,940Q830,880 850,790Z" fill="#e8e2d4" opacity=".85"/></g>`);
        },
        fx(tl, id, t0) {
          tl.fromTo(`#${id}-curtain`, { scaleX: 1 }, { scaleX: 1.7, transformOrigin: "820px 790px", duration: 0.35, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, t0 + SH.stillhere.dur - 2.2);
        },
      });

      // global overlays first: shot fx target them while the shots are being built
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">บ้านไม้หลังนั้น · EP.1</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);

      // assemble all shots
      Engine.build(root, tl, shots);

      // 25. end card
      const ek = SH.end;
      root.insertAdjacentHTML("beforeend", `<div id="endcard" class="clip" data-start="${ek.start}" data-duration="${ek.dur}" data-track-index="1" style="background:radial-gradient(ellipse at 50% 40%, #1b2a33, #05080a 70%)">
        <svg width="1080" height="1920" style="position:absolute;inset:0;opacity:.12"><rect width="1080" height="1920" fill="url(#netp)"/></svg>
        <div id="e-tag" style="position:absolute;left:0;right:0;top:250px;text-align:center;font:700 34px/1 Kanit;color:#f2d6a0;letter-spacing:6px">บ้านไม้หลังนั้น</div>
        <div id="e-ep2" style="position:absolute;left:0;right:0;top:330px;text-align:center;font:900 104px/1.1 Kanit;color:#f4ecd8">ตอนที่ 2<br><span style="color:#e07a4f">ผู้หญิงในมุ้ง</span></div>
        <div id="e-q" class="uicard" style="left:90px;right:90px;top:720px;max-width:none;flex-direction:column;align-items:stretch;opacity:0;padding:24px 28px 28px">
          <div class="lbl" style="text-align:center">คอมเมนต์บอกหน่อย</div>
          <div class="txt" style="text-align:center;white-space:normal;font-size:52px;margin-top:8px">ผู้หญิงในมุ้ง… มาหลอก หรือมาช่วย?</div>
          <div style="display:flex;gap:22px;justify-content:center;margin-top:20px">
            <div style="font:900 50px/1 Kanit;background:#e07a4f;border:4px solid #2e2a26;border-radius:14px;padding:12px 26px">A มาหลอก</div>
            <div style="font:900 50px/1 Kanit;background:#9fb3b8;border:4px solid #2e2a26;border-radius:14px;padding:12px 26px">B มาช่วย</div></div></div>
        <div id="e-follow" style="position:absolute;left:0;right:0;top:1170px;text-align:center;font:900 56px/1.2 Kanit;color:#f4ecd8">กดติดตาม <span style="color:#e07a4f">ก่อนเสียงเคาะครั้งต่อไป</span></div>
        <svg id="e-cat" width="220" height="220" viewBox="-110 -200 220 220" style="position:absolute;right:40px;top:1360px"><g id="ecat"></g></svg>
      </div>`);
      Rig.buildCat(document.getElementById("ecat"), "endcat").setAttribute("transform", "scale(1)");
      Rig.driveCat(tl, "endcat", ek.start, ek.dur, [{ t: 0, mode: "sit" }]);
      fade("#e-tag", 0, 1, ek.start + 0.1, 0.4);
      tl.fromTo("#e-ep2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)", immediateRender: false }, ek.start + 0.3);
      tl.fromTo("#e-q", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.8)", immediateRender: false }, ek.start + 0.8);
      fade("#e-follow", 0, 1, ek.start + 1.4, 0.4);
      tl.fromTo("#e-follow", { scale: 1 }, { scale: 1.05, duration: 0.5, repeat: 5, yoyo: true, ease: "sine.inOut", immediateRender: false }, ek.start + 1.8);
      tl.set("#endcat-head .ce-open", { display: "none" }, ek.start + ek.dur - 1.2);
      tl.set("#endcat-head .ce-closed", { display: "inline" }, ek.start + ek.dur - 1.2);
      tl.set("#endcat-head .ce-open", { display: "inline" }, ek.start + ek.dur - 1.08);
      tl.set("#endcat-head .ce-closed", { display: "none" }, ek.start + ek.dur - 1.08);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);
      tl.set("#badge", { opacity: 0 }, ek.start);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
