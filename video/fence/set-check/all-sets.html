<!doctype html><html><body style="margin:0;background:#222"><script>// Character rig for the series. Characters are built once as SVG groups with pivots at the joints,
// then every frame is posed from a pure function of time, so seeking to any frame is deterministic.
// Local space: origin between the feet, +y down. Hip (0,-300), shoulders (±46,-455), knee +150, elbow +122.
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const OUT = 'stroke="#2e2a26" stroke-width="3.5" stroke-linejoin="round"';

  function limb(len, wid, col, shade) {
    return `<rect x="${-wid / 2}" y="-4" width="${wid}" height="${len + 8}" rx="${wid / 2}" fill="${col}" ${OUT}/>` +
      `<rect x="${wid * 0.12}" y="2" width="${wid * 0.32}" height="${len - 4}" rx="${wid * 0.16}" fill="${shade}" opacity=".55"/>`;
  }

  const EYES = {
    normal: `<ellipse cx="-14" cy="-546" rx="4.5" ry="6" fill="#2e2a26"/><ellipse cx="18" cy="-546" rx="4.5" ry="6" fill="#2e2a26"/>
             <path d="M-24,-562q10,-5 18,-1M10,-563q10,-4 18,1" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    wide: `<circle cx="-14" cy="-546" r="8" fill="#f4ecd8" ${OUT}/><circle cx="18" cy="-546" r="8" fill="#f4ecd8" ${OUT}/>
           <circle cx="-14" cy="-546" r="2.6" fill="#2e2a26"/><circle cx="18" cy="-546" r="2.6" fill="#2e2a26"/>
           <path d="M-25,-566q10,-8 19,-3M9,-569q10,-5 19,3" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    closed: `<path d="M-21,-545q7,5 14,0M11,-545q7,5 14,0" stroke="#2e2a26" stroke-width="3.5" fill="none" stroke-linecap="round"/>
             <path d="M-24,-560q10,-3 18,0M10,-560q10,-3 18,0" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    pain: `<path d="M-21,-545l12,-3M11,-548l12,3" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>
           <path d="M-24,-556l16,-8M10,-564l16,8" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    glow: `<circle cx="-14" cy="-546" r="20" fill="#d8ff9a" opacity=".3"/><circle cx="18" cy="-546" r="20" fill="#d8ff9a" opacity=".3"/>
           <circle cx="-14" cy="-546" r="9" fill="#e9ffc0"/><circle cx="18" cy="-546" r="9" fill="#e9ffc0"/>
           <path d="M-25,-560q10,4 19,1M9,-559q10,3 19,-2" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    side: `<ellipse cx="-10" cy="-546" rx="4.5" ry="6" fill="#2e2a26"/><ellipse cx="22" cy="-546" rx="4.5" ry="6" fill="#2e2a26"/>
           <path d="M-22,-562q10,-5 18,-1M12,-563q10,-4 18,1" stroke="#2e2a26" stroke-width="4" fill="none" stroke-linecap="round"/>`,
  };
  // the infected: milky eyes with pin pupils, and a torn-open snarl
  EYES.dead = `<ellipse cx="-14" cy="-545" rx="16" ry="14" fill="#1b211b" opacity=".8"/><ellipse cx="18" cy="-545" rx="16" ry="14" fill="#1b211b" opacity=".8"/>
           <circle cx="-14" cy="-546" r="15" fill="#e9ffd0" opacity=".16"/><circle cx="18" cy="-546" r="15" fill="#e9ffd0" opacity=".16"/>
           <circle cx="-14" cy="-546" r="9" fill="#e6eddc" stroke="#2e2a26" stroke-width="2"/><circle cx="18" cy="-546" r="9" fill="#e6eddc" stroke="#2e2a26" stroke-width="2"/>
           <path d="M-22,-547l5,-1M-6,-549l-4,3M-15,-538l1,-4M10,-544l4,-1M26,-549l-5,2M19,-538l-1,-4" stroke="#b32020" stroke-width="1.6" stroke-linecap="round"/>
           <circle cx="-12" cy="-545" r="2" fill="#7a1010"/><circle cx="20" cy="-545" r="2" fill="#7a1010"/>
           <path d="M-29,-563q11,7 22,4M7,-559q11,4 22,-4" stroke="#2e2a26" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const MOUTH = {
    smile: `<path d="M-4,-520q6,4 12,0" stroke="#2e2a26" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    flat: `<path d="M-5,-519h12" stroke="#2e2a26" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    o: `<ellipse cx="2" cy="-518" rx="5" ry="7" fill="#2e2a26"/>`,
    frown: `<path d="M-5,-516q7,-5 14,0" stroke="#2e2a26" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    scream: `<path d="M-7,-524q9,-3 18,0q-1,16 -9,16q-8,0 -9,-16z" fill="#2e2a26"/>`,
    snarl: `<path d="M-17,-529q19,-9 38,0l-4,22q-15,11 -30,0z" fill="#220505" stroke="#2e2a26" stroke-width="3"/>
      <path d="M-14,-528l3,7l3,-7l3,7l3,-7l3,7l3,-7l3,7l3,-7l3,7" stroke="#ece4cf" stroke-width="2.6" fill="none" stroke-linejoin="round"/>
      <path d="M-9,-509l3,-6l3,6l3,-6l3,6l3,-6l3,6" stroke="#ece4cf" stroke-width="2.3" fill="none" stroke-linejoin="round"/>
      <path d="M-6,-506q-3,14 -8,26M9,-507q3,10 1,20" stroke="#8a0f0f" stroke-width="4.5" stroke-linecap="round" fill="none"/>`,
  };

  function build(parent, id, P) {
    const leg = (side) => `<g id="${id}-th${side}"><g>${limb(150, 38, P.pants, P.pantsS)}</g>
        <g transform="translate(0,150)"><g id="${id}-sh${side}">${limb(138, 34, P.pants, P.pantsS)}
          <path d="M-20,128h34q22,0 22,16v6h-56z" fill="${P.shoe}" ${OUT}/></g></g></g>`;
    const arm = (side, extra = "") => `<g id="${id}-ua${side}">${limb(122, 30, P.sleeve, P.sleeveS)}
        <g transform="translate(0,122)"><g id="${id}-fa${side}">${limb(108, 26, P.forearm || P.sleeve, P.forearmS || P.sleeveS)}
          <circle cx="0" cy="118" r="15" fill="${P.skin}" ${OUT}/><g id="${id}-hand${side}">${extra}</g></g></g></g>`;
    const torch = `<g id="${id}-torch" display="none" transform="translate(0,118)"><rect x="-9" y="-6" width="18" height="44" rx="4" fill="#3d3833" ${OUT}/>
          <path id="${id}-beam" d="M-8,38L-230,900H230L8,38Z" fill="url(#beamg)"/></g>`;
    const eyes = Object.entries(EYES).map(([k, v]) => `<g class="eye-${k}" display="${k === "normal" ? "inline" : "none"}">${v}</g>`).join("");
    const mouths = Object.entries(MOUTH).map(([k, v]) => `<g class="mouth-${k}" display="${k === "smile" ? "inline" : "none"}">${v}</g>`).join("");
    const html = `<g id="${id}">
      <defs><linearGradient id="${id}-tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${P.top}"/><stop offset=".55" stop-color="${P.top}"/><stop offset="1" stop-color="${P.topS}"/></linearGradient>
        <radialGradient id="${id}-sg"><stop offset="0" stop-color="#060c10" stop-opacity=".55"/><stop offset="1" stop-color="#060c10" stop-opacity="0"/></radialGradient></defs>
      <ellipse id="${id}-shadow" cx="0" cy="6" rx="120" ry="22" fill="url(#${id}-sg)"/>
      <g id="${id}-root"><g id="${id}-body">
        <g transform="translate(-20,-300)">${leg("B")}</g>
        <g transform="translate(-46,-455)" opacity=".92">${arm("B", P.hand || "")}</g>
        <g id="${id}-torso">
          <path d="M-62,-470Q-66,-482 -44,-486H44Q66,-482 62,-470L56,-300H-56Z" fill="url(#${id}-tg)" ${OUT}/>
          <path d="M18,-482H40Q58,-478 54,-468L50,-302H24Z" fill="${P.topS}" opacity=".55"/>
          <path d="M-56,-478Q-60,-400 -52,-310" stroke="#fff" stroke-width="5" fill="none" opacity=".16" stroke-linecap="round"/>
          <rect x="-56" y="-318" width="112" height="30" rx="8" fill="${P.belt}" ${OUT}/>
          <g id="${id}-acc">${P.torsoExtra || ""}</g>
          <rect x="-14" y="-506" width="28" height="30" fill="${P.skinS}" ${OUT}/>
          <g id="${id}-head">
            <ellipse cx="-44" cy="-540" rx="10" ry="15" fill="${P.skin}" ${OUT}/><ellipse cx="44" cy="-540" rx="10" ry="15" fill="${P.skin}" ${OUT}/>
            <ellipse cx="0" cy="-548" rx="44" ry="52" fill="${P.skin}" ${OUT}/>
            <path d="M18,-596Q46,-570 40,-520Q30,-500 8,-497Q36,-530 18,-596Z" fill="${P.skinS}" opacity=".55"/>
            <path d="M0,-600Q36,-592 40,-540Q38,-506 10,-498Q44,-540 20,-598Z" fill="#1a1412" opacity=".12"/>
            <path d="M-38,-566Q-44,-540 -36,-512" stroke="#fff" stroke-width="4" fill="none" opacity=".22" stroke-linecap="round"/>
            <path d="M5,-537q6,8 -1,12" stroke="${P.skinS}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <g id="${id}-hair">${P.hair}</g>
            <g id="${id}-eyes">${eyes}</g>${P.face || ""}
            <g id="${id}-mouth">${mouths}</g>
            <g id="${id}-sweat" display="none"><path d="M40,-582c6,10 8,16 2,19c-6,-3 -6,-9 -2,-19z" fill="#cfe2e6" ${OUT}/></g>
          </g>
        </g>
        <g transform="translate(20,-300)">${leg("F")}</g>
        <g transform="translate(46,-455)">${arm("F", torch + (P.hand || ""))}</g>
      </g></g></g>`;
    const g = document.createElementNS(NS, "g");
    g.innerHTML = html;
    parent.appendChild(g.firstElementChild);
    return document.getElementById(id);
  }

  // ---------- pose math ----------
  const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
  const lerp = (a, b, k) => a + (b - a) * k;
  const JOINTS = ["thF", "thB", "shF", "shB", "uaF", "faF", "uaB", "faB", "torso", "head", "hair", "acc", "bodyY", "rootX", "rootY", "rootR"];
  const zero = () => Object.fromEntries(JOINTS.map((j) => [j, 0]));

  // deterministic jerks for the infected: at random moments (rate per second) the value snaps to ±amp and holds
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const twitch = (u, rate = 5, amp = 18) => { const k = Math.floor(u * rate); return hash(k) > 0.68 ? (hash(k + 0.37) - 0.5) * 2 * amp : 0; };

  // each mode returns joint angles (degrees) for local time u since the segment started
  const MODES = {
    idle(u, o) {
      const b = Math.sin(u * 2 * Math.PI / 3.2);
      return { ...zero(), uaF: 4 + b, uaB: -4 - b, faF: -8, faB: -8, torso: 0.6 * b, head: 0.8 * Math.sin(u * 1.3), bodyY: -2 * (b + 1) };
    },
    walk(u, o) { return gait(u, o.period || 0.96, o.stride || 16, o.knee || 42, o.bob || 9, o.arm || 18, o.lean || 1.5); },
    run(u, o) { return gait(u, o.period || 0.56, o.stride || 30, o.knee || 80, o.bob || 16, o.arm || 40, o.lean || 9, true); },
    crouch(u, o) {
      const b = Math.sin(u * 2 * Math.PI / 2.4);
      return { ...zero(), thF: -70, shF: 110, thB: -40, shB: 95, torso: 22, head: -14, uaF: -40, faF: -60, uaB: -20, faB: -40, bodyY: 115 + b };
    },
    sit(u, o) { // sitting on the floor, legs forward
      const b = Math.sin(u * 2 * Math.PI / 3.6);
      return { ...zero(), thF: -88, shF: 10, thB: -86, shB: 14, torso: -4 + 0.5 * b, head: -2, uaF: -20, faF: -40, uaB: 10, faB: -20, bodyY: 290 };
    },
    lie(u, o) { // lying on the side, breathing
      const b = Math.sin(u * 2 * Math.PI / 4.0);
      return { ...zero(), thF: -6, thB: -2, shF: 8, shB: 4, uaF: -12, faF: -24, uaB: 6, faB: -10, torso: 0.4 * b, rootR: -88, rootY: -40, rootX: 0 };
    },
    tremble(u, o) {
      const j = Math.sin(u * 61) * 1.4 + Math.sin(u * 37) * 0.9;
      return { ...zero(), thF: -6, thB: 6, shF: 12, shB: 12, uaF: -24 + j, faF: -110, uaB: -28 - j, faB: -100, torso: 6 + j * 0.6, head: -6 + j, bodyY: 14 };
    },
    holdHead(u, o) { // pain: both hands to the head
      const sway = Math.sin(u * 2.2) * 3;
      return { ...zero(), uaF: -150, faF: -106, uaB: 150, faB: 106, torso: 4 + sway * 0.5, head: 8 + sway, thF: 4, thB: -4, bodyY: 6 };
    },
    sitChair(u, o) { // sitting on a bench/chair: thighs forward, shins down
      const b = Math.sin(u * 2 * Math.PI / 3.6);
      return { ...zero(), thF: -86, shF: 84, thB: -84, shB: 82, torso: -2 + 0.5 * b, head: 0, uaF: -30, faF: -50, uaB: -10, faB: -40, bodyY: 150 };
    },
    raise(u, o) { // arm raised high (phone looking for signal)
      const sway = Math.sin(u * 1.7) * 4;
      return { ...zero(), uaF: -158 + sway, faF: -8, uaB: 4, faB: -12, torso: -3, head: -12, bodyY: -4 };
    },
    phoneEar(u, o) {
      return { ...zero(), uaF: -30, faF: -150, uaB: 4, faB: -12, torso: 1, head: 3 + Math.sin(u * 1.1) * 2, bodyY: -1 };
    },
    point(u, o) {
      const b = Math.sin(u * 2 * Math.PI / 3);
      return { ...zero(), uaF: -95 + b, faF: -6, uaB: -6, faB: -10, torso: 2, head: -4, bodyY: -1 };
    },
    torch(u, o) { // flashlight held forward with a slow search sweep
      return { ...zero(), uaF: -60 + 5 * Math.sin(u * 1.3) + 1.5 * Math.sin(u * 4.1), faF: -16 + 3 * Math.sin(u * 1.3 + 0.7), uaB: 4, faB: -10, torso: 1, head: -2 + 2 * Math.sin(u * 0.9) };
    },
    whistle(u, o) { // hand at the mouth (whistle, or a finger to the lips)
      const j = Math.sin(u * 9) * 1.2;
      return { ...zero(), uaF: -113 + j, faF: -158, uaB: 4, faB: -12, torso: -2, head: -6, bodyY: -1 };
    },
    wave(u, o) { // slow beckoning wave
      return { ...zero(), uaF: -150, faF: -20 + 24 * Math.sin(u * 2 * Math.PI / (o.period || 1.6)), uaB: 4, faB: -10, head: 4 * Math.sin(u * 0.8), torso: -1 };
    },
    phoneLook(u, o) { // looking down at something held in front (phone, camera)
      return { ...zero(), uaF: -52 + Math.sin(u * 1.1), faF: -92, uaB: 4, faB: -12, torso: 2, head: 10, bodyY: -1 };
    },
    shamble(u, o) { // the infected: leaning in, one leg dragged stiff, arms hanging forward, a lurch every step, the head snapping
      const P = o.period || 1.3, th = (2 * Math.PI * u) / P, s = Math.sin(th), c = Math.cos(th);
      const lurch = Math.max(0, s), j = twitch(u, 5, 22);
      return { ...zero(), thF: 18 * s, shF: 34 * Math.max(0, -c), thB: -10 * s, shB: 6, torso: 14 + 4 * lurch, head: 24 + 6 * Math.sin(th * 0.5 + 1) + j,
        uaF: -24 + 10 * c + j * 0.6, faF: -18, uaB: -14 - 8 * c, faB: -10, hair: -6 * s, bodyY: 10 * lurch - 4, rootR: 3 * Math.sin(th * 0.5) };
    },
    lunge(u, o) { // arms out, reaching, swaying, twitching
      const b = Math.sin(u * 2 * Math.PI / 0.9), j = twitch(u, 7, 18);
      return { ...zero(), thF: 20, shF: 30, thB: -14, shB: 10, torso: 20 + 3 * b, head: 6 + 4 * b + j, uaF: -88 + 6 * b + j, faF: -8, uaB: -78 - 6 * b - j, faB: -6, bodyY: 12 };
    },
    zrun(u, o) { // a sprinting infected: flat out, leaning hard, arms clawing ahead, head jerking
      const g = gait(u, o.period || 0.42, 34, 95, 18, 10, 22, true), j = twitch(u, 8, 20);
      return { ...g, uaF: -72 + 26 * Math.sin(u * 17) + j, faF: -22, uaB: -62 - 26 * Math.sin(u * 17), faB: -16, head: 12 + j, torso: g.torso + 6 };
    },
    swing(u, o) { // a two-handed swing from behind the shoulder to across the body in 0.22 s, then follow-through
      const k = smooth(u / 0.22);
      return { ...zero(), uaF: lerp(55, -128, k), faF: lerp(-70, -8, k), uaB: lerp(40, -110, k), faB: lerp(-60, -14, k), torso: lerp(-12, 16, k), head: lerp(-8, 6, k),
        thF: 18, shF: 22, thB: -18, shB: 10, bodyY: 10 };
    },
    push(u, o) { // braced against a door: arms straight out, leaning in, shoving
      const j = Math.sin(u * 23) * 2;
      return { ...zero(), uaF: -86 + j, faF: -4, uaB: -80 - j, faB: -6, torso: 16, head: 4, thF: 26, shF: 28, thB: -30, shB: 10, bodyY: 12 + j };
    },
    knocked(u, o) { // hit: thrown backwards off its feet over 0.4 s
      const k = smooth(u / 0.4);
      return { ...zero(), rootR: lerp(0, -62, k), rootX: lerp(0, 70, k), torso: lerp(10, -18, k), head: lerp(10, -30, k), uaF: lerp(-80, 40, k), uaB: lerp(-70, 70, k),
        thF: lerp(0, -40, k), shF: lerp(0, 50, k), thB: lerp(0, 20, k), shB: 20 };
    },
    drag(u, o) { // running while pulling someone behind by the hand
      const g = gait(u, o.period || 0.5, 30, 80, 16, 30, 12, true);
      return { ...g, uaB: 40 + 6 * Math.sin(u * 9), faB: -10 };
    },
    fall(u, o) { // stumble down onto the knees over ~0.6 s, then stay
      const k = smooth(u / 0.6);
      return { ...zero(), thF: lerp(0, -20, k), shF: lerp(0, 95, k), thB: lerp(0, 20, k), shB: lerp(0, 100, k), torso: lerp(0, 28, k), head: lerp(0, 12, k), uaF: lerp(0, -40, k), faF: lerp(0, -30, k), uaB: lerp(0, -30, k), faB: lerp(0, -40, k), bodyY: lerp(0, 120, k) };
    },
  };

  function gait(u, period, stride, knee, bob, arm, lean, running) {
    const ramp = smooth(u / (running ? 0.3 : 0.6));
    const th = 2 * Math.PI * (u / period);
    const s = Math.sin(th), c = Math.cos(th);
    const A = stride * ramp;
    const kF = knee * Math.pow(Math.max(0, -c), 1.4) + 5 * Math.max(0, c) * Math.max(0, s);
    const kB = knee * Math.pow(Math.max(0, c), 1.4) + 5 * Math.max(0, -c) * Math.max(0, -s);
    const fa = running ? 70 : 14;
    return {
      ...zero(),
      thF: A * s, thB: -A * s, shF: kF * ramp, shB: kB * ramp,
      uaF: -arm * ramp * Math.sin(th - 0.15), uaB: arm * ramp * Math.sin(th - 0.15),
      faF: -(10 + fa * Math.max(0, -Math.sin(th - 0.5))) * ramp - (running ? 40 : 0),
      faB: -(10 + fa * Math.max(0, Math.sin(th - 0.5))) * ramp - (running ? 40 : 0),
      torso: 1.6 * ramp * s * 0.6 + lean * ramp, head: 1.4 * Math.sin(2 * th + 0.8) * ramp - (running ? lean * 0.6 : 0),
      hair: 2.4 * Math.sin(2 * th - 0.9) * ramp, acc: 3 * Math.sin(th - 1.0) * ramp,
      bodyY: -bob * ramp * (Math.cos(2 * th) + 1) / 2,
    };
  }

  // foot speed in px/s for a gait at scale 1 (legLength ~288) — use to move the world under a walker
  const footSpeed = (period, stride) => (2 * 288 * Math.sin(stride * Math.PI / 180)) / (period / 2);

  const backOut = (k) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
  const UPPER = new Set(["uaF", "faF", "uaB", "faB", "head", "torso"]);
  const tick = (x) => x - Math.floor(x);
  // a quick jolt when a character's eyes snap wide (startle), decaying over 0.4 s
  const startle = (u) => (u >= 0 && u < 0.4 ? Math.sin((Math.PI * u) / 0.4) * Math.exp(-3 * u) : 0);

  function pose0(track, t) {
    // track: [{t, mode, opts, blend, look, eyes, mouth, startle}] sorted by t
    let i = 0;
    while (i + 1 < track.length && track[i + 1].t <= t) i++;
    const cur = track[i];
    const pose = MODES[cur.mode]((t - cur.t), cur.opts || {});
    // pose changes always ease in (0.22 s unless the track says otherwise); arms, head and torso overshoot a little
    const prev = i > 0 ? track[i - 1] : null;
    const blend = cur.blend ?? (prev && prev.mode !== cur.mode ? 0.3 : 0);
    if (prev && blend) {
      const k = Math.min(1, Math.max(0, (t - cur.t) / blend));
      if (k < 1) {
        const pp = MODES[prev.mode]((t - prev.t), prev.opts || {});
        const ks = smooth(k), kb = backOut(k);
        for (const j of JOINTS) pose[j] = lerp(pp[j], pose[j], UPPER.has(j) ? kb : ks);
      }
    }
    if (prev && cur.eyes === "wide" && prev.eyes !== "wide" && cur.startle !== false) {
      const a = startle(t - cur.t);
      pose.bodyY -= 14 * a; pose.head -= 9 * a; pose.torso -= 5 * a; pose.uaF -= 14 * a; pose.uaB += 10 * a;
    }
    pose.head += (cur.look || 0);
    return { pose, cur };
  }

  function evaluate(track, t) {
    const { pose, cur } = pose0(track, t);
    // living micro-motion: the head never sits perfectly still
    pose.head += 0.9 * Math.sin(t * 1.3 + 0.7) + 0.5 * Math.sin(t * 2.9 + 1.9);
    // follow-through: hair and loose accessories trail the head and torso by ~0.1 s
    if (t > 0.1) {
      const { pose: back } = pose0(track, t - 0.1);
      const dh = (pose.head + pose.torso) - (back.head + back.torso);
      pose.hair += -0.9 * dh; pose.acc += -0.5 * (pose.torso - back.torso);
    }

// four separate fingers with knuckle creases, a thumb with a nail, a wrist and a sleeve cuff). Every hand is a group in

(function () {
  const INK = "#2e2a26";
  const OUT = `stroke="${INK}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
  const mix = (a, b, k) => { const p = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16)); const A = p(a), B = p(b); return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, "0")).join(""); };

  const finger = (c, x, y, len, w, rot = 0, nail = false) => `<g transform="translate(${x},${y}) rotate(${rot})">

      <path d="M-30,-6q30,22 60,0M-40,30q40,26 80,0M-20,56q20,10 40,0" stroke="${c.skinS}" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".7"/>`;

        <rect x="770" y="1400" width="70" height="30" rx="6" fill="#e6d9bd" ${OUT}/><path d="M860,1330h40v-60" stroke="#2e2a26" stroke-width="12" fill="none" stroke-linecap="round"/>
        <g id="exhaust">${[0, 1, 2, 3, 4].map((i) => `<circle class="puff" cx="${900 + i * 18}" cy="${1250 - i * 70}" r="${26 + i * 10}" fill="#bdb5a6" opacity="${0.35 - i * 0.05}"/>`).join("")}</g></g>`);
    put(L.fg, `<rect x="-200" y="1780" width="1480" height="200" fill="#100b08"/><rect x="1000" y="-20" width="120" height="1960" fill="#100b08"/>`);

  // ---------------- verandah / doorway at night ----------------
  function verandah(L, opts = {}) {
    const r = mk(opts.seed || 5);
    put(L.sky, `<rect x="-200" y="0" width="1480" height="1920" fill="url(#nightsky)"/>${stars(r, 90)}<circle cx="240" cy="300" r="50" fill="#f4ecd8"/><circle cx="240" cy="300" r="200" fill="url(#moonhalo)"/>`);
    put(L.far, trees(r, -300, 1600, 1250, 200, 420, "#15252d", "#101d23") + palms(r, -100, 1600, 1300, "#0f1a1f"));
    put(L.mid, `<rect x="-200" y="1300" width="1480" height="210" fill="#0f191e"/><rect x="-200" y="1250" width="1480" height="60" fill="#2e2219" ${OUT}/>
      ${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<rect x="${-120 + i * 170}" y="1020" width="20" height="240" fill="#3a2a20" ${OUT}/>`).join("")}
      <path d="M-200,1060H1280" stroke="#3a2a20" stroke-width="16"/>`);

      <rect id="vDoor" x="720" y="380" width="300" height="1120" fill="#1a1310" ${OUT}/><rect id="vDoorLeaf" x="720" y="380" width="300" height="1120" fill="#3a2a20" ${OUT}/>
      <rect x="690" y="350" width="360" height="40" fill="#2e2219" ${OUT}/>`);
    put(L.fg, `<rect x="-60" y="-20" width="110" height="1960" fill="#0d0907"/><path d="M-200,1840H1280V1960H-200Z" fill="#0d0907"/>`);
    return { ground: 1500 };
  }


  // ---------------- exterior: big old two-storey teak mansion ("gingerbread" house) ----------------
  function fret(x0, x1, y, r, col) { // scalloped fretwork under the eaves
    let d = "";
    for (let x = x0; x < x1; x += r * 2) d += `M${x},${y}a${r},${r} 0 0 0 ${r * 2},0`;
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="5"/>` +
      `<path d="M${x0},${y}H${x1}" stroke="${col}" stroke-width="8"/>`;
  }
  function shutterWin(x, y, w, h, lit, id) {
    const glass = lit ? "#ffd58a" : "#1b2328";
    return `<g${id ? ` id="${id}"` : ""}><rect x="${x - 6}" y="${y - 26}" width="${w + 12}" height="22" fill="#3b2c22" ${OUT}/>
      <path d="M${x - 6},${y - 26}l${(w + 12) / 2},-22l${(w + 12) / 2},22z" fill="#3b2c22" ${OUT}/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${glass}" ${OUT}/>
      <path d="M${x + w / 2},${y}V${y + h}" stroke="#2e2a26" stroke-width="5"/>
      ${lit ? `<circle cx="${x + w / 2}" cy="${y + h / 2}" r="${h}" fill="url(#lampglow)" opacity=".55"/>` : ""}
      <rect x="${x - w * 0.42}" y="${y}" width="${w * 0.4}" height="${h}" fill="#5a4030" ${OUT}/>
      <rect x="${x + w * 1.02}" y="${y}" width="${w * 0.4}" height="${h}" fill="#5a4030" ${OUT} transform="rotate(4 ${x + w} ${y})"/>
      ${[0.2, 0.4, 0.6, 0.8].map((k) => `<path d="M${x - w * 0.4},${y + h * k}h${w * 0.36}M${x + w * 1.04},${y + h * k}h${w * 0.36}" stroke="#3b2c22" stroke-width="3"/>`).join("")}</g>`;
  }
  function balusters(x0, x1, y, h, col) {
    let s = `<path d="M${x0},${y}H${x1}M${x0},${y + h}H${x1}" stroke="${col}" stroke-width="10"/>`;
    for (let x = x0 + 10; x < x1; x += 26) s += `<rect x="${x}" y="${y}" width="10" height="${h}" fill="${col}"/>`;
    return s;
  }
  function banyan(x, base) {
    let s = `<path d="M${x - 60},${base}C${x - 40},${base - 300} ${x - 70},${base - 520} ${x - 10},${base - 700}L${x + 40},${base - 700}C${x + 60},${base - 500} ${x + 40},${base - 300} ${x + 70},${base}Z" fill="#0f1a16"/>`;
    for (let i = 0; i < 6; i++) s += `<ellipse cx="${x - 260 + i * 110}" cy="${base - 760 - (i % 2) * 70}" rx="190" ry="120" fill="${i % 2 ? "#0c1612" : "#101d18"}"/>`;
    for (let i = 0; i < 14; i++) { const rx = x - 300 + i * 46; s += `<path d="M${rx},${base - 700}q${(i % 3) * 6 - 6},${200 + (i % 4) * 60} ${(i % 2 ? 8 : -8)},${360 + (i % 5) * 50}" stroke="#0f1a16" stroke-width="5" fill="none"/>`; }
    return s;
  }
  function mansionExterior(L, opts = {}) {
    const r = mk(opts.seed || 21);
    const T = "#5a4030", D = "#3b2c22", W = "#4a3426";
    const tod = opts.time || "night";
    const SKY = { night: "url(#nightsky)", dusk: "url(#duskSky)", day: "url(#daySky)" }[tod];
    const HILL = { night: "#1b2d36", dusk: "#6a4a52", day: "#7fa58a" }[tod];
    const TREE = { night: ["#18282f", "#132127"], dusk: ["#4a3440", "#3a2834"], day: ["#5f8a6a", "#4e7558"] }[tod];
    const PALM = { night: "#111d22", dusk: "#2e2026", day: "#3f5e47" }[tod];
    put(L.sky, `<rect x="-400" y="0" width="1880" height="1920" fill="${SKY}"/>` + (tod === "night" ? `${stars(r, 140)}
      <circle cx="${opts.moonX || 880}" cy="250" r="240" fill="url(#moonhalo)"/><circle cx="${opts.moonX || 880}" cy="250" r="56" fill="#f4ecd8"/>` :
      tod === "dusk" ? `<circle cx="820" cy="980" r="320" fill="url(#sunhalo)"/><circle cx="820" cy="980" r="90" fill="#ffcf8a"/>` :
      `<circle cx="860" cy="260" r="280" fill="url(#sunhalo)" opacity=".6"/><ellipse cx="300" cy="300" rx="180" ry="50" fill="#f4f1e6" opacity=".8"/><ellipse cx="760" cy="420" rx="140" ry="40" fill="#f4f1e6" opacity=".7"/>`));
    put(L.far, `<path d="M-400,1160Q0,1000 360,1090T1000,1050T1700,1100V1320H-400Z" fill="${HILL}"/>` + trees(r, -400, 1800, 1260, 180, 320, TREE[0], TREE[1]));
    put(L.mid, palms(r, -300, 1800, 1430, PALM));
    const X = opts.houseX ?? -60; // the house is wider than the frame; scenes pan across it
    put(L.set, `
      <rect x="-400" y="1440" width="1880" height="480" fill="${{ night: "#121d17", dusk: "#3b3a2a", day: "#6f8f4f" }[tod]}"/>
      <path d="M-400,1530Q300,1490 1480,1540V1920H-400Z" fill="${{ night: "#0e1712", dusk: "#2e2c20", day: "#5e7c42" }[tod]}"/>
      <g id="house" transform="translate(${X},${opts.houseY || 0}) scale(${opts.houseScale || 1})">
        <!-- brick base with arches -->
        <rect x="0" y="1360" width="1200" height="110" fill="#6b4a3a" ${OUT}/>
        ${[0, 1, 2, 3, 4, 5].map((i) => `<path d="M${40 + i * 200},1470v-60a40,40 0 0 1 80,0v60z" fill="#1a1310" ${OUT}/>`).join("")}
        <!-- ground floor -->
        <rect x="20" y="1040" width="1160" height="330" fill="url(#planks)" ${OUT}/>
        <rect x="0" y="1340" width="1200" height="26" fill="${D}" ${OUT}/>
        ${shutterWin(110, 1110, 90, 170, false)}${shutterWin(330, 1110, 90, 170, false)}${shutterWin(870, 1110, 90, 170, false)}${shutterWin(1050, 1110, 70, 170, false)}
        <rect id="houseDoor" x="530" y="1080" width="160" height="270" fill="#2a1e17" ${OUT}/><path d="M530,1080a80,80 0 0 1 160,0" fill="${D}" ${OUT}/>
        <!-- ground-floor verandah posts + railing -->
        ${[0, 1, 2, 3, 4, 5, 6].map((i) => `<rect x="${10 + i * 196}" y="1020" width="22" height="330" fill="${D}" ${OUT}/>`).join("")}
        ${balusters(0, 470, 1270, 70, D)}${balusters(750, 1200, 1270, 70, D)}
        <!-- first-floor eave + fretwork -->
        <path d="M-50,1040H1250L1210,990H-10Z" fill="${D}" ${OUT}/>${fret(-40, 1240, 1046, 16, "#c9b98f")}
        <!-- upper floor -->
        <rect x="60" y="720" width="1080" height="290" fill="url(#planks)" ${OUT}/>
        ${shutterWin(150, 780, 80, 170, false)}${shutterWin(340, 780, 80, 170, true, "winLit")}${shutterWin(780, 780, 80, 170, false, "winDark")}${shutterWin(970, 780, 80, 170, false)}
        <!-- central balcony -->
        <rect x="500" y="760" width="220" height="250" fill="#2a1e17" ${OUT}/>${balusters(470, 750, 930, 80, D)}<rect x="460" y="1006" width="300" height="20" fill="${D}" ${OUT}/>
        <!-- roofs: two side gables and a tall central gable -->
        <path d="M20,730L250,470L480,730Z" fill="${D}" ${OUT}/><path d="M720,730L950,470L1180,730Z" fill="${D}" ${OUT}/>
        <path d="M-40,740H1240L1180,700H20Z" fill="${W}" ${OUT}/>${fret(-30, 1230, 744, 14, "#c9b98f")}
        <path d="M400,720L610,330L820,720Z" fill="#33251c" ${OUT}/><path d="M440,700L610,390L780,700" fill="none" stroke="#c9b98f" stroke-width="6"/>
        <circle cx="610" cy="560" r="44" fill="#1b2328" ${OUT}/><path d="M610,516V604M566,560H654" stroke="#2e2a26" stroke-width="5"/>
        <path d="M600,330l10,-50l10,50" fill="${D}" ${OUT}/>
        <!-- grand front stairs -->
        <path d="M520,1366H700L780,1500H440Z" fill="#4a3426" ${OUT}/>
        ${[0, 1, 2, 3].map((i) => `<path d="M${508 - i * 20},${1394 + i * 30}H${712 + i * 20}" stroke="#2e2a26" stroke-width="5"/>`).join("")}
      </g>
      ${banyan(opts.banyanX ?? 1320, 1470)}`);
    put(L.fg, `<g id="gate"><rect x="-80" y="1180" width="40" height="740" fill="#0a0f0c"/><rect x="250" y="1180" width="40" height="740" fill="#0a0f0c"/>
        <path d="M-40,1260H250M-40,1420H250" stroke="#0a0f0c" stroke-width="12"/>${[0, 1, 2, 3, 4, 5, 6, 7].map((i) => `<path d="M${-30 + i * 36},1240V1720" stroke="#0a0f0c" stroke-width="8"/><path d="M${-30 + i * 36},1240l-8,-26h16z" fill="#0a0f0c"/>`).join("")}</g>
      <path d="M700,1920Q760,1660 920,1640Q1060,1620 1480,1700V1920Z" fill="#060b08"/>
      <path d="M1480,-40C1300,90 1150,140 960,150" stroke="#060b08" stroke-width="34" fill="none" stroke-linecap="round"/>` +
      [0, 1, 2, 3, 4, 5].map((i) => `<ellipse cx="${1040 + i * 64}" cy="${150 - i * 16 + (i % 2) * 26}" rx="64" ry="24" fill="#08100c" transform="rotate(${-18 + i * 6} ${1040 + i * 64} ${150 - i * 16})"/>`).join(""));
    return { ground: 1500 };
  }

  // ---------------- interior: grand hall with staircase ----------------
  function hall(L, opts = {}) {
    put(L.sky, `<rect x="-400" y="0" width="1880" height="1920" fill="#20170f"/>`);
    put(L.far, `<rect x="-400" y="0" width="1880" height="1500" fill="url(#planks)" opacity=".8"/>
      ${[0, 1, 2].map((i) => `<g><rect x="${-200 + i * 520}" y="380" width="200" height="260" fill="#6b4a3a" ${OUT}/><rect x="${-180 + i * 520}" y="400" width="160" height="220" fill="#2a1e17"/>
        <ellipse cx="${-100 + i * 520}" cy="480" rx="40" ry="50" fill="#3b2c22"/><path d="M${-160 + i * 520},620q60,-90 120,0" fill="#3b2c22"/></g>`).join("")}
      <rect x="-400" y="1480" width="1880" height="440" fill="url(#floorb)"/>`);
    put(L.mid, `<g id="stairs"><path d="M700,1500L1300,700H1480V1500Z" fill="#3b2c22" ${OUT}/>
        ${Array.from({ length: 14 }, (_, i) => `<path d="M${700 + i * 43},${1500 - i * 57}h60v57" fill="none" stroke="#2e2a26" stroke-width="5"/>`).join("")}
        <path d="M660,1380L1260,580" stroke="#2e2a26" stroke-width="16"/>
        ${Array.from({ length: 12 }, (_, i) => `<path d="M${690 + i * 48},${1350 - i * 64}v120" stroke="#3b2c22" stroke-width="10"/>`).join("")}</g>`);
    put(L.set, `<g id="chandelier"><path d="M300,0V180" stroke="#2e2a26" stroke-width="6"/><path d="M200,200q100,80 200,0" fill="none" stroke="#2e2a26" stroke-width="10"/>
        ${[0, 1, 2, 3, 4].map((i) => `<rect x="${206 + i * 46}" y="${180 + (i % 2) * 10}" width="8" height="26" fill="#e6d9bd"/>`).join("")}</g>
      <rect x="-60" y="1300" width="300" height="200" fill="#4a3426" ${OUT}/><rect x="-40" y="1320" width="260" height="20" fill="#3b2c22"/>`);
    put(L.fg, `<rect x="-400" y="1800" width="1880" height="200" fill="#0f0a07"/><rect x="-60" y="-20" width="120" height="1960" fill="#0f0a07"/>`);
    return { ground: 1500 };
  }


  // ---------------- props ----------------
  const props = {
    generator(id, x, y, s = 1, running = true) {
      return `<g id="${id}" transform="translate(${x},${y}) scale(${s})"><path d="M-180,0V-250q0,-30 30,-30h300q30,0 30,30V0" fill="none" stroke="#3a3f45" stroke-width="16" stroke-linejoin="round"/><path d="M-180,-120h360" stroke="#3a3f45" stroke-width="12"/>
        <rect x="-150" y="-200" width="300" height="200" rx="18" fill="#c0603e" ${OUT}/><rect x="-150" y="-200" width="300" height="34" rx="10" fill="#8a3f2a" ${OUT}/><rect x="-40" y="-236" width="80" height="40" rx="8" fill="#2e2a26" ${OUT}/><circle cx="0" cy="-216" r="12" fill="#5b6066"/>
        <rect x="-120" y="-170" width="150" height="90" rx="8" fill="#2e2a26"/><rect x="-108" y="-158" width="60" height="30" rx="4" fill="#1a1512"/><circle cx="80" cy="-140" r="22" fill="#e6d9bd" ${OUT}/><circle cx="80" cy="-140" r="12" fill="#2e2a26"/><path d="M80,-140l8,-10" stroke="#c8392b" stroke-width="3"/>
        <path d="M150,-170h30v-40q0,-14 14,-14h20" fill="none" stroke="#5b6066" stroke-width="12" stroke-linecap="round"/><rect x="100" y="-60" width="46" height="26" rx="6" fill="#5b6066" ${OUT}/>
        <rect x="60" y="-90" width="70" height="30" rx="6" fill="#e6d9bd" ${OUT}/><path d="M150,-160h40v-60" stroke="#2e2a26" stroke-width="12" fill="none" stroke-linecap="round"/>
        <rect x="-130" y="-8" width="40" height="16" rx="6" fill="#2e2a26"/><rect x="90" y="-8" width="40" height="16" rx="6" fill="#2e2a26"/>
        <g id="${id}-shim" opacity="${running ? 0.35 : 0}">${[0, 1, 2].map((i) => `<path d="M${180 + i * 14},-230q-12,-30 0,-60t0,-60" stroke="#e8efe6" stroke-width="3" fill="none" opacity=".5"/>`).join("")}</g></g>`;
    },
    landlady(id, x, y, s = 1, umbrella = false) {
      return `<g id="${id}" transform="translate(${x},${y}) scale(${s})"><path d="M-55,0C-62,-150 -50,-300 -30,-360H30C50,-300 62,-150 55,0Z" fill="#1a1512"/>
        <ellipse cx="0" cy="-400" rx="36" ry="42" fill="#1a1512"/><ellipse cx="0" cy="-444" rx="26" ry="16" fill="#1a1512"/>
        <g id="${id}-arm"><path d="M30,-330Q90,-300 130,-340" stroke="#1a1512" stroke-width="26" fill="none" stroke-linecap="round"/></g>
        ${umbrella ? `<path d="M-160,-470Q0,-600 160,-470Z" fill="#2a2420"/><path d="M0,-560V-330" stroke="#2a2420" stroke-width="8"/>` : ""}</g>`;
    },
    ghostSeated(id, x, y, s = 1) {
      return `<g id="${id}" transform="translate(${x},${y}) scale(${s})" opacity="0">
        <path d="M-80,0Q-90,-120 -50,-220Q0,-250 50,-220Q90,-120 80,0Z" fill="#0b0f12" opacity=".9" stroke="#cfdcd8" stroke-width="3" stroke-opacity=".35"/>
        <ellipse cx="0" cy="-280" rx="44" ry="52" fill="#0b0f12" opacity=".95" stroke="#cfdcd8" stroke-width="3" stroke-opacity=".35"/>
        <path d="M-46,-300Q-70,-160 -40,-90M46,-300Q70,-160 40,-90M-30,-320Q-50,-150 -10,-70M30,-320Q50,-150 10,-70" stroke="#0b0f12" stroke-width="22" fill="none" opacity=".85" stroke-linecap="round"/>
        <g id="${id}-face" opacity="0"><ellipse cx="-14" cy="-284" rx="6" ry="3" fill="#dfe7e4"/><ellipse cx="14" cy="-284" rx="6" ry="3" fill="#dfe7e4"/></g></g>`;
    },
    bench(x, y, s = 1) {
      return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-260" y="-130" width="520" height="34" rx="8" fill="#6b4a3a" ${OUT}/><rect x="-240" y="-96" width="24" height="96" fill="#4a3426" ${OUT}/><rect x="216" y="-96" width="24" height="96" fill="#4a3426" ${OUT}/></g>`;
    },
    mat(x, y, w = 420) {
      return `<rect x="${x}" y="${y - 24}" width="${w}" height="30" rx="8" fill="#9c7a52" ${OUT}/><path d="M${x + 20},${y - 9}h${w - 40}" stroke="#7a5c3c" stroke-width="4"/>`;
    },
    rain(id, n = 140, seed = 3) {
      const r = mk(seed);
      let d = "";
      for (let i = 0; i < n; i++) { const x = r() * 1600 - 260, y = r() * 2400 - 300, l = 50 + r() * 70; d += `M${x},${y}l${-l * 0.18},${l}`; }
      return `<g id="${id}"><path d="${d}" stroke="#b9cdd3" stroke-width="3" opacity=".45" stroke-linecap="round"/><path d="${d}" transform="translate(0,-2400)" stroke="#b9cdd3" stroke-width="3" opacity=".45" stroke-linecap="round"/></g>`;
    },
    beacon(id, x, y) {
      return `<g id="${id}" transform="translate(${x},${y})"><rect x="-140" y="-90" width="280" height="90" rx="14" fill="#e6d9bd" ${OUT}/><rect x="-120" y="-150" width="160" height="70" rx="10" fill="#e6d9bd" ${OUT}/>
        <rect x="-110" y="-140" width="60" height="44" fill="#1b2328"/><circle cx="-80" cy="10" r="30" fill="#2e2a26"/><circle cx="90" cy="10" r="30" fill="#2e2a26"/>
        <rect x="-60" y="-170" width="70" height="18" rx="6" fill="#ff9a3c" ${OUT}/><circle id="${id}-glow" cx="-25" cy="-160" r="260" fill="url(#beacon)" opacity=".8"/></g>`;
    },
    shadowSweep(id) {
      return `<ellipse id="${id}" cx="-300" cy="900" rx="170" ry="520" fill="#05080a" opacity="0"/>`;
    },
  };

  window.Sets = { DEFS, houseExterior, mansionExterior, hall, bedroom, backroom, verandah, props };
})();
</script><script>// Layered sets and creatures for "ค่ายคืนสุดท้าย": the volunteer camp clearing (dusk / night), the deep
// forest at night, the ranger hut, a wild elephant and a green pit viper. Same layer contract as sets.js
// (sky, far, mid, set, fg + glow for light sources). Deterministic: seeded RNG only.
(function () {
  const INK = "#2e2a26";
  const OUT = `stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  const mk = (seed) => () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const put = (el, html) => el.insertAdjacentHTML("beforeend", html);

  Sets.DEFS += `
    <radialGradient id="fireglow"><stop offset="0" stop-color="#ffb35c" stop-opacity=".75"/><stop offset=".35" stop-color="#ff8a3c" stop-opacity=".28"/><stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="winglow"><stop offset="0" stop-color="#ffd58a" stop-opacity=".6"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient>
    <radialGradient id="phoneglow"><stop offset="0" stop-color="#cfe9f2" stop-opacity=".7"/><stop offset="1" stop-color="#cfe9f2" stop-opacity="0"/></radialGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe2e6" stop-opacity=".16"/><stop offset="1" stop-color="#cfe2e6" stop-opacity="0"/></linearGradient>
    <radialGradient id="beaconBlue"><stop offset="0" stop-color="#5fa8ff" stop-opacity=".85"/><stop offset="1" stop-color="#5fa8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="dawnsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e4d6e"/><stop offset=".55" stop-color="#b88a8a"/><stop offset="1" stop-color="#f2c08a"/></linearGradient>
    <linearGradient id="nightsky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c161d"/><stop offset=".6" stop-color="#1a2d38"/><stop offset="1" stop-color="#2b4552"/></linearGradient>`;

  // ---------- vegetation ----------
  function pine(x, base, h, w, col, shade) {
    let t = `<rect x="${x - w * 0.06}" y="${base - h * 0.3}" width="${w * 0.12}" height="${h * 0.3}" fill="${shade}"/>`;
    for (let i = 0; i < 4; i++) {
      const top = base - h + i * h * 0.18, bot = base - h * 0.22 - (3 - i) * h * 0.05, cw = w * (0.45 + i * 0.18);
      t += `<path d="M${x},${top}L${x + cw / 2},${bot}Q${x},${bot + h * 0.04} ${x - cw / 2},${bot}Z" fill="${col}"/>`;

    }
    return t;
  }
  function broad(x, base, h, col, shade, trunk) { // tropical tree: tall trunk, layered crown
    const w = h * 0.55;
    let t = `<path d="M${x - 14},${base}C${x - 8},${base - h * 0.4} ${x - 18},${base - h * 0.6} ${x},${base - h * 0.75}C${x + 18},${base - h * 0.6} ${x + 8},${base - h * 0.4} ${x + 14},${base}Z" fill="${trunk}"/>`;
    t += `<ellipse cx="${x}" cy="${base - h * 0.8}" rx="${w * 0.6}" ry="${h * 0.2}" fill="${col}"/>`;
    t += `<ellipse cx="${x - w * 0.35}" cy="${base - h * 0.72}" rx="${w * 0.38}" ry="${h * 0.14}" fill="${col}"/>`;
    t += `<ellipse cx="${x + w * 0.35}" cy="${base - h * 0.74}" rx="${w * 0.4}" ry="${h * 0.15}" fill="${shade}"/>`;

  function tufts(r, x0, x1, base, col, n = 1) {

      const h = (30 + r() * 50) * n;
      d += `M${x},${base}q${-6},${-h * 0.6} ${-14},${-h}M${x},${base}q2,${-h * 0.7} 4,${-h * 1.1}M${x},${base}q8,${-h * 0.6} ${18},${-h * 0.9}`;

  function campfire(id, x, y, s, lit) {

      ${[-80, -48, -10, 30, 66, 92].map((sx, i) => `<ellipse cx="${sx}" cy="${-6 + (i % 2) * 6}" rx="26" ry="16" fill="#6d6a62" ${OUT}/>`).join("")}

  // animate the map: route draws, zone and post pulse, "you" pings, the thing's eyes blink
  function animMap(tl, scope, t0, dur, o = {}) {
    const rt = document.querySelector(`${scope} .mroute`);
    tl.to(rt, { attr: { "stroke-dashoffset": 0 }, duration: o.draw || 1.6, ease: "power1.inOut" }, t0 + (o.drawAt ?? 2.0));
    tl.fromTo(`${scope} .mping`, { attr: { r: 20 }, opacity: 1 }, { attr: { r: 70 }, opacity: 0, duration: 0.9, repeat: Math.ceil(dur / 0.9), ease: "power2.out", immediateRender: false }, t0);
    tl.fromTo(`${scope} .mzone`, { opacity: 0.55 }, { opacity: 1, duration: 0.5, repeat: Math.ceil(dur / 0.5), yoyo: true, immediateRender: false }, t0);
    tl.fromTo(`${scope} .mdist`, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(3)", immediateRender: false }, t0 + (o.drawAt ?? 2.0) + (o.draw || 1.6));
    document.querySelectorAll(`${scope} .mlabel`).forEach((g, i) => tl.fromTo(g, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t0 + 0.9 + i * 0.18));
    for (let k = 0.6; k < dur; k += 1.3) { tl.set(`${scope} .mthing`, { opacity: 0 }, t0 + k); tl.set(`${scope} .mthing`, { opacity: 1 }, t0 + k + 0.15); }
    if (o.circle) { // the eyes prowl round the post
      const th = document.querySelector(`${scope} .mthing`), c = { a: 0 };
      tl.to(c, { a: Math.PI * 2 * (dur / 4), duration: dur, ease: "none", onUpdate: () => th.setAttribute("transform", `translate(${(o.circle[0] + Math.cos(c.a) * 170).toFixed(1)},${(o.circle[1] + Math.sin(c.a) * 130).toFixed(1)})`) }, t0);
    }
    if (document.querySelector(`${scope} .mlb`)) tl.fromTo(`${scope} .mlb`, { attr: { fill: "#e8705a" } }, { attr: { fill: "#5fa8e8" }, duration: 0.25, repeat: Math.ceil(dur / 0.25), yoyo: true, immediateRender: false }, t0);
  }

  // a front-facing infected face (peephole jump scare): sunken sockets, milky bloodshot eyes with pin pupils, black veins,

  // the water maths, written in marker on the bathroom mirror (diegetic instead of a floating card):
  // pieces #id-mw0..4 are wiped in by clip rects #id-mc0..4 (attr width), doodles .mdraw are drawn by stroke-dashoffset
  function mirrorMath(id, done) {
    const INKM = "#1b2a52", RED = "#c62a1f";
    const fig = (x, y, k) => `<g class="mdraw"><circle cx="${x}" cy="${y - 62}" r="15" fill="none" stroke="${INKM}" stroke-width="7" pathLength="1"/><path d="M${x},${y - 46}V${y - 8}M${x - 20},${y - 34}L${x + 20},${y - 34}M${x},${y - 8}L${x - 15},${y + 16}M${x},${y - 8}L${x + 15},${y + 16}" stroke="${INKM}" stroke-width="7" fill="none" stroke-linecap="round" pathLength="1"/></g>`;
    const bottle = (x, y) => `<path class="mdraw" d="M${x - 6},${y - 52}h12v10q12,6 12,18v40q0,6 -6,6h-24q-6,0 -6,-6v-40q0,-12 12,-18z" stroke="${INKM}" stroke-width="5" fill="none" stroke-linejoin="round" pathLength="1"/>`;
    const piece = (k, x, y, w, body) => `<clipPath id="${id}-mc${k}"><rect id="${id}-mr${k}" x="${x}" y="${y - 90}" width="${done ? w : 0}" height="130"/></clipPath><g id="${id}-mw${k}" clip-path="url(#${id}-mc${k})">${body}</g>`;
    const T = (x, y, txt, size = 60, col = INKM) => `<text x="${x}" y="${y}" font-family="Kanit" font-weight="700" font-size="${size}" fill="${col}">${txt}</text>`;
    let s = `<rect x="150" y="250" width="780" height="530" rx="18" fill="url(#zChrome)" ${OUT}/><rect x="168" y="268" width="744" height="494" rx="10" fill="#cfe0e4"/>

    s += `<g transform="rotate(-2 540 520)" style="${done ? "" : ""}">`;
    s += `<g id="${id}-mf0">${fig(220, 430, 0)}</g>`;
    s += piece(0, 262, 420, 470, T(262, 420, "1 คน · 1 วัน"));

    s += `<g id="${id}-mb">${[585, 645, 705, 765].map((x) => bottle(x, 530)).join("")}</g>`;
    s += `<g id="${id}-mf1">${[200, 250, 300].map((x, k) => fig(x, 680, k)).join("")}</g>`;
    s += piece(2, 340, 668, 300, T(340, 668, "× 3 วัน ="));

  // first-person run down the 23rd-floor corridor: a true perspective box (eye 1.6 m, f = 935 px, vanishing point 540,960),

    s += quad(P(-W, 0, Z0), P(-W, H, Z0), P(-W, H, Z1), P(-W, 0, Z1), "#d6cfbf");
    s += quad(P(W, 0, Z0), P(W, H, Z0), P(W, H, Z1), P(W, 0, Z1), "#c8c0ae");

    const doors = o.doors || [[1, 2.2, "2309"], [-1, 2.9, "2310"], [1, 4.6, "2307"], [-1, 5.6, "2308"], [1, 8.0, "2305"], [-1, 9.4, "2306"], [1, 12.5, "2303"], [-1, 14.5, "2304"]];

        s += `<g id="${id}-d2307">${panel}</g><g id="${id}-d2307o" opacity="0">${quad(P(X, 0, hinge), P(X, 2.05, hinge), P(ox, 2.05, oz), P(ox, 0, oz), "#7a5a3e", OUT)}</g>${plate}`;

    if (o.night) { put(L.glow, `<circle cx="${vx}" cy="${vy - 38}" r="120" fill="url(#zExit)"/>`); if (o.smoke) smokeLayer(L, o.smoke, -900, 2000, 7); put(L.act, zLunge(`${id}-z`, 0, 0, 1)); return; }
    put(L.glow, `<ellipse class="zflickg" cx="${vx}" cy="${vy - 260}" rx="760" ry="560" fill="url(#zGlowW)" opacity=".35"/>`);
    put(L.glow, `<radialGradient id="${id}-fog"><stop offset="0" stop-color="#d9d3c4" stop-opacity=".75"/><stop offset="1" stop-color="#d9d3c4" stop-opacity="0"/></radialGradient><ellipse cx="${vx}" cy="${vy}" rx="260" ry="300" fill="url(#${id}-fog)"/>`);

  // looking straight down the stairwell from the floor-19 landing: a real switchback stair in one-point perspective

  // Drawn deepest first with depth fog. #id-up = the infected one floor down, looking up; #id-hand = its hand on the rail.
  function stairShaft(L, o = {}) {

    const P = (X, Y, Z) => `${f1(cx + (f * X) / Z)},${f1(cy + (f * Y) / Z)}`;

    put(L.sky, `<rect x="-900" y="-600" width="2900" height="3200" fill="#050606"/>`);
    let s = "";
    // shaft walls, banded per half floor so they darken with depth
    for (let z = 0.75; z < 1.6 + RISE * N; z += 1.5) {
      const z2 = z + 1.5;
      s += quad([P(-WX, -WY, z), P(WX, -WY, z), P(WX, -WY, z2), P(-WX, -WY, z2)], mix("#545b57", z));
      s += quad([P(-WX, WY, z), P(WX, WY, z), P(WX, WY, z2), P(-WX, WY, z2)], mix("#4e5551", z));
      s += quad([P(-WX, -WY, z), P(-WX, WY, z), P(-WX, WY, z2), P(-WX, -WY, z2)], mix("#5d6460", z));
      s += quad([P(WX, -WY, z), P(WX, WY, z), P(WX, WY, z2), P(WX, -WY, z2)], mix("#575e5a", z));

      let t = "";
      for (let k = TREADS - 1; k >= 0; k--) {
        const ya = yFrom + ((yTo - yFrom) * k) / TREADS, yb = yFrom + ((yTo - yFrom) * (k + 1)) / TREADS, z = zTop + ((k + 1) * (RISE / 2)) / TREADS;
        t += quad([P(x0, ya, z), P(x1, ya, z), P(x1, yb, z), P(x0, yb, z)], mix(k % 2 ? "#8f948f" : "#868b86", z));
        t += `<path d="M${P(x0, ya, z)}L${P(x1, ya, z)}" stroke="${mix("#c9ccc4", z)}" stroke-width="${f1(Math.max(1, 26 / z))}"/>`;
        t += quad([P(x0, ya, z - RISE / 2 / TREADS), P(x1, ya, z - RISE / 2 / TREADS), P(x1, ya, z), P(x0, ya, z)], mix("#5f645f", z));

    const rail = (x, yA, zA, yB, zB) => { // sloped handrail 0.9 m above the nosings, with balusters
      let t = "";
      for (let k = 0; k <= 6; k++) { const y = yA + ((yB - yA) * k) / 6, z = zA + ((zB - zA) * k) / 6; t += `<path d="M${P(x, y, z - 0.9)}L${P(x, y, z)}" stroke="${mix("#9aa0a2", z)}" stroke-width="${f1(Math.max(1, 20 / z))}"/>`; }
      return t + `<path d="M${P(x, yA, zA - 0.9)}L${P(x, yB, zB - 0.9)}" stroke="${mix("#d6d9dc", zA)}" stroke-width="${f1(Math.max(1.5, 46 / zA))}" stroke-linecap="round"/>`;
    };
    for (let n = N - 1; n >= 0; n--) {
      const Z = 1.6 + RISE * n, fl = 19 - n;
      // near landing of this floor (where the flight down starts)
      s += quad([P(-WX, -WY, Z), P(WX, -WY, Z), P(WX, -WY + LD, Z), P(-WX, -WY + LD, Z)], mix("#7d827e", Z));
      // flight B (right side) arrives here from the far landing below... drawn as part of the floor above it; this floor's own pieces:
      s += flight(GAP, WX, WY - LD, -WY + LD, Z + RISE / 2);                         // B: far landing → next floor's near landing
      s += quad([P(-WX, WY - LD, Z + RISE / 2), P(WX, WY - LD, Z + RISE / 2), P(WX, WY, Z + RISE / 2), P(-WX, WY, Z + RISE / 2)], mix("#7a7f7b", Z + RISE / 2));

      s += rail(-GAP, -WY + LD, Z, WY - LD, Z + RISE / 2);
      if (n > 0) { // stencilled floor number on the landing, and the green exit sign glow on the near wall
        s += `<text x="${f1(cx + (f * -0.9) / Z)}" y="${f1(cy + (f * (-WY + LD * 0.62)) / Z)}" text-anchor="middle" font-family="Kanit" font-weight="900" font-size="${f1((f * 0.5) / Z)}" fill="${mix("#e8e2cf", Z)}" opacity=".8">${fl}</text>`;
        s += `<circle cx="${f1(cx + (f * 1.2) / Z)}" cy="${f1(cy + (f * -WY) / Z)}" r="${f1((f * 0.9) / Z)}" fill="url(#zExit)" opacity="${f1(Math.max(0.15, 1 - n * 0.12))}"/>`;

      if (n === 1) { // the infected (the office worker), one floor down in the well, face turned up, arms reaching up at her
        const Zh = Z + 0.2, px = cx + (f * 0.05) / Zh, py = cy + (f * 0.9) / Zh, k = (0.62 / Zh) * 1.45;

  // ---------------- cutaway: a noise on floor 19 spreads through the building; the infected on nearby floors turn to it ----------------
  // #id-ring0..2 expand from the landing; #id-z<k> (dots on other floors) slide to the stairwell; #id-us = ข้าว + บอส
  const NOISE_FL = [23, 22, 21, 20, 19, 18, 17, 16, 15];

  // a layer of smoke hanging from the ceiling down to y (rolling blobs are .smoke, drifted by zlife), drawn in the glow layer so it covers the light

  };

  // ---------------- the 23rd-floor corridor from the side: 2306 (ours, left), 2307 (open, dark), the door to stair A (right) under its sign ----------------
  // smoke under the ceiling, the green exit sign; #id-cab = the extinguisher cabinet on the wall
  function hallSide(L, o = {}) {
    const id = o.id || "hs3", G = 1500;
    put(L.sky, `<rect x="-900" y="-600" width="2900" height="3200" fill="#0b0b0a"/>`);

      : `<rect x="${x}" y="${G - 550}" width="240" height="550" fill="#7a5a3e" ${OUT}/><circle cx="${x + 200}" cy="${G - 270}" r="10" fill="#c9b48a"/>`}

    s += door(-560, "2306") + door(80, "2307", true) + door(700, "2305");

  // ---------------- close-up: the door to stair A — hot: an orange glow behind the wired glass, smoke curling out of the gaps ----------------
  // #id-hand = ข้าว's hand (touches, recoils), #id-curl = the smoke wisps (drifted up by the shot)
  function fireDoor(L, o = {}) {

      <g id="${id}-curl">${Array.from({ length: 16 }, (_, k) => { const side = k % 4, x = side === 0 ? 120 : side === 1 ? 960 : 160 + r() * 760, y = side < 2 ? 300 + r() * 1500 : side === 2 ? -150 : 2150;

      ${[-70, -28, 14].map((y) => `<path d="M-80,${y}C-130,${y - 10} -140,${y + 26} -86,${y + 30}" fill="#ecc29c" ${OUT}/>`).join("")}</g>`);

  // ---------------- close-up: the battery smoke alarm on the ceiling, LED blinking, smoke drifting past it ----------------
  function smokeAlarm(L, o = {}) {
    const id = o.id || "sa3";

      <g transform="translate(540,760)"><ellipse cx="0" cy="40" rx="250" ry="70" fill="#000" opacity=".15"/><circle r="230" fill="#f4f2ec" ${OUT}/><circle r="170" fill="none" stroke="#d6d2c8" stroke-width="10"/>

  function street(L, o = {}) {
    const id = o.id || "st3", G = 1500, r = mk(o.seed || 91);

    put(L.far, far);
    let s = `<rect x="-900" y="${G - 40}" width="2900" height="1300" fill="#1c1e22"/><path d="M-900,${G + 160}H2000" stroke="#d6d2c8" stroke-width="10" stroke-dasharray="80 60" opacity=".5"/>`;

    if (o.convoy) s += [[-1500, 1420, 0.7], [-700, 1400, 0.62], [1300, 1400, 0.62], [2100, 1420, 0.7]].map(([x, y, k], i) => `<g id="${id}-c${i}"><g transform="translate(${x},${y}) scale(${k})"><rect x="20" y="-560" width="860" height="430" fill="#4a1e1a" ${OUT}/>

    // the truck: cab on the left, flatbed with a 20-ft container, its doors at the rear (right)
    s += `<g transform="translate(${o.truckX ?? 260},${G})"><rect x="-260" y="-420" width="260" height="300" rx="20" fill="url(#zOlive)" ${OUT}/><rect x="-230" y="-390" width="150" height="110" rx="10" fill="#1a2028" ${OUT}/>
      <rect x="-280" y="-130" width="1180" height="70" fill="#2e3322" ${OUT}/>${[-150, 180, 600, 760].map((x) => `<circle cx="${x}" cy="-50" r="62" fill="#141414" ${OUT}/><circle cx="${x}" cy="-50" r="26" fill="#5c6366"/>`).join("")}
      <rect x="20" y="-560" width="860" height="430" fill="#6a2a24" ${OUT}/>${Array.from({ length: 14 }, (_, k) => `<path d="M${50 + k * 60},-550V-140" stroke="#562019" stroke-width="10"/>`).join("")}

      <g id="${id}-cdoor"><rect x="880" y="-560" width="60" height="430" fill="#5a2018" ${OUT}/><path d="M900,-540V-150M920,-540V-150" stroke="#c9ccd0" stroke-width="6"/></g></g>`;

    put(L.glow, `<path d="M1500,-400L700,1500H1100Z" fill="url(#zCone)" opacity=".8"/><path d="M-400,-300L300,1500H600Z" fill="url(#zCone)" opacity=".5"/>`);

  // looping motion for these sets
  function zlife(tl, scope, t0, dur) {
    const root = document.querySelector(scope);
    if (!root || root.dataset.zlife) return;
    root.dataset.zlife = "1";
    const q = (c) => document.querySelectorAll(`${scope} ${c}`);
    q(".zdust").forEach((el, i) => tl.fromTo(el, { x: -6 - (i % 5) * 3, y: 8 }, { x: 10 + (i % 4) * 4, y: -22 - (i % 3) * 8, duration: 2.6 + (i % 7) * 0.35, repeat: Math.ceil(dur / 2.6) + 1, yoyo: true, ease: "sine.inOut", immediateRender: false }, Math.max(0, t0 - (i % 9) * 0.3)));
    q(".smoke").forEach((el, i) => tl.fromTo(el, { x: -10, opacity: 0.4 }, { x: 14, opacity: 0.6, duration: 2.4 + i * 0.4, repeat: Math.ceil(dur / 2.4), yoyo: true, ease: "sine.inOut", immediateRender: false }, t0));

    q(".zfire").forEach((el, i) => tl.fromTo(el, { opacity: 0.45 }, { opacity: 0.85, duration: 0.11 + (i % 3) * 0.04, repeat: Math.ceil(dur / 0.11), yoyo: true, ease: "none", immediateRender: false }, t0));
    q(".zred").forEach((el) => tl.fromTo(el, { opacity: 0.15 }, { opacity: 0.7, duration: 0.5, repeat: Math.ceil(dur / 0.5), yoyo: true, ease: "sine.inOut", immediateRender: false }, t0));
    const r = mk(Math.round(t0 * 100) + 7); // fluorescent tubes: mostly on, with seeded drop-outs
    for (let t = 0; t < dur; t += 0.06 + r() * 0.25) {
      const on = r() > 0.28 ? 1 : 0.15 + r() * 0.3;
      q(".zflick").forEach((el) => tl.set(el, { opacity: on }, t0 + t));
      q(".zflickg").forEach((el) => tl.set(el, { opacity: on * 0.35 }, t0 + t));
    }
    q(".spin").forEach((el) => tl.fromTo(el, { rotation: 0 }, { rotation: 360 * Math.ceil(dur), svgOrigin: "0 0", duration: dur, ease: "none", immediateRender: false }, t0));
  }

  Object.assign(Sets, { condo, peephole, armClose, bathroom, tower, liftCall, stairwell, stairShaft, stairFlight, doorJam, corridorRun, noiseMap, kitchen, gym, pressClose, doorClose, hallSide, fireDoor, smokeAlarm, street });
  if (window.Camp) Camp.hand.extinguisher = `<g transform="translate(0,${118 + 96}) rotate(180)">${EXT}</g>`; // held by the valve, swung like a club
  window.Zom = { zFace, zLunge, zlife, city, FLIGHT, beam, smokeLayer };
})();
</script><script>// Sets and props for "วันที่ 100": a rural primary school turned camp, a hundred days after the plague ("ห่าลง").
// The yard with its concrete fence, sliding iron gate, wooden classroom block, flagpole and the tall water tank;
// the classroom with the big green blackboard; the abandoned fresh market; the dirt road through the paddies;
// close-ups of a bulging can, the gate bolt, the tank gauge and the old radio; น้องปั้น's crayon drawing;
// a top-down map of the compound. Same layer contract as sets.js / zom.js (sky far mid set act fg + glow/light).
(function () {
  const INK = "#2e2a26";
  const OUT = `stroke="${INK}" stroke-width="4" stroke-linejoin="round"`;
  const mk = (seed) => () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const put = (el, html) => el.insertAdjacentHTML("beforeend", html);
  const f1 = (v) => v.toFixed(1);
  const G = 1500;

  Sets.DEFS += `
    <linearGradient id="fDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb6dc"/><stop offset=".7" stop-color="#d9e6ea"/><stop offset="1" stop-color="#f1e9d6"/></linearGradient>

    <linearGradient id="fMorn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d4e6"/><stop offset=".8" stop-color="#f6e7cf"/><stop offset="1" stop-color="#ffdca8"/></linearGradient>
    <linearGradient id="fPaddy" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fae5a"/><stop offset="1" stop-color="#6d8f3e"/></linearGradient>
    <linearGradient id="fPaddyD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a3e"/><stop offset="1" stop-color="#2f3328"/></linearGradient>
    <linearGradient id="fDirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8a06a"/><stop offset="1" stop-color="#a77f4e"/></linearGradient>
    <linearGradient id="fConc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d4c8"/><stop offset="1" stop-color="#b3ada0"/></linearGradient>
    <linearGradient id="fTin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9299"/><stop offset=".5" stop-color="#b9bec4"/><stop offset="1" stop-color="#7f858c"/></linearGradient>
    <linearGradient id="fBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f5a46"/><stop offset="1" stop-color="#1f3f31"/></linearGradient>
    <linearGradient id="fCan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d9299"/><stop offset=".35" stop-color="#e3e6e8"/><stop offset=".7" stop-color="#aeb3b8"/><stop offset="1" stop-color="#6f757b"/></linearGradient>
    <radialGradient id="fSun"><stop offset="0" stop-color="#fff2c0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd37a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb060" stop-opacity="0"/></radialGradient>
    <radialGradient id="fLamp"><stop offset="0" stop-color="#ffd58a" stop-opacity=".3"/><stop offset=".4" stop-color="#ffb35c" stop-opacity=".07"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0"/></radialGradient>
    <radialGradient id="fDial"><stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/><stop offset=".5" stop-color="#ff9a3c" stop-opacity=".3"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="fRing"><stop offset=".6" stop-color="#ff5a3a" stop-opacity="0"/><stop offset=".9" stop-color="#ff5a3a" stop-opacity=".5"/><stop offset="1" stop-color="#ff5a3a" stop-opacity="0"/></radialGradient>
    <pattern id="fPaper" width="60" height="60" patternUnits="userSpaceOnUse"><rect width="60" height="60" fill="#f3ecd9"/><path d="M0,59.5H60" stroke="#cdbfa3" stroke-width="1.5"/></pattern>
    <pattern id="fGrid" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#f7f1e2"/><path d="M0,47.5H48M47.5,0V48" stroke="#d8cbb2" stroke-width="1.4"/></pattern>
    <pattern id="fMesh" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M0,13L13,0L26,13L13,26Z" fill="none" stroke="#9aa0a6" stroke-width="2.2"/></pattern>
    <filter id="fChalk" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter>

  const SKY = { day: "fDay", noon: "fNoon", dusk: "fDusk", night: "fNight", morning: "fMorn" };
  const sky = (L, time) => put(L.sky, `<rect x="-1200" y="-800" width="3500" height="3600" fill="url(#${SKY[time] || "fDay"})"/>`);
  const sunMoon = (L, time, x = 820, y = 420) => {
    if (time === "night") put(L.sky, `<circle cx="${x}" cy="${y - 80}" r="150" fill="url(#moonhalo)"/><circle cx="${x}" cy="${y - 80}" r="46" fill="#e9eef5"/><circle cx="${x - 16}" cy="${y - 92}" r="9" fill="#cfd6e0"/><circle cx="${x + 14}" cy="${y - 66}" r="6" fill="#cfd6e0"/>`);

  // ---------------- far ground: rice paddies to the horizon, a treeline, low hills with the radio mast ----------------
  function paddies(r, time, y0, o = {}) {
    const night = time === "night", dusk = time === "dusk";
    let s = `<rect x="-1200" y="${y0 - 10}" width="3500" height="1400" fill="url(#${night ? "fPaddyD" : "fPaddy"})"/>`;
    s += `<path d="M-1200,${y0 + 30}Q-600,${y0 - 60} 0,${y0 + 10}T1200,${y0 - 20}T2400,${y0 + 20}V${y0 + 120}H-1200Z" fill="${night ? "#1b2238" : dusk ? "#5c4a63" : "#6f9a6a"}"/>`;

    s += `<path d="M-1200,${y0 - 40}L-700,${y0 - 160}L-300,${y0 - 90}L200,${y0 - 210}L700,${y0 - 120}L1150,${y0 - 240}L1600,${y0 - 110}L2300,${y0 - 170}V${y0 + 40}H-1200Z" fill="${night ? "#121a2c" : dusk ? "#4c3a5a" : "#7ea0b6"}" opacity=".9"/>`;

    // power poles along the road, wires sagging, one leaning
    for (let k = 0; k < 4; k++) { const x = -600 + k * 700 + (k === 2 ? 60 : 0); s += `<g transform="translate(${x},${y0 + 20}) rotate(${k === 2 ? -7 : 0})"><path d="M0,0V-260M-40,-230H40M-30,-200H30" stroke="${night ? "#2a3040" : "#6b5a44"}" stroke-width="7"/></g>`; }
    s += `<path d="M-640,${y0 - 210}Q-290,${y0 - 150} 60,${y0 - 210}T760,${y0 - 210}T1460,${y0 - 210}" stroke="${night ? "#283040" : "#5a4a34"}" stroke-width="2.5" fill="none"/>`;

  // ---------------- the school yard (seen from inside): fence across the back with the sliding gate, classroom block left, water tank right ----------------

    s += `<rect x="400" y="${FY - 8}" width="540" height="12" fill="#3a3f45"/>`;
    // classroom block (left, behind a gravel apron): raised wooden building, tin roof, long veranda, shuttered windows
    s += `<g transform="translate(-620,${FY - 20})">
      <path d="M-40,0V-520H900V0Z" fill="#c9a06c" ${OUT}/>${Array.from({ length: 12 }, (_, k) => `<path d="M${30 + k * 72},-500V-30" stroke="#a5804f" stroke-width="3"/>`).join("")}

      <rect x="-40" y="-120" width="940" height="26" fill="#8a6a42" ${OUT}/>${[0, 180, 360, 540, 720].map((x) => `<rect x="${x + 20}" y="-96" width="18" height="96" fill="#7a5a3e"/>`).join("")}
      ${[60, 300, 540].map((x) => `<rect x="${x}" y="-440" width="150" height="190" fill="#1d2a2c" ${OUT}/><rect x="${x - 16}" y="-440" width="22" height="190" fill="#6f8f58" ${OUT}/><rect x="${x + 144}" y="-440" width="22" height="190" fill="#6f8f58" ${OUT}/>${Array.from({ length: 5 }, (_, j) => `<path d="M${x},-${420 - j * 40}H${x + 150}" stroke="#2f3d3f" stroke-width="3"/>`).join("")}`).join("")}
      <rect x="760" y="-440" width="110" height="320" fill="#4a3a2a" ${OUT}/><circle cx="848" cy="-280" r="7" fill="#c9b48a"/>
      <rect x="280" y="-600" width="320" height="56" rx="8" fill="#1f3f31" ${OUT}/><text x="440" y="-560" text-anchor="middle" font-family="Kanit" font-weight="700" font-size="30" fill="#f4ecd8">โรงเรียนบ้านหนองน้ำใส</text>

    g += `<ellipse cx="500" cy="${FY + 400}" rx="220" ry="40" fill="#8f6f45" opacity=".35"/><ellipse cx="1500" cy="${FY + 600}" rx="300" ry="50" fill="#8f6f45" opacity=".35"/>`;

  // ---------------- the classroom: green blackboard on the back wall, teacher's desk, little desks, shutters with light ----------------
  // ids: #id-board (chalk area 160..920 × 330..880), #id-desk, #id-cans (12 cans, #id-bulge = the swollen one), #id-radio, #id-lamp
  function classroom(L, o = {}) {
    const id = o.id || "cr", night = !!o.night, r = mk(o.seed || 17);
    put(L.sky, `<rect x="-1200" y="-800" width="3500" height="3600" fill="#1a1d1c"/>`);
    let s = `<rect x="-1200" y="-800" width="3500" height="${G + 800}" fill="${night ? "#5a5248" : "#e8dcc6"}"/><rect x="-1200" y="${G - 40}" width="3500" height="40" fill="#8a7a62"/>`;
    s += `<rect x="-1200" y="${G}" width="3500" height="1300" fill="#b98f62"/>${Array.from({ length: 24 }, (_, k) => `<path d="M${-1200 + k * 150},${G}V2800" stroke="#a37c52" stroke-width="4"/>`).join("")}`;
    // the blackboard with its chalk tray; faded old lessons in the corner
    s += `<rect x="130" y="300" width="820" height="610" rx="10" fill="#7a5a3e" ${OUT}/><rect x="160" y="330" width="760" height="550" fill="url(#fBoard)"/><rect x="130" y="910" width="820" height="26" fill="#5f442d" ${OUT}/>

    s += `<rect x="-220" y="360" width="260" height="360" fill="#f4ecd8" ${OUT}/>${["ก ไก่", "ข ไข่", "ค ควาย", "ง งู"].map((t, k) => `<text x="-90" y="${430 + k * 80}" text-anchor="middle" font-family="Kanit" font-weight="700" font-size="44" fill="${["#c8392b", "#2f4a8a", "#1f3f31", "#b07f2c"][k]}">${t}</text>`).join("")}
      <g transform="translate(1080,400)"><circle r="70" fill="#f4ecd8" ${OUT}/><circle r="60" fill="none" stroke="#2e2a26" stroke-width="2"/><path d="M0,0L0,-44M0,0L28,22" stroke="${INK}" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="${INK}"/></g>

      <circle cx="-72" cy="-32" r="18" fill="#c9a55a" ${OUT}/><circle cx="-20" cy="-32" r="18" fill="#c9a55a" ${OUT}/><path d="M100,-150L190,-330" stroke="#9aa0a6" stroke-width="6"/></g>`;
    // window with wooden shutters on the left wall, slats of light

    else { put(L.glow, [0, 1, 2, 3].map((k) => `<path d="M${-620 + k * 80},${340}l40,0L${-300 + k * 70},${G + 60}l-70,0Z" fill="url(#zRay)" opacity=".6"/>`).join("")); }
  }
  // chalk strokes on the board (set id of the classroom): text lines with a chalk filter, each wrapped for clip reveals
  function chalk(id, lines) {

    el.insertAdjacentHTML("beforeend", lines.map((ln, k) => `<g class="chalk" id="${id}-ch${k}" opacity="${ln.hide ? 0 : 1}"><text x="${ln.x}" y="${ln.y}" text-anchor="${ln.anchor || "start"}" font-family="Kanit" font-weight="${ln.w || 700}" font-size="${ln.size || 50}" fill="${ln.color || "#f4ecd8"}" opacity=".92" filter="url(#fChalk)" style="letter-spacing:2px">${ln.text}</text></g>`).join(""));

  // ---------------- the abandoned fresh market: tin roof with holes, concrete stalls, metal shelves with the last cans, a vendor standing still in the gap ----------------
  // ids: #id-gap (where ha3 stands, x≈300), #id-cans (the cans on the near shelf), #id-fall (a can that drops)
  function market(L, o = {}) {
    const id = o.id || "mk", r = mk(o.seed || 53);
    sky(L, o.time || "day");
    put(L.far, paddies(r, o.time || "day", 980));
    // back: roof underside with holes, a long back wall of shuttered shophouses, hanging tarps
    let s = `<path d="M-1200,-800H2300V560H-1200Z" fill="#4a4f55"/>${Array.from({ length: 20 }, (_, k) => `<path d="M${-1200 + k * 180},-800V560" stroke="#3a3f45" stroke-width="6"/>`).join("")}`;
    s += `<path d="M-1200,560H2300V700H-1200Z" fill="#8d9299" ${OUT}/>`;
    s += `${[[-600, 90], [100, 140], [900, 70], [1500, 120]].map(([x, w]) => `<ellipse cx="${x}" cy="200" rx="${w}" ry="${w * 0.4}" fill="#f6ecd2"/>`).join("")}`;
    s += `<rect x="-1200" y="700" width="3500" height="${G - 700}" fill="#c8c0ae"/>${Array.from({ length: 12 }, (_, k) => `<rect x="${-1150 + k * 300}" y="760" width="220" height="${G - 760}" fill="#9aa0a6" ${OUT}/>${Array.from({ length: 9 }, (_, j) => `<path d="M${-1150 + k * 300},${790 + j * 60}h220" stroke="#7f858c" stroke-width="5"/>`).join("")}`).join("")}`;

    let t = `<rect x="-1200" y="${G - 60}" width="3500" height="1400" fill="#8f8a7c"/><path d="M-1200,${G + 300}H2300" stroke="#6f6a5e" stroke-width="6"/><ellipse cx="900" cy="${G + 240}" rx="260" ry="40" fill="#5f6a70" opacity=".6"/>`;

    t += `<g transform="translate(-560,${G})"><rect x="0" y="-620" width="420" height="620" fill="none" stroke="#5b6066" stroke-width="16"/>${[-520, -400, -280, -160].map((y) => `<rect x="0" y="${y}" width="420" height="14" fill="#5b6066"/>`).join("")}
      ${[[40, -530, "#c8392b"], [110, -530, "#2f6fb8"], [320, -410, "#e8b830"], [60, -290, "#4f8a55"], [240, -290, "#c8392b"], [300, -170, "#2f6fb8"]].map(([x, y, c]) => `<g><rect x="${x}" y="${y}" width="44" height="60" rx="5" fill="url(#fCan)" ${OUT}/><rect x="${x}" y="${y + 18}" width="44" height="26" fill="${c}" opacity=".85"/></g>`).join("")}</g>`;
    t += `<rect id="${id}-gap" x="-120" y="${G - 640}" width="240" height="640" fill="#2a2724"/>`;
    t += `<g transform="translate(240,${G})"><rect x="0" y="-620" width="420" height="620" fill="none" stroke="#5b6066" stroke-width="16"/>${[-520, -400, -280, -160].map((y) => `<rect x="0" y="${y}" width="420" height="14" fill="#5b6066"/>`).join("")}
      <g id="${id}-cans">${[[30, -290, "#c8392b"], [84, -290, "#e8b830"], [138, -290, "#2f6fb8"], [192, -290, "#4f8a55"], [246, -290, "#c8392b"], [300, -290, "#e8b830"], [40, -170, "#2f6fb8"], [100, -170, "#c8392b"], [160, -170, "#4f8a55"], [220, -170, "#e8b830"], [290, -170, "#2f6fb8"], [350, -170, "#c8392b"]].map(([x, y, c], k) => `<g id="${id}-sc${k}" transform="translate(${x},${y})"><rect x="0" y="0" width="44" height="60" rx="5" fill="url(#fCan)" ${OUT}/><rect x="0" y="18" width="44" height="26" fill="${c}" opacity=".85"/>${k === 8 ? `<path d="M0,0q22,-18 44,0" fill="#cfd3d6" ${OUT}/>` : ""}</g>`).join("")}</g></g>`;
    t += `<g id="${id}-fall" transform="translate(470,${G - 310})"><rect x="0" y="0" width="44" height="60" rx="5" fill="url(#fCan)" ${OUT}/><rect x="0" y="18" width="44" height="26" fill="#e8b830" opacity=".85"/></g>`;

    put(L.glow, Array.from({ length: 30 }, () => `<circle class="zdust" cx="${f1(-900 + r() * 2800)}" cy="${f1(300 + r() * 1100)}" r="${f1(1.6 + r() * 3)}" fill="#fff2dc" opacity="${f1(0.3 + r() * 0.4)}"/>`).join(""));

  // ---------------- close-up: two hands holding a can whose lid has domed (#id-lid); optional child's hand from below (#id-kid) ----------------
  function canClose(L, o = {}) {
    const id = o.id || "cc", t = o.time || "dusk";
    sky(L, t);
    put(L.far, `<rect x="-1200" y="900" width="3500" height="1600" fill="${t === "night" ? "#3a3026" : "#8a6a42"}"/><rect x="-1200" y="880" width="3500" height="40" fill="${t === "night" ? "#4a3e30" : "#a07a4a"}"/>`);
    if (t === "night") put(L.glow, `<circle cx="300" cy="700" r="600" fill="url(#fLamp)" opacity=".7"/>`);
    // the can: big, centred, label torn, rust at the seam, the lid domed up (bulge = o.bulge 0..1)
    const b = o.bulge ?? 1;
    put(L.set, `<g id="${id}-can" transform="translate(540,1180)"><rect x="-230" y="-300" width="460" height="560" rx="30" fill="url(#fCan)" ${OUT}/>
      <rect x="-230" y="-140" width="460" height="260" fill="#c8392b" opacity=".9"/><rect x="-230" y="-140" width="460" height="40" fill="#f2c55c"/><text x="0" y="40" text-anchor="middle" font-family="Kanit" font-weight="900" font-size="88" fill="#fff4ea" stroke="${INK}" stroke-width="6" paint-order="stroke">อาหารกระป๋อง</text>
      <path d="M-230,-140l40,80l-40,60Z" fill="#b3ada0"/><path d="M-120,-300v20M60,-300v20" stroke="#8a4a1a" stroke-width="8"/>${[[-200, -200], [180, -60], [-170, 160]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="14" fill="#8a4a1a" opacity=".7"/>`).join("")}
      <ellipse cx="0" cy="260" rx="230" ry="40" fill="#8d9299" ${OUT}/>
      <g id="${id}-lid"><path d="M-230,-300q0,-40 40,-40h380q40,0 40,40q-230,${-150 * b} -460,0z" fill="#dfe3e6" ${OUT}/><path d="M-190,-340q190,${-110 * b} 380,0" stroke="#a9b0b6" stroke-width="3" fill="none"/><path d="M-150,-350q150,${-60 * b} 300,-10" stroke="#fff" stroke-width="5" fill="none" opacity=".5"/><path d="M-60,-370l20,-20M20,-380l24,-22" stroke="#8a4a1a" stroke-width="4"/></g></g>`);
    // our hands on the can (POV): real grips, fingers wrapping over the label, thumbs hooked at the rim, forearms into the bottom corners (Hand.grip)
    const HC = { skin: o.skin || "#ecc29c", skinS: o.skinS, sleeve: o.sleeve || "#9fc5d8", sleeveS: o.sleeveS };
    put(L.fg, `<g id="${id}-hl" transform="translate(310,1200)">${Hand.grip(HC)}</g><g id="${id}-hr" transform="translate(770,1200) scale(-1,1)">${Hand.grip(HC)}</g>`);
    L.fg.classList.remove("fgblur");
    if (o.kid) put(L.act, `<g id="${id}-kid" transform="translate(-300,1500)"><g transform="scale(0.62)">${Hand.open({ skin: "#efc6a0", sleeve: "#f6f6f2", sleeveS: "#d8d4c8" })}</g></g>`);
  }

  // ---------------- the dirt road through the paddies (actors walk on y=G): heat shimmer at noon (#id-shim), the sun low at dusk ----------------
  function fieldRoad(L, o = {}) {
    const id = o.id || "fr", t = o.time || "noon", r = mk(o.seed || 29);
    sky(L, t); sunMoon(L, t, o.sunX ?? 640, 500);
    put(L.far, paddies(r, t, 1020));
    // the road converging to the horizon, with ruts; paddies either side with stubble and a buffalo wallow
    let s = `<path d="M-200,${G + 900}L430,1030H650L1280,${G + 900}Z" fill="url(#fDirt)" ${OUT}/><path d="M80,${G + 900}L500,1040M1000,${G + 900}L580,1040" stroke="#8f6f45" stroke-width="10" fill="none" opacity=".6"/>`;
    s += `<rect x="-1200" y="1030" width="3500" height="60" fill="${t === "night" ? "#2a3024" : t === "dusk" ? "#5c5a3a" : "#7d9a4a"}"/>`;
    s += `<path d="M-1200,1090H420L-200,${G + 900}H-1200Z M1300,${G + 900}L660,1090H2300V${G + 900}Z" fill="${t === "night" ? "#1f261b" : t === "dusk" ? "#6b5a38" : "#9fb860"}"/>`;
    for (let k = 0; k < 60; k++) { const u = r(), x = u < 0.5 ? -1100 + r() * 1300 : 900 + r() * 1300, y = 1120 + r() * 900; s += `<path d="M${f1(x)},${f1(y)}q5,-22 10,0q5,-18 10,0" stroke="${t === "night" ? "#2f3828" : "#6f8f3e"}" stroke-width="3" fill="none"/>`; }
    s += `<path d="M-1200,${G + 300}h1000M1300,${G + 500}h1100" stroke="${t === "night" ? "#2a3024" : "#5d7a35"}" stroke-width="6" opacity=".5"/>`;
    s += `<g transform="translate(-700,1180)"><ellipse rx="140" ry="40" fill="#6f6a4a" opacity=".6"/><path d="M-60,-10q20,-50 60,-50t60,50" fill="#3a3330" ${OUT}/><path d="M-20,-60q-20,-30 -40,-20M20,-60q20,-30 40,-20" stroke="${INK}" stroke-width="6" fill="none"/></g>`;
    put(L.set, s);
    if (t === "noon") put(L.glow, `<g id="${id}-shim">${Array.from({ length: 14 }, (_, k) => `<path d="M-1200,${1050 + k * 22}q200,8 400,0t400,0t400,0t400,0t400,0t400,0t400,0t400,0" stroke="#fff6dc" stroke-width="3" fill="none" opacity=".18"/>`).join("")}</g><rect x="-1200" y="980" width="3500" height="300" fill="url(#zHaze)" opacity=".9"/>`);
    if (t === "dusk") put(L.glow, `<rect x="-1200" y="900" width="3500" height="1300" fill="#ff9a3c" opacity=".12"/>`);
  }

  // ---------------- close-up of the gate from inside: bars, the cross rail, the bolt (#id-bolt slides x), arms through the bars (#id-arms) ----------------
  function gateClose(L, o = {}) {
    const id = o.id || "gc", t = o.time || "dusk", r = mk(o.seed || 61);
    sky(L, t); sunMoon(L, t, 300, 600);
    put(L.far, paddies(r, t, 1100));
    put(L.mid, `<path d="M-1200,1180L2300,1180V${G + 900}H-1200Z" fill="url(#fDirt)"/>`);
    // outside: the road up to the gate, dusk haze
    let s = `<g id="${id}-arms" opacity="${o.arms ? 1 : 0}">${[[260, 1120, -10], [520, 1060, 8], [760, 1140, -4]].map(([x, y, a]) => `<g transform="translate(${x},${y}) rotate(${a})"><path d="M0,0C-10,80 -6,160 0,240" stroke="${INK}" stroke-width="54" stroke-linecap="round" fill="none"/><path d="M0,0C-10,80 -6,160 0,240" stroke="#9dac92" stroke-width="44" stroke-linecap="round" fill="none"/><path d="M-30,250l-10,36M-8,256l-2,40M14,254l6,38M30,246l16,30" stroke="#9dac92" stroke-width="14" stroke-linecap="round"/><path d="M-40,286l-6,14M-10,296l0,14M20,292l4,14M46,276l8,12" stroke="#1b1612" stroke-width="7" stroke-linecap="round"/><circle cx="4" cy="60" r="12" fill="#7a1414" opacity=".8"/></g>`).join("")}</g>`;
    put(L.set, s);
    // the gate itself: thick bars, two rails, the bolt on our side
    let g = `<rect x="-1200" y="${G + 40}" width="3500" height="40" fill="#3a3f45"/><g id="${id}-bars">`;
    for (let b = -10; b < 12; b++) g += `<rect x="${-80 + b * 110}" y="-200" width="34" height="${G + 260}" fill="#3f454b" ${OUT}/>`;
    g += `<rect x="-1300" y="560" width="2580" height="60" fill="#3a3f45" ${OUT}/><rect x="-1300" y="1360" width="2580" height="60" fill="#3a3f45" ${OUT}/>`;
    g += `<rect x="-1300" y="-240" width="2580" height="60" fill="#3a3f45" ${OUT}/>`;
    g += `<g id="${id}-bolt" transform="translate(${o.bolt ?? 0},0)"><rect x="620" y="1180" width="560" height="60" rx="20" fill="#8d9299" ${OUT}/><rect x="560" y="1150" width="110" height="120" rx="14" fill="#5b6066" ${OUT}/><rect x="1150" y="1160" width="40" height="100" rx="8" fill="#5b6066" ${OUT}/></g>`;
    g += `</g><rect x="1180" y="-240" width="80" height="${G + 320}" fill="#5b6066" ${OUT}/><rect x="1260" y="-300" width="80" height="${G + 400}" fill="#cfc9bb" ${OUT}/><rect x="1160" y="1130" width="200" height="160" rx="10" fill="none" stroke="#5b6066" stroke-width="14"/>`;
    // beyond the gate pillar the fence goes on: rails and bars up close, another concrete post (so a drifting camera never finds open ground)
    g += `<rect x="1340" y="560" width="1100" height="60" fill="#3a3f45" ${OUT}/><rect x="1340" y="1360" width="1100" height="60" fill="#3a3f45" ${OUT}/>${Array.from({ length: 10 }, (_, b) => `<rect x="${1390 + b * 110}" y="420" width="34" height="${G - 300}" fill="#3f454b" ${OUT}/>`).join("")}<rect x="1900" y="300" width="110" height="${G - 120}" fill="#cfc9bb" ${OUT}/>`;
    put(L.fg, g);
    L.fg.classList.remove("fgblur");
    if (t === "dusk") put(L.glow, `<rect x="-1200" y="800" width="3500" height="1400" fill="#ff9a3c" opacity=".12"/>`);
  }

  // ---------------- morning close-up of the tank's gauge: a clear tube with marks, the float (#id-float) one notch lower; เจ๊หงส์'s finger (#id-finger) ----------------
  function tankClose(L, o = {}) {
    const id = o.id || "tk";

    put(L.mid, `<rect x="700" y="-800" width="90" height="3600" fill="#8a857a" ${OUT}/>${Array.from({ length: 10 }, (_, k) => `<path d="M640,${-700 + k * 300}h210" stroke="#8a857a" stroke-width="26"/>`).join("")}`);
    let s = `<rect x="300" y="200" width="150" height="1500" rx="60" fill="#e8f1f5" ${OUT}/>${Array.from({ length: 10 }, (_, k) => `<path d="M300,${320 + k * 140}h-70" stroke="${INK}" stroke-width="8"/><text x="200" y="${338 + k * 140}" text-anchor="end" font-family="Kanit" font-weight="700" font-size="52" fill="${INK}">${10 - k}</text>`).join("")}`;
    s += `<rect id="${id}-water" x="312" y="${320 + 140 * (10 - (o.level ?? 7))}" width="126" height="${1380 - 140 * (10 - (o.level ?? 7))}" rx="50" fill="#6fb3d6" opacity=".85"/>`;
    s += `<g id="${id}-float" transform="translate(375,${320 + 140 * (10 - (o.level ?? 7))})"><rect x="-56" y="-30" width="112" height="60" rx="16" fill="#c8392b" ${OUT}/><path d="M-70,0h140" stroke="#c8392b" stroke-width="8"/></g>`;
    s += `<path d="M375,1700v120h300" stroke="#8a857a" stroke-width="18" fill="none"/>${[[380, 1740], [400, 1790]].map(([x, y]) => `<path d="M${x},${y}c8,14 10,22 2,26c-8,-4 -8,-12 -2,-26z" fill="#6fb3d6"/>`).join("")}`;
    // a pencil mark from last night at the old level, now one notch above the float
    s += `<g id="${id}-mark"><path d="M240,${330 + 140 * (10 - (o.level ?? 7) - 1)}h130" stroke="#c8392b" stroke-width="6" stroke-dasharray="14 8"/><text x="470" y="${346 + 140 * (10 - (o.level ?? 7) - 1)}" font-family="Kanit" font-weight="700" font-size="40" fill="#c8392b">เมื่อคืน</text></g>`;
    put(L.set, s);
    put(L.fg, `<g id="${id}-finger" transform="translate(900,1500)"><g transform="scale(0.8)">${Hand.point({ skin: "#e6b48c", skinS: "#c48a62", sleeve: "#d96a8a", sleeveS: "#b04f6e" })}</g></g>`);
    L.fg.classList.remove("fgblur");
    put(L.glow, `<path d="M-300,-200L-100,-200L600,1900L300,1900Z" fill="url(#zRay)" opacity=".7"/>`);
  }

      <circle cx="-260" cy="-110" r="56" fill="#c9a55a" ${OUT}/><circle cx="-100" cy="-110" r="56" fill="#c9a55a" ${OUT}/><path d="M-260,-150v30M-100,-150v30" stroke="${INK}" stroke-width="6"/><text x="-180" y="-30" text-anchor="middle" font-family="Kanit" font-weight="700" font-size="30" fill="#e9d9a8" opacity=".7">THANARAT · 1979</text>
