<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/rig.js"></script>
    <script src="assets/sets.js"></script>
    <script src="assets/camp.js"></script>
    <script src="assets/ui.js"></script>
    <script src="assets/gameui.js"></script>
    <script src="assets/fx.js"></script>
    <script src="assets/engine.js"></script>
    <style>
      @font-face { font-family: 'Kanit'; font-weight: 400; src: url(assets/fonts/f1.ttf); }
      @font-face { font-family: 'Kanit'; font-weight: 700; src: url(assets/fonts/f2.ttf); }
      @font-face { font-family: 'Kanit'; font-weight: 900; src: url(assets/fonts/f3.ttf); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #05080a; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Kanit, sans-serif; }
      .clip { position: absolute; inset: 0; overflow: hidden; }
      .stage { position: absolute; inset: 0; }
      .fgblur { filter: blur(6px); }
      .sfxw { position: absolute; font-family: Kanit; font-weight: 900; letter-spacing: -1px; opacity: 0;
        text-shadow: -4px -4px 0 #2e2a26, 4px -4px 0 #2e2a26, -4px 4px 0 #2e2a26, 4px 4px 0 #2e2a26, 8px 8px 0 #2e2a26; }
      .badge { z-index: 56; position: absolute; left: 36px; bottom: 210px; font: 700 26px/1 Kanit; color: #f4ecd8; opacity: .8; letter-spacing: 2px;
        background: rgba(5,8,10,.55); padding: 8px 14px 10px; border-radius: 10px; }
      #vig { z-index: 55; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 78% 62% at 50% 48%, transparent 52%, rgba(3,6,8,.78) 100%); }
      #grain { z-index: 57; position: absolute; inset: -60px; opacity: .1; mix-blend-mode: overlay; pointer-events: none; }
      #flashw { z-index: 60; position: absolute; inset: 0; background: #e8f0ff; opacity: 0; pointer-events: none; }
      #black { z-index: 61; position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
      /*__UICSS__*/
      /*__GAMECSS__*/
      .capwrap { z-index: 56; top: 1555px; }
      .capbox { background: rgba(15,21,24,.88); color: #f4ecd8; border: 2px solid rgba(244,236,216,.42); border-radius: 22px;
        box-shadow: 0 0 0 4px rgba(10,14,16,.5), 0 12px 26px rgba(0,0,0,.5); font: 900 52px/1.25 Kanit; padding: 12px 30px 16px; }
      .capbox .k { background: #f2c55c; color: #2e2a26; border: 0; border-radius: 10px; padding: 0 .16em; }
      .bubble { z-index: 57; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="/*__TOTAL__*/" data-width="1080" data-height="1920">
      <svg id="grain" width="1200" height="2040"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="5" /></filter><rect width="1200" height="2040" filter="url(#nz)" /></svg>
    </div>
    <script>
      const SCHED = /*__SCHEDULE__*/;
      const SH = Object.fromEntries(SCHED.shots.map((s) => [s.key, s]));
      const vo = (k, i = 0) => SH[k].vo[i].t;            // voice start, relative to shot
      const voEnd = (k, i = 0) => SH[k].vo[i].t + SH[k].vo[i].dur;
      const D = (k) => SH[k].dur;
      const root = document.getElementById("root");
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      Rig.MODES.crouchShush = (u, o) => ({ ...Rig.MODES.crouch(u, o), uaF: -100, faF: -150, torso: 14, head: -6 });
      Rig.MODES.sitHurt = (u, o) => ({ ...Rig.MODES.sit(u, o), uaF: 20, faF: -20, uaB: 30, faB: -10, torso: -8 + 1.5 * Math.sin(u * 7), head: -10 });
      Rig.MODES.sitPhone = (u, o) => ({ ...Rig.MODES.sitChair(u, o), uaF: -52 + Math.sin(u * 1.1), faF: -92, head: 12 });
      Rig.MODES.sneak = (u, o) => { const g = Rig.MODES.walk(u, { period: 1.6, stride: 8, knee: 30, bob: 4, arm: 6, lean: 16 }); return { ...g, thF: g.thF - 38, thB: g.thB - 34, shF: g.shF + 60, shB: g.shB + 56, bodyY: g.bodyY + 82, torso: g.torso + 10, uaF: -55, faF: -45, uaB: -35, faB: -35, head: -14 }; };
      Rig.MODES.torchLow = (u, o) => ({ ...Rig.MODES.torch(u, o), uaF: -40 + 3 * Math.sin(u * 1.1), faF: -10 });

      const cap = (k, text, t, end) => ({ text, t: t ?? vo(k), end });
      const walkV = (s) => Rig.footSpeed(0.96, 16) * s;
      const runV = (s) => Rig.footSpeed(0.56, 30) * s;
      const shots = [];
      const add = (k, spec) => shots.push({ start: SH[k].start, dur: SH[k].dur, key: k, ...spec });
      const flick = (id, t0, k) => Camp.flicker(tl, `#${id}`, t0, D(k));
      const hand = (t) => ({ x: 9 * Math.sin(t * 2.3) + 4 * Math.sin(t * 7.1), y: 7 * Math.sin(t * 1.7 + 1) + 3 * Math.sin(t * 6.3) });
      const CAMP_DUSK = { time: "dusk" }, CAMP_NIGHT = { time: "night" };
      const PIN_ARM = { sleeve: "#e8b98f", skin: "#e8b98f", cuff: "#4f8f86" }, KLA_ARM = { sleeve: "#9c4a3c", skin: "#d6a27c", cuff: "#6a2e25" };

      // ---------- 1. Kla's eyes at the door: trust the voice behind ----------
      const PICK = voEnd("open") + 0.15;
      const G1 = (id) => Fx.pov(id, { ...KLA_ARM, shake: (t) => ({ x: hand(t).x * (t > PICK ? 3 : 1.2), y: hand(t).y }), flicker: [[0.9, 0.4]], keys: [{ t: 0, x: 560, y: 900, r: 280 }, { t: PICK, x: 540, y: 920, r: 280 }, { t: PICK + 0.45, x: -260, y: 1100, r: 240 }, { t: 6, x: -300, y: 1100, r: 240 }] });
      add("open", {
        set: "hutFront", dark: 0.35,
        cam: { from: { x: 0, y: 330, s: 1.55 }, to: { x: -60, y: 330, s: 1.6 } }, shake: (t) => hand(t).x * (t > PICK ? 2.5 : 0.8),
        captions: [cap("open", "ถ้าวันหนึ่ง… คุณไม่รู้ว่า[เสียงไหน]คือคนจริง", vo("open"), PICK)],
        sfxText: [{ text: "ซ่า… กล้า…", x: 560, y: 760, t: 0.2, end: PICK - 0.2, size: 50, color: "#b9a8e8", rot: -4 }],
        ui: [
          { type: "pov", t: 0.05, name: "กล้า", bpm: [168, 184], top: 150, x: 36 },
          { type: "choice", t: 0.1, end: PICK + 1.2, q: "เชื่อเสียงไหน?", a: "เปิดประตู", b: "เชื่อเสียงข้างหลัง", secs: 3, pickAt: PICK, pick: "b", who: "กล้าเลือก… เชื่อเสียงข้างหลัง", top: 330 },
        ],
        extra(L, id) { this._pov = G1(id); L.light.insertAdjacentHTML("beforeend", this._pov.markup); },
        fx(tl, id, t0) {
          this._pov.drive(tl, t0, D("open"));
          Fx.glitch(tl, `#${id}`, t0 + 0.2, 0.4, 10, 81); Fx.heart(tl, t0, D("open"), 0.4, 0.75); Fx.tunnel(tl, t0, t0 + PICK, 0.7);
          Fx.punch(tl, `#${id} .stage`, t0 + PICK, 1.1, 0.4); Fx.speed(tl, t0 + PICK, t0 + PICK + 0.6);
          tl.set("#black", { opacity: 1 }, t0 + D("open") - 0.12); tl.set("#black", { opacity: 0 }, t0 + D("open"));
        },
      });

      // ---------- 2. the real ranger, with the key ----------
      add("chai", {
        set: "hutFront", dark: 0.35,
        cam: { from: { x: 0, y: 200, s: 1.15 }, to: { x: -40, y: 220, s: 1.22 } },
        actors: [
          { who: "chai", x: -260, y: 1730, s: 0.92, track: [{ t: 0, mode: "run", torch: true, eyes: "wide" }, { t: 1.0, mode: "point", blend: 0.25, eyes: "wide", mouth: "o" }, { t: 3.2, mode: "torch", torch: true, blend: 0.4, mouth: "flat" }],
            moveTo: { x: 280, dur: 1.0, ease: "power2.out" } },
          { who: "kla", x: 700, y: 1720, s: 0.9, flip: true, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o", sweat: true }, { t: 2.5, mode: "idle", blend: 0.5, eyes: "wide", mouth: "flat" }] },
          { who: "pin", x: 880, y: 1730, s: 0.88, flip: true, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o" }, { t: 2.8, mode: "idle", blend: 0.5, eyes: "pain", mouth: "flat" }] },
        ],
        bubbles: [{ text: "“ถอยออกมา! [ในนั้นไม่มีใคร]”", x: 60, y: 820, t: vo("chai"), end: voEnd("chai") + 0.3, tail: 220 }],
        ui: [{ type: "memo", t: voEnd("chai") - 0.6, who: "chai", text: "ลุงชัย[ตัวจริง] · มีกุญแจป้อม", top: 160 }],
        fx(tl, id, t0) { Fx.punch(tl, `#${id} .stage`, t0 + 1.0, 1.06, 0.5); Fx.heart(tl, t0, 2.5, 0.45, 0.5); },
      });

      // ---------- 3. inside: the radio, 1669 ----------
      add("inside", {
        set: "hut", dark: 0.12,
        cam: { from: { x: 20, y: 200, s: 1.1 }, to: { x: 40, y: 210, s: 1.16 } },
        actors: [
          { who: "chai", x: 470, y: 1520, s: 0.95, flip: true, prop: "mic", track: [{ t: 0, mode: "phoneEar", mouth: "o", eyes: "wide" }] },
          { who: "pin", x: 640, y: 1540, s: 0.85, track: [{ t: 0, mode: "sitHurt", eyes: "pain", mouth: "frown" }] },
          { who: "kla", x: 900, y: 1530, s: 0.9, flip: true, track: [{ t: 0, mode: "idle", mouth: "flat", sweat: true }] },
        ],
        bubbles: [{ text: "“ศูนย์ ศูนย์… [ขอรถฉุกเฉินด่วน]!”", x: 70, y: 700, t: vo("inside"), end: D("inside") - 0.1, tail: 340 }],
        ui: [{ type: "tip", t: 0.5, ill: "sos", tone: "danger", label: "เจ็บป่วยฉุกเฉิน", text: "โทร [1669]", top: 160 }],
        fx(tl, id, t0) { flick(id, t0, "inside"); },
      });

      // ---------- 4. zoom out: the road is cut, help waits for morning, the eyes prowl round the post ----------
      const PT = { camp: [250, 1660], lost: [430, 1330], you: [540, 770], post: [540, 760], zone: [300, 1010], thing: [700, 760] };
      add("map", {
        set: "forestMap", setOpts: { road: true, points: PT, seed: 57 }, dark: 0.0,
        cam: { from: { x: 0, y: -200, s: 2.8 }, to: { x: 0, y: 0, s: 1.0 }, dur: 2.4 },
        captions: [cap("map", "ถนนขาด… รถเข้ามาได้[ตอนเช้า]")],
        ui: [{ type: "clock", t: 3.2, from: "23:40", to: "05:30", sweep: 2.2, label: "ต้องรอถึงเช้า", top: 150 }],
        extra(L) { L.set.insertAdjacentHTML("beforeend", `<style>.mroute,.mdist{display:none}</style>`); },
        fx(tl, id, t0) {
          tl.set("#flashw", { opacity: 0.6 }, t0); tl.to("#flashw", { opacity: 0, duration: 0.4 }, t0 + 0.01);
          Camp.animMap(tl, `#${id}`, t0, D("map"), { drawAt: 99, circle: PT.post });
          tl.fromTo(`#${id} .mcut`, { scale: 1 }, { scale: 1.3, transformOrigin: "50% 50%", duration: 0.4, repeat: 15, yoyo: true, immediateRender: false }, t0 + 2.4);
        },
      });

      // ---------- 5. 1 a.m.: signal; a message from 15:12 ----------
      const MSG = vo("signal", 1) - 2.2;
      add("signal", {
        set: "hut", dark: 0.22,
        cam: { from: { x: 20, y: -110, s: 1.4 }, to: { x: 30, y: -100, s: 1.56 } },
        actors: [{ who: "kla", x: 540, y: 1560, s: 1.25, prop: "phone", track: [{ t: 0, mode: "phoneLook", mouth: "flat" }, { t: MSG + 1.2, mode: "phoneLook", eyes: "wide", mouth: "o", sweat: true, blend: 0.2 }] }],
        captions: [cap("signal", "ตีหนึ่ง… [มีสัญญาณ]", vo("signal"), MSG - 0.1)],
        bubbles: [{ text: "“พี่โจ้… [ไม่ได้ขึ้นมาตั้งแต่บ่าย]”", x: 160, y: 1180, t: vo("signal", 1), end: D("signal") - 0.1, tail: 300 }],
        ui: [
          { type: "clock", t: 0.2, end: MSG - 0.15, from: "23:50", to: "01:00", sweep: 1.2, label: "ตีหนึ่ง", top: 150 },
          { type: "figure", kind: "signalOn", t: 1.4, end: MSG - 0.15, artW: 150, label: "มือถือของกล้า", text: "[มีสัญญาณ]แล้ว", top: 450 },
          { type: "phone", t: MSG, who: "joe", name: "พี่โจ้ (หัวหน้าค่าย)", msg: "ติดธุระในเมือง [คืนนี้พี่ขึ้นไปไม่ทัน]<br>ฝากแคมป์ด้วยนะ", time: "15:12", typing: 1.0, top: 150 },
        ],
        extra(L) { L.glow.insertAdjacentHTML("beforeend", `<circle cx="790" cy="980" r="330" fill="url(#phoneglow)" opacity=".75"/>`); },
        fx(tl, id, t0) { Fx.punch(tl, `#${id} .stage`, t0 + MSG + 1.1, 1.08, 0.8); Fx.heart(tl, t0 + MSG + 1.1, D("signal") - MSG - 1.1, 0.5, 0.6); },
      });

      // ---------- 6. who was with us all day? ----------
      add("who", {
        set: "hut", dark: 0.25,
        cam: { from: { x: 20, y: 200, s: 1.12 }, to: { x: 120, y: 160, s: 1.3 } },
        actors: [
          { who: "pin", x: 300, y: 1540, s: 0.88, track: [{ t: 0, mode: "sitHurt", eyes: "wide", mouth: "frown" }] },
          { who: "kla", x: 520, y: 1530, s: 0.92, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o" }] },
          { who: "chai", x: 800, y: 1525, s: 0.95, flip: true, track: [{ t: 0, mode: "idle", mouth: "flat" }, { t: vo("who", 1), mode: "idle", look: 10, eyes: "side", mouth: "flat", blend: 0.5 }] },
        ],
        bubbles: [
          { text: "“แล้วคนที่อยู่กับเราทั้งวัน… [คือใคร]”", x: 60, y: 760, t: vo("who"), end: voEnd("who") + 0.2, tail: 220 },
          { text: "“ถ้าเราขาน… [มันจะตามเรากลับไป]”", x: 300, y: 760, t: vo("who", 1), end: D("who") - 0.1, tail: 480 },
        ],
        ui: [{ type: "status", t: vo("who", 1) + 0.3, who: "unknown", name: "สิ่งที่ปลอมเป็นพี่โจ้", text: "เลียนเสียงคน · อย่าขาน", tone: "unknown", side: "right", top: 170 }],
        fx(tl, id, t0) { flick(id, t0, "who"); Fx.desat(tl, `#${id} .stage`, t0 + vo("who", 1), undefined, 0.4); Fx.glitch(tl, `#${id}`, t0 + vo("who", 1) + 1.5, 0.3, 8, 82); },
      });

      // ---------- 7. no aspirin ----------
      add("aspirin", {
        set: "hut", dark: 0.2,
        cam: { from: { x: 60, y: 200, s: 1.18 }, to: { x: 80, y: 200, s: 1.24 } },
        actors: [
          { who: "pin", x: 300, y: 1540, s: 0.88, track: [{ t: 0, mode: "sitHurt", eyes: "pain", mouth: "frown", sweat: true }] },
          { who: "kla", x: 520, y: 1530, s: 0.92, track: [{ t: 0, mode: "point", eyes: "wide", mouth: "o" }, { t: vo("aspirin", 1), mode: "idle", blend: 0.3, eyes: "wide", mouth: "flat" }] },
          { who: "chai", x: 800, y: 1525, s: 0.95, flip: true, track: [{ t: 0, mode: "idle", mouth: "flat" }, { t: vo("aspirin", 1) - 0.2, mode: "point", blend: 0.25, eyes: "wide", mouth: "o" }] },
        ],
        bubbles: [
          { text: "“ปิ่นปวดมาก ผมมี[ยาแอสไพริน]”", x: 140, y: 780, t: vo("aspirin"), end: voEnd("aspirin") + 0.2, tail: 360 },
          { text: "“[ห้ามให้!] พิษงูจะแรงขึ้น”", x: 380, y: 780, t: vo("aspirin", 1), end: voEnd("aspirin", 1) + 0.3, tail: 440 },
        ],
        captions: [cap("aspirin", "งูกัด… [ห้ามกินแอสไพริน]", vo("aspirin", 2))],
        ui: [{ type: "tip", t: vo("aspirin", 2), ill: "pill", tone: "danger", label: "ถูกงูกัด · ยาที่ห้ามกิน", text: "ห้ามกิน[ยาแก้ปวดที่มีแอสไพริน]<br>ทำให้พิษงูออกฤทธิ์มากขึ้น", top: 160 }],
        fx(tl, id, t0) { flick(id, t0, "aspirin"); Fx.punch(tl, `#${id} .stage`, t0 + vo("aspirin", 1), 1.07, 0.5); },
      });

      // ---------- 8. the siege: knocks walk round the walls; the ranger's own voice outside ----------
      const SV = (i) => vo("siege", i), KN = [0.2, 0.55, 0.9, 1.25];
      add("siege", {
        set: "hut", dark: 0.35,
        cam: { from: { x: 60, y: 180, s: 1.12 }, to: { x: 60, y: 230, s: 1.28 } },
        actors: [
          { who: "pin", x: 300, y: 1540, s: 0.88, track: [{ t: 0, mode: "sitHurt", eyes: "wide", mouth: "o" }] },
          { who: "kla", x: 520, y: 1530, s: 0.92, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o", sweat: true }, { t: SV(0) + 1.2, mode: "tremble", look: -4, eyes: "side", mouth: "o", blend: 0.3 }] },
          { who: "chai", x: 800, y: 1525, s: 0.95, flip: true, track: [{ t: 0, mode: "idle", eyes: "wide", mouth: "flat" }, { t: SV(0) + 1.0, mode: "idle", eyes: "wide", mouth: "o", blend: 0.2 }, { t: SV(1) - 0.2, mode: "whistle", eyes: "wide", mouth: "flat", blend: 0.25 }] },
        ],
        sfxText: [["ก๊อก", 40, 760, -8], ["ก๊อก", 720, 620, 6], ["ก๊อก", 860, 1200, -4], ["ก๊อก", 60, 1260, 8]].map(([text, x, y, rot], i) => ({ text, x, y, rot, t: KN[i], end: KN[i] + 0.5, size: 60 }))
          .concat([{ text: "“กล้า… ลุงเอง เปิดประตูให้ลุงหน่อย”", x: 40, y: 560, t: SV(0), end: SV(0) + 6.2, size: 40, color: "#b9a8e8", rot: -2 }]),
        bubbles: [{ text: "“ชู่ว… [ห้ามใครขาน]”", x: 520, y: 820, t: SV(1), end: voEnd("siege", 1) + 0.6, tail: 300 }],
        ui: [
          { type: "radar", t: 0.1, end: SV(1) - 0.1, text: "มันเดินวนรอบป้อม", top: 160, side: "right", x: 30,
            sources: [{ dir: -60, pulses: [KN[0]] }, { dir: 30, pulses: [KN[1]] }, { dir: 120, pulses: [KN[2]] }, { dir: 210, pulses: [KN[3]] }, { dir: 0, label: "ประตู", ring: "#b9a8e8", color: "rgba(185,168,232,.3)", pulses: [SV(0)] }] },
          { type: "qte", t: voEnd("siege", 1) + 0.1, label: "ห้ามขาน · ห้ามส่งเสียง", okAt: D("siege") - 0.6, okText: "ทุกคนเงียบ", meter: "เสียงของคุณ", top: 170 },
        ],
        fx(tl, id, t0) {
          flick(id, t0, "siege");
          KN.forEach((k) => Fx.punch(tl, `#${id} .stage`, t0 + k, 1.025, 0.15));
          tl.fromTo(`#${id} .lampglow`, { opacity: 0.55 }, { opacity: 0.15, duration: 0.07, repeat: 11, yoyo: true, immediateRender: false }, t0 + SV(0));
          Fx.glitch(tl, `#${id}`, t0 + SV(0), 0.5, 12, 83); Fx.heart(tl, t0, D("siege"), 0.45, 0.7);
          Fx.letterbox(tl, t0 + SV(0), t0 + D("siege") - 0.1); Fx.tunnel(tl, t0 + voEnd("siege", 1), t0 + D("siege"), 0.8);
        },
      });

      // ---------- 8b. sneak to the back window… a rotten plank creaks, it finds them ----------
      const N = (i) => vo("sneak", i), S0 = N(1) - 0.2, CREAK = S0 + 3.0, FACE = CREAK + 1.2, SLAM = voEnd("sneak", 2) + 0.15;
      const SNV = Rig.footSpeed(1.6, 8) * 0.92, STEPS = [0.4, 1.2, 2.0].map((k) => S0 + k), PLANK = 520 + SNV * 3.0;
      add("sneak", {
        set: "hut", dark: 0.38,
        cam: { from: { x: 100, y: 200, s: 1.15 }, to: { x: 130, y: 210, s: 1.22 } },
        actors: [
          { who: "pin", x: 330, y: 1540, s: 0.86, track: [{ t: 0, mode: "sitHurt", eyes: "wide", mouth: "flat" }, { t: FACE, mode: "sitHurt", eyes: "wide", mouth: "scream", blend: 0.1 }] },
          { who: "chai", x: 180, y: 1525, s: 0.93, track: [{ t: 0, mode: "whistle", eyes: "wide", mouth: "flat" }, { t: S0, mode: "idle", blend: 0.4, eyes: "wide" }, { t: CREAK, mode: "idle", eyes: "wide", mouth: "o", blend: 0.15 }] },
          { who: "kla", x: 520, y: 1530, s: 0.92, until: SLAM - 0.4, track: [{ t: 0, mode: "crouch", eyes: "wide", sweat: true }, { t: S0, mode: "sneak", blend: 0.3, eyes: "side", mouth: "flat" },
            { t: CREAK, mode: "crouch", eyes: "wide", mouth: "o", blend: 0.1 }, { t: FACE, mode: "tremble", eyes: "wide", mouth: "scream", blend: 0.1 }], moveTo: { at: S0, x: PLANK, dur: 3.0 } },
          { who: "kla", x: PLANK, y: 1530, s: 0.92, from: SLAM - 0.4, track: [{ t: 0, mode: "run", eyes: "wide", mouth: "scream" }, { t: SLAM, mode: "raise", blend: 0.1, eyes: "closed", mouth: "frown" }], moveTo: { at: SLAM - 0.4, x: 905, dur: 0.4 } },
        ],
        bubbles: [
          { text: "“หน้าต่างหลัง… [ย่องไปปิดเบาๆ]”", x: 80, y: 760, t: N(0), end: voEnd("sneak", 0) + 0.2, tail: 120 },
          { text: "“ซวยแล้ว… [มันได้ยิน]”", x: 420, y: 760, t: N(2), end: SLAM + 0.3, tail: 320 },
        ],
        captions: [cap("sneak", "ในความมืด… [ทุกเสียง]คือการบอกตำแหน่ง", N(1), CREAK)],
        sfxText: [{ text: "เอี๊ยด!!", x: 520, y: 1180, t: CREAK, end: CREAK + 1.0, size: 110, color: "#ff8a6a", rot: -8 }, { text: "ปัง!!", x: 640, y: 520, t: FACE, end: FACE + 0.8, size: 120, color: "#f4ecd8", rot: 6 },
          { text: "ปึ้ง!", x: 700, y: 700, t: SLAM, end: SLAM + 0.7, size: 96, color: "#f2c55c", rot: -6 }],
        ui: [
          { type: "memo", t: voEnd("sneak", 0) - 0.5, end: S0 + 0.1, who: "kla", text: "ภารกิจ: [ย่องไปปิดหน้าต่าง]", top: 160 },
          { type: "stealth", t: S0 + 0.15, steps: STEPS.map((x) => x), creakAt: CREAK, top: 160 },
        ],
        extra(L, id) {
          L.far.insertAdjacentHTML("beforeend", `<g id="${id}-shL" transform="translate(560,420)"><rect width="220" height="520" fill="url(#planks)" stroke="#2e2a26" stroke-width="8"/></g>
            <g id="${id}-shR" transform="translate(780,420)"><rect width="220" height="520" fill="url(#planks)" stroke="#2e2a26" stroke-width="8"/></g>`);
          document.getElementById(id).querySelector(".winview").insertAdjacentHTML("beforeend", `<g id="${id}-face" opacity="0">${Sets.props.shade(`${id}-sh`, 650, 1460, 1.4)}</g>`);
          L.act.insertAdjacentHTML("afterbegin", `<g id="${id}-hints" opacity="0">${[560, 640, 720].map((x) => `<ellipse cx="${x}" cy="1536" rx="14" ry="6" fill="#7fd1b9" opacity=".8"/>`).join("")}
            <g transform="translate(${PLANK},1536)"><rect x="-56" y="-10" width="112" height="22" rx="4" fill="rgba(232,112,90,.45)" stroke="#e8705a" stroke-width="3"/><path d="M-40,0l14,-6l12,8l14,-7l12,6l14,-5" stroke="#2e2a26" stroke-width="3" fill="none"/>
              <text x="0" y="-22" text-anchor="middle" font-family="Kanit" font-weight="900" font-size="26" fill="#e8705a">ไม้ผุ</text></g></g>`);
          L.glow.insertAdjacentHTML("beforeend", STEPS.map((k, i) => `<ellipse id="${id}-ring${i}" cx="0" cy="1534" rx="30" ry="9" fill="none" stroke="#7fd1b9" stroke-width="4" opacity="0"/>`).join("") +
            `<ellipse id="${id}-ringC" cx="${PLANK}" cy="1534" rx="40" ry="12" fill="none" stroke="#ff6a5a" stroke-width="8" opacity="0"/><ellipse id="${id}-ringC2" cx="${PLANK}" cy="1534" rx="40" ry="12" fill="none" stroke="#ff6a5a" stroke-width="5" opacity="0"/>`);
        },
        fx(tl, id, t0) {
          flick(id, t0, "sneak");
          tl.set([`#${id}-shL`, `#${id}-shR`], { opacity: 0 }, t0); tl.set([`#${id}-shL`, `#${id}-shR`], { opacity: 1 }, t0 + SLAM - 0.01);
          tl.fromTo(`#${id}-shL`, { attr: { transform: "translate(360,420)" } }, { attr: { transform: "translate(560,420)" }, duration: 0.12, ease: "power3.in", immediateRender: false }, t0 + SLAM - 0.01);
          tl.fromTo(`#${id}-shR`, { attr: { transform: "translate(980,420)" } }, { attr: { transform: "translate(780,420)" }, duration: 0.12, ease: "power3.in", immediateRender: false }, t0 + SLAM - 0.01);
          tl.fromTo(`#${id}-hints`, { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, t0 + S0); tl.to(`#${id}-hints`, { opacity: 0, duration: 0.3 }, t0 + FACE);
          STEPS.forEach((k, i) => {
            const x = 520 + SNV * (k - S0);
            tl.set(`#${id}-ring${i}`, { attr: { cx: x } }, t0);
            tl.fromTo(`#${id}-ring${i}`, { attr: { rx: 20, ry: 6 }, opacity: 0.9 }, { attr: { rx: 110, ry: 30 }, opacity: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, t0 + k);
          });
          [[`#${id}-ringC`, 0], [`#${id}-ringC2`, 0.18]].forEach(([sel, d]) => tl.fromTo(sel, { attr: { rx: 30, ry: 9 }, opacity: 1 }, { attr: { rx: 640, ry: 190 }, opacity: 0, duration: 1.2, ease: "power2.out", immediateRender: false }, t0 + CREAK + d));
          tl.fromTo("#fxred", { opacity: 0.9 }, { opacity: 0, duration: 0.9, immediateRender: false }, t0 + CREAK);
          Fx.punch(tl, `#${id} .stage`, t0 + CREAK, 1.06, 0.4); Fx.glitch(tl, `#${id}`, t0 + CREAK + 0.5, 0.3, 12, 95);
          tl.set(`#${id}-face`, { opacity: 1 }, t0 + FACE);
          tl.set("#flashw", { opacity: 0.75 }, t0 + FACE); tl.to("#flashw", { opacity: 0, duration: 0.25 }, t0 + FACE + 0.01);
          Fx.punch(tl, `#${id} .stage`, t0 + FACE, 1.14, 0.5); Fx.glitch(tl, `#${id}`, t0 + FACE, 0.4, 16, 96);
          Fx.punch(tl, `#${id} .stage`, t0 + SLAM, 1.08, 0.3);
          Fx.heart(tl, t0 + S0, D("sneak") - S0, 0.5, 0.55); Fx.desat(tl, `#${id} .stage`, t0 + S0, t0 + CREAK, 0.4);
          Fx.letterbox(tl, t0 + S0, t0 + D("sneak") - 0.1);
        },
        shake: (t) => (t > FACE && t < FACE + 0.8 ? Math.sin(t * 80) * 12 : t > SLAM && t < SLAM + 0.3 ? Math.sin(t * 90) * 8 : 0),
      });

      // ---------- 9. Kla's eyes at the window: it calls every name it knows ----------
      add("window", {
        set: "hutWindow", dark: 0.3,
        cam: { from: { x: 0, y: -40, s: 1.0 }, to: { x: 60, y: 40, s: 1.25 } }, shake: (t) => hand(t).x * 0.6,
        captions: [cap("window", "ทั้งคืน… มันเรียก[ทุกชื่อ]ที่มันรู้จัก", vo("window", 1))],
        sfxText: [{ text: "“ปิ่น… กล้า… กลับแคมป์กันเถอะ”", x: 60, y: 1340, t: vo("window"), end: voEnd("window") + 0.3, size: 42, color: "#b9a8e8", rot: -2 }],
        ui: [{ type: "pov", t: 0.1, name: "กล้า", bpm: [150, 172], top: 150, x: 36 }],
        extra(L, id) {
          const view = document.getElementById(id).querySelector(".winview");
          view.insertAdjacentHTML("beforeend", `<g id="${id}-sw">${Sets.props.shade(`${id}-sh`, 0, 0, 1)}</g>`);
        },
        fx(tl, id, t0) {
          [[0, 340, 1180, 0.55], [1.6, 760, 1180, 0.55], [3.1, 340, 1580, 1.1], [4.6, 760, 1620, 1.25], [6.6, 340, 1700, 1.5]].forEach(([k, x, y, s]) => {
            tl.set(`#${id}-sw`, { attr: { transform: `translate(${x},${y}) scale(${s})` } }, t0 + k);
            if (k) { Fx.punch(tl, `#${id} .stage`, t0 + k, 1.05, 0.2); Fx.glitch(tl, `#${id}`, t0 + k, 0.2, 10, 84 + k); }
          });
          Fx.heart(tl, t0, D("window"), 0.42, 0.8); Fx.tunnel(tl, t0, t0 + D("window"), 0.6);
        },
      });

      // ---------- 10. dawn: the clock runs to 05:30, the rescue truck arrives ----------
      add("dawn", {
        set: "hutFront", setOpts: { dawn: true }, dark: 0.06,
        cam: { from: { x: 0, y: 120, s: 1.0 }, to: { x: 40, y: 160, s: 1.08 } },
        actors: [
          { who: "chai", x: 430, y: 1750, s: 0.82, track: [{ t: 0, mode: "idle", mouth: "flat" }, { t: vo("dawn"), mode: "wave", blend: 0.4, mouth: "smile" }] },
          { who: "kla", x: 270, y: 1760, s: 0.8, track: [{ t: 0, mode: "idle", eyes: "closed", mouth: "flat" }, { t: vo("dawn", 1), mode: "idle", mouth: "smile", blend: 0.4 }] },
          { who: "pin", x: 120, y: 1770, s: 0.78, track: [{ t: 0, mode: "idle", eyes: "pain", mouth: "flat" }, { t: vo("dawn", 1) + 0.4, mode: "idle", eyes: "closed", mouth: "smile", blend: 0.5 }] },
        ],
        captions: [cap("dawn", "ตีห้าครึ่ง… [รถกู้ภัยมาถึง]", vo("dawn"), vo("dawn", 1) - 0.1), cap("dawn", "ทุกอย่าง… [กำลังจะโอเค]", vo("dawn", 1))],
        ui: [
          { type: "clock", t: 0.1, end: vo("dawn") + 2.0, from: "01:30", to: "05:30", sweep: 2.0, label: "ตีห้าครึ่ง", top: 150 },
          { type: "status", t: vo("dawn", 1) + 0.6, who: "pin", name: "ปิ่น", text: "ปลอดภัยแล้ว", tone: "safe", side: "right", top: 170 },
        ],
        extra(L, id) { L.act.insertAdjacentHTML("beforeend", Sets.props.rescueTruck(`${id}-truck`, 1500, 1760, 0.8)); },
        fx(tl, id, t0) {
          tl.fromTo(`#${id}-truck`, { attr: { transform: "translate(1500,1760) scale(.8)" } }, { attr: { transform: "translate(850,1760) scale(.8)" }, duration: 2.6, ease: "power2.out", immediateRender: false }, t0 + vo("dawn") + 0.4);
          tl.fromTo(`#${id} .lbr`, { opacity: 1 }, { opacity: 0.25, duration: 0.25, repeat: 40, yoyo: true, immediateRender: false }, t0);
          tl.fromTo(`#${id} .lbb`, { opacity: 0.25 }, { opacity: 1, duration: 0.25, repeat: 40, yoyo: true, immediateRender: false }, t0);
          tl.fromTo(`#${id}-dark`, { opacity: 0.6 }, { opacity: 0.06, duration: 2.4, immediateRender: false }, t0);
        },
      });

      // ---------- 11. three days later ----------
      add("after", {
        set: "clinic", dark: 0.0,
        cam: { from: { x: 0, y: 260, s: 1.15 }, to: { x: 0, y: 280, s: 1.2 } },
        actors: [
          { who: "pin", x: 420, y: 1640, s: 0.9, track: [{ t: 0, mode: "sitChair", mouth: "smile" }] },
          { who: "kla", x: 660, y: 1640, s: 0.92, flip: true, track: [{ t: 0, mode: "sitChair", mouth: "smile" }] },
        ],
        captions: [cap("after", "สามวันต่อมา… [ออกจากโรงพยาบาล]")],
        ui: [{ type: "rel", t: 0.6, a: "kla", b: "pin", text: "กล้า ↔ ปิ่น · ความไว้ใจ", from: 4, top: 170 }],
        fx(tl, id, t0) {
          document.getElementById(`${id}-a0-shF`).insertAdjacentHTML("beforeend", `<rect x="-24" y="20" width="48" height="90" rx="10" fill="#f4f1e6" stroke="#2e2a26" stroke-width="3"/>`);
        },
      });

      // ---------- 12. the phone rings ----------
      add("call", {
        set: "clinic", dark: 0.0,
        cam: { from: { x: 60, y: 300, s: 1.3 }, to: { x: 60, y: 260, s: 1.45 } },
        actors: [
          { who: "pin", x: 420, y: 1640, s: 0.9, prop: "phone", track: [{ t: 0, mode: "sitChair", mouth: "smile" }, { t: vo("call", 1) + 0.4, mode: "sitPhone", eyes: "wide", mouth: "o", blend: 0.3 }] },
          { who: "kla", x: 660, y: 1640, s: 0.92, flip: true, prop: "phone", track: [{ t: 0, mode: "sitChair" }, { t: 0.6, mode: "sitPhone", blend: 0.3, mouth: "flat" }, { t: vo("call", 1) - 0.3, mode: "sitPhone", eyes: "wide", mouth: "o", sweat: true, blend: 0.2 }] },
        ],
        sfxText: [{ text: "ตื๊ด… ตื๊ด…", x: 640, y: 640, t: 0.2, end: D("call"), size: 60, color: "#7fd1b9", rot: 6 }],
        bubbles: [
          { text: "“ใครโทรมา[แต่เช้า]เนี่ย”", x: 80, y: 820, t: vo("call"), end: voEnd("call") + 0.2, tail: 300 },
          { text: "“…[ปิ่น] โทรมา”", x: 520, y: 820, t: vo("call", 1), end: D("call") - 0.05, tail: 200 },
        ],
        fx(tl, id, t0) {
          Fx.punch(tl, `#${id} .stage`, t0 + vo("call", 1), 1.12, 0.6); Fx.desat(tl, `#${id} .stage`, t0 + vo("call", 1), undefined, 0.35);
          Fx.heart(tl, t0 + vo("call", 1), D("call") - vo("call", 1), 0.45, 0.6); Fx.glitch(tl, `#${id}`, t0 + vo("call", 1) + 0.4, 0.3, 10, 90);
        },
      });

      // ---------- 13. Kla's eyes: the caller is "Pin"; the choice pulls toward answering ----------
      add("phone", {
        set: "clinic", dark: 0.15,
        cam: { from: { x: 0, y: 200, s: 1.2 }, to: { x: 0, y: 200, s: 1.26 } }, shake: (t) => hand(t).x * 0.6,
        captions: [cap("phone", "บางเสียง… [ไม่ได้อยู่แค่ในป่า]", vo("phone"), voEnd("phone") + 0.4)],
        ui: [
          { type: "pov", t: 0.05, name: "กล้า", bpm: [120, 176], top: 150, x: 36 },
          { type: "call", t: 0.1, who: "pin", name: "ปิ่น", sub: "มือถือ", glitchAt: 2.6, top: 640 },
          { type: "choice", t: voEnd("phone") + 0.5, q: "จะรับสายไหม?", a: "รับสาย", b: "ไม่รับ", secs: 3, top: 300,
            possessed: { at: 0.8, side: "a", glitch: "รับสิ…", who: "…อีกฝั่งกำลังรอให้คุณ ขาน" } },
        ],
        extra(L) { L.far.style.filter = "blur(6px)"; L.set.style.filter = "blur(6px)"; },
        fx(tl, id, t0) {
          Fx.heart(tl, t0, D("phone"), 0.42, 0.8); Fx.tunnel(tl, t0 + 1, t0 + D("phone") + 0.5, 0.8); Fx.letterbox(tl, t0 + voEnd("phone"), undefined);
          Fx.glitch(tl, `#${id}`, t0 + 2.6, 0.3, 12, 91); Fx.glitch(tl, `#${id}`, t0 + D("phone") - 1.2, 0.5, 16, 92);
          tl.set("#black", { opacity: 1 }, t0 + D("phone") - 0.22);
        },
      });

      // global overlays first: shot fx target them while the shots are being built
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">ค่ายคืนสุดท้าย · EP.3</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);

      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
