        actors: [FA(470, SIT(0.9), 0.9, [{ t: 0, mode: "huddle", eyes: "closed" }]), TAE(570, SIT(0.9), 0.9, [{ t: 0, mode: "huddle", eyes: "closed" }])],
        captions: caps("drip"),
        ui: [{ type: "rec", t: 0, dur: 0.01, nv: true, play: [64, 64], tc0: 7266, mode: "หยุดชั่วคราว ❚❚" }],
        extra(L, id) {
          PON(L, id); L.act.insertAdjacentHTML("beforeend", Koi.koiSit(`${id}-ks`, 770, 1330, 0.95, { eyes: true, rim: "#3f6f4a" }));
          L.light.insertAdjacentHTML("beforeend", `<g id="${id}-drop"><path d="M420,-90c-26,40 -26,72 0,82c26,-10 26,-42 0,-82z" fill="#b01e1e"/></g>
            <g id="${id}-splat" opacity="0"><g transform="translate(420,760) scale(2.1) translate(-520,-900)"><path d="M520,880c40,-30 90,-10 80,30c30,10 26,50 -6,52c6,40 -40,52 -60,24c-30,26 -76,6 -64,-30c-36,-6 -34,-52 4,-56c-8,-30 26,-40 46,-20z" fill="#8e1010" opacity=".93"/>
              ${[[640, 860, 9], [430, 830, 7], [600, 990, 6], [470, 1000, 5], [660, 930, 4]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#8e1010"/>`).join("")}
              <path d="M490,890c10,-14 30,-18 44,-10" stroke="#ff8a8a" stroke-width="6" fill="none" stroke-linecap="round" opacity=".55"/></g>
              <path class="run" d="M370,860v0" stroke="#8e1010" stroke-width="26" stroke-linecap="round"/><path class="run2" d="M470,850v0" stroke="#8e1010" stroke-width="18" stroke-linecap="round"/></g>`);
        },
        fx(tl, id, t0) {
          document.getElementById(`${id}-world`).style.filter = "grayscale(1) sepia(1) hue-rotate(58deg) saturate(2.6) brightness(1.9) contrast(1.25)";
          const hit = F("drip", 0, 1) + 0.5;
          tl.fromTo(`#${id}-drop`, { y: 0 }, { y: 860, duration: 0.45, ease: "power2.in", immediateRender: false }, t0 + hit - 0.45);
          tl.set(`#${id}-drop`, { opacity: 0 }, t0 + hit);
          tl.fromTo(`#${id}-splat`, { opacity: 0, scale: 0.3, svgOrigin: "420 760" }, { opacity: 1, scale: 1, duration: 0.12, ease: "back.out(3)", immediateRender: false }, t0 + hit);
          tl.fromTo(`#${id}-splat .run`, { attr: { d: "M370,860v0" } }, { attr: { d: "M370,860v520" }, duration: 1.8, ease: "power1.in", immediateRender: false }, t0 + hit + 0.1);
          tl.fromTo(`#${id}-splat .run2`, { attr: { d: "M470,850v0" } }, { attr: { d: "M470,850v330" }, duration: 1.5, ease: "power1.in", immediateRender: false }, t0 + hit + 0.25);
          Fx.punch(tl, `#${id} .stage`, t0 + hit, 1.05, 0.3); Fx.heart(tl, t0 + hit, D("drip") - hit, 0.42, 0.7);
        },
      });

      // ---------- 24. look up? (pulled toward looking) ----------
      add("choice", {
        set: "treeNight", setOpts: { id: "ch", time: "dawn" }, dark: 0.55, blur: { far: 6, mid: 5, set: 3 },
        cam: { keys: [{ t: 0, ...fr(560, 900, 1.2, 540, 960), drift: { s: 0.03 } }] }, shake: (t) => shakeH(t) * 2,
        ui: [{ type: "choice", t: 0.05, q: "จะมองขึ้นไปมั้ย?", a: "มองขึ้นไป", b: "ไม่มอง", secs: 3, top: 300,
          possessed: { at: 1.0, side: "a", glitch: "มองสิ…", who: "…มันอยู่ข้างบนมาตลอด" } }],
        extra(L, id) { L.light.insertAdjacentHTML("beforeend", `<g id="${id}-leg" transform="translate(760,-420)"><path d="M-14,0C-20,120 -6,220 -16,330L10,336C20,220 26,120 20,0Z" fill="#030504"/><path d="M-16,330C-30,350 -26,366 0,368L80,372C92,372 94,362 82,356L50,346C32,340 18,332 10,326Z" fill="#030504"/></g>`); },
        fx(tl, id, t0) {
          Fx.heart(tl, t0, D("choice"), 0.38, 0.85); Fx.tunnel(tl, t0, t0 + D("choice") + 0.5, 0.75);
          Fx.glitch(tl, `#${id}`, t0 + 1.0, 0.3, 12, 64);
          tl.to(`#${id}-leg`, { attr: { transform: "translate(760,-40)" }, duration: 0.18, ease: "power3.out" }, t0 + D("choice") - 0.62);
          Fx.glitch(tl, `#${id}`, t0 + D("choice") - 0.6, 0.4, 18, 65);
          tl.set("#black", { opacity: 1 }, t0 + D("choice") - 0.2);
        },
      });

      // the poncho's front drape has to sit over the actors, which the engine adds after extra(): move it to the top in fx
      shots.forEach((sh) => { const f = sh.fx; sh.fx = (tl, id, t0, L) => { const p = document.getElementById(`${id}-pon`); if (p) L.act.appendChild(p); if (f) f(tl, id, t0, L); }; });
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">เสียงกอย · EP.2</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);
      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
