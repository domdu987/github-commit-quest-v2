      add("joke", {
        set: "houseIn", setOpts: DAY("h14"), dark: 0.05,
        cam: { keys: [{ t: 0, ...fr(860, G - 600, 1.05, 540, 1100), drift: { s: 0.03 } }, { t: vo("joke", 1) - 0.1, glide: 0.35, ...fr(1080, G - 760, 1.45, 540, 1000), drift: { s: 0.04 } }, { t: SHOO + 0.2, glide: 0.4, ...fr(860, G - 600, 1.05, 540, 1100), drift: { s: 0.03 } }] },
        actors: [TOEY(640, G, 1.3, [{ t: 0, mode: "point", eyes: "normal", mouth: "o" }, { t: vo("joke", 0) + 1.2, mode: "laugh", eyes: "closed", mouth: "o" }, { t: SHOO + 0.1, mode: "run", eyes: "wide", mouth: "scream" }],
            { moveTo: { x: -300, y: G, dur: 0.8, at: SHOO + 0.2, ease: "power1.in" } }),
          PIAK(1100, G, 1.5, [{ t: 0, mode: "idle", eyes: "side", mouth: "frown" }, { t: vo("joke", 1), mode: "point", eyes: "wide", mouth: "scream" }, { t: SHOO + 0.6, mode: "idle", eyes: "normal", mouth: "frown" }], { flip: true })],
        captions: caps("joke", undefined, { quote: true }),
        extra(L) { lightsOff("h14"); },
        fx(tl, id, t0) { Fx.punch(tl, `#${id} .stage`, t0 + vo("joke", 1), 1.05, 0.25); },
      });

      // ---------- 15. knowledge, drawn: appliances that were under water — dry first, then checked (CDC / MEA) ----------
      add("know2", {
        set: "afterSection", setOpts: { id: "as2", v: 2 }, dark: 0,
        cam: { keys: [{ t: 0, ...DIA[2], drift: { s: 0.02 } }] },
        captions: caps("know2"),
        ui: [{ type: "src", t: F("know2", 0, 1), end: D("know2") - 0.05, top: 160, text: "ที่มา: <em>CDC สหรัฐฯ</em> · ต้องแห้งสนิทก่อนใช้ · <em>การไฟฟ้านครหลวง (MEA)</em> · ควรตรวจสอบเครื่องใช้ไฟฟ้าโดยช่างผู้ชำนาญก่อนใช้งานอีกครั้ง" }],
        fx(tl, id, t0) {
          const dry = t0 + F("know2", 0, 1), tech = t0 + F("know2", 0, 2);
          tl.fromTo("#as2-drops", { y: 0 }, { y: 14, duration: 0.5, repeat: 3, yoyo: true, ease: "sine.inOut", immediateRender: false }, t0);
          tl.to("#as2-drops", { opacity: 0, duration: 0.6 }, dry);
          tl.fromTo(["#as2-sun", "#as2-l1"], { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, dry);
          tl.fromTo("#as2-sun", { rotation: 0, svgOrigin: "520 700" }, { rotation: 45, svgOrigin: "520 700", duration: 2.5, ease: "none", immediateRender: false }, dry);
          tl.fromTo("#as2-tech", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, tech);
          tl.fromTo("#as2-ok", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, tech + 0.7);
        },
      });

      // ---------- 16. knowledge, drawn: sparks or a burning smell — the main switch down at once (CDC) ----------
      add("know3", {
        set: "afterSection", setOpts: { id: "as3", v: 3 }, dark: 0,
        cam: { keys: [{ t: 0, ...DIA[3], drift: { s: 0.02 } }] },
        captions: caps("know3"),
        ui: [{ type: "src", t: F("know3", 0, 1), end: D("know3") - 0.05, top: 160, text: "ที่มา: <em>CDC สหรัฐฯ</em> · เห็นสายไฟชำรุด ประกายไฟ หรือได้กลิ่นไหม้ ให้ตัดไฟที่เบรกเกอร์หลักทันที" }],
        fx(tl, id, t0) {
          const sp = t0 + 0.5, sm = t0 + F("know3", 0, 1), cut = t0 + F("know3", 0, 2) + 0.2;
          tl.fromTo("#as3-spark", { opacity: 0 }, { opacity: 1, duration: 0.07, yoyo: true, repeat: 7, immediateRender: false }, sp);
          tl.set("#as3-spark", { opacity: 0.8 }, sp + 0.6);
          tl.fromTo(["#as3-burn", "#as3-l1"], { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, sp + 0.2);
          tl.fromTo(["#as3-smoke", "#as3-l2"], { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, sm);
          tl.fromTo("#as3-smoke", { y: 40 }, { y: -30, duration: 2.5, ease: "none", immediateRender: false }, sm);
          tl.fromTo("#as3-arrow", { opacity: 0, attr: { "stroke-dashoffset": 0 } }, { opacity: 1, attr: { "stroke-dashoffset": -120 }, duration: 0.6, ease: "none", immediateRender: false }, cut - 0.4);
          tl.to("#as3-lever", { attr: { transform: "rotate(180 930 800)" }, duration: 0.3, ease: "power2.in" }, cut + 0.2);
          tl.to(["#as3-spark", "#as3-smoke"], { opacity: 0, duration: 0.3 }, cut + 0.5);
          tl.fromTo("#as3-ok", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, cut + 0.6);
        },
      });

      // ---------- 16. the outlet behind the fridge, burnt black; the tester stays dark ----------
      add("outlet", {
        set: "outletClose", setOpts: { id: "oc16" }, dark: 0.08,
        cam: { keys: [{ t: 0, ...fr(700, 900, 0.8, 540, 960), drift: { s: 0.02 } }, { t: F("outlet", 0, 1) - 0.1, glide: 0.8, ...fr(520, 920, 1.3, 540, 960), drift: { s: 0.04 } }] },
        captions: caps("outlet", undefined, { quote: true }),
        fx(tl, id, t0) {
          tl.fromTo("#oc16-tester", { x: 200, y: 160 }, { x: 0, y: 0, duration: 1.0, ease: "power2.out", immediateRender: false }, t0 + 0.2);
          Fx.punch(tl, `#${id} .stage`, t0 + F("outlet", 0, 1), 1.05, 0.3);
        },
      });

      // ---------- 18. ฝน: "แล้วใครดันคัตเอาต์ขึ้นล่ะลุง" — the lever close up: green slime on the handle ----------
      const WS = vo("who", 1) - 0.15;
      split("who", WS, {
        set: "houseIn", setOpts: DAY("h18"), dark: 0.05, blur: { far: 6, set: 6 },
        cam: { keys: [{ t: 0, ...fr(700, G + 400 - 1060, 1.0, 540, 1000), drift: { s: 0.05 } }] },
        actors: [FON(700, G + 400, 2.0, [{ t: 0, mode: "idle", eyes: "side", mouth: "o" }, { t: voEnd("who", 0), mode: "idle", eyes: "side", mouth: "flat" }], { flip: true })],
        captions: caps("who", [0], { quote: true }),
        extra(L) { lightsOff("h18"); },
      }, {
        set: "switchClose", setOpts: { id: "sc18", hand: false }, dark: 0.1,
        cam: { keys: [{ t: 0, ...fr(540, 1050, 0.95, 540, 960), drift: { s: 0.02 } }, { t: F("who", 1, 1) - WS - 0.3, glide: 1.4, ...fr(540, 1330, 1.8, 540, 960), drift: { s: 0.04 } }] },
        captions: capsFrom("who", WS, [1], { quote: true }),
        extra(L) { put(L.act, `<g id="sl18" opacity="0"><path d="M420,1330q40,-30 90,-6q50,-30 100,0q40,-20 70,10q-10,40 -40,46q-30,10 -60,-4q-50,20 -100,0q-50,10 -60,-46z" fill="#5fd06a" stroke="#1d4a24" stroke-width="5" opacity=".92"/>
          <path id="sl18d" d="M520,1384q-8,40 0,80q8,10 0,0" stroke="#5fd06a" stroke-width="14" fill="none" stroke-linecap="round"/><ellipse cx="560" cy="1342" rx="40" ry="10" fill="#c8ffc0" opacity=".6"/></g>`); },
        fx(tl, id, t0) {
          tl.set("#sc18-lever", { attr: { transform: "matrix(1 0 0 -1 0 2100)" } }, t0);
          const at = t0 + F("who", 1, 1) - WS - 0.2;
          tl.to("#sl18", { opacity: 1, duration: 0.5 }, t0 + 0.3);
          tl.fromTo("#sl18d", { attr: { d: "M520,1384q-8,10 0,20q8,4 0,0" } }, { attr: { d: "M520,1384q-8,60 0,120q8,10 0,0" }, duration: 1.6, ease: "power1.in", immediateRender: false }, at);
          Fx.heart(tl, at, D("who") - WS - (at - t0), 0.42, 0.5);
          Fx.glitch(tl, `#${id}`, at + 0.6, 0.2, 10, 805);
        },
      });

      // ---------- 19. ฝน walking along the porch with the pot ----------
      add("pot", {
        set: "porchFlood", setOpts: { id: "p19", dusk: true }, dark: 0.04,
        cam: { keys: [{ t: 0, ...fr(100, G - 300, 0.8, 540, 1150), drift: { x: -60, s: 0.02 } }] },
        actors: [FON(500, G, 1.1, [{ t: 0, mode: "walk", eyes: "side", mouth: "flat" }], { flip: true, moveTo: { x: -350, y: G, dur: D("pot"), ease: "none" } }),
          TOEY(860, G, 0.95, [{ t: 0, mode: "walk", eyes: "normal", mouth: "flat" }, { t: vo("pot", 1), mode: "walk", eyes: "closed", mouth: "frown" }], { flip: true, moveTo: { x: 10, y: G, dur: D("pot"), ease: "none" } })],
        captions: caps("pot", [0]).concat(caps("pot", [1], { quote: true })),
        extra(L) { put(L.act, `<g id="pt19"><g transform="translate(0,${G - 300}) scale(0.9)"><path d="M-70,-90H70L60,-10Q58,0 46,0H-46Q-58,0 -60,-10Z" fill="#9aa4a8" stroke="${IK}" stroke-width="4"/><rect x="-80" y="-104" width="160" height="18" rx="6" fill="#b8c0c4" stroke="${IK}" stroke-width="4"/></g></g>`); },
        fx(tl, id, t0) { tl.fromTo("#pt19", { x: 420 }, { x: -430, duration: D("pot"), ease: "none", immediateRender: false }, t0); },
      });

      // ---------- 20–23. top-down: ป้าแช่ม asleep on the mat; the rag; she wakes and smiles; her eyes flash green ----------
      add("mat", {
        set: "chaemTop", setOpts: { id: "ct20" }, dark: 0.1,
        cam: { keys: [{ t: 0, ...fr(540, 1100, 0.78, 540, 1000), drift: { s: 0.03 } }] },
        captions: caps("mat"),
      });
      add("rag", {
        set: "chaemTop", setOpts: { id: "ct21" }, dark: 0.1,
        cam: { keys: [{ t: 0, ...fr(380, 640, 1.2, 540, 960), drift: { s: 0.02 } }, { t: F("rag", 0, 1) - 0.1, glide: 0.8, ...fr(220, 560, 2.0, 540, 960), drift: { s: 0.04 } }] },
        captions: caps("rag"),
        fx(tl, id, t0) { Fx.heart(tl, t0 + F("rag", 0, 1), D("rag") - F("rag", 0, 1), 0.42, 0.5); },
      });
      const WK = vo("wake", 0) - 0.4;
      add("wake", {
        set: "chaemTop", setOpts: { id: "ct22", smile: true }, dark: 0.1,
        cam: { keys: [{ t: 0, ...fr(540, 600, 1.9, 540, 900), drift: { s: 0.05 } }] },
        captions: caps("wake", undefined, { quote: true }),
        fx(tl, id, t0) {
          tl.set("#ct22-smile", { opacity: 0 }, t0);
          tl.to("#ct22-shut", { opacity: 0, duration: 0.1 }, t0 + WK); tl.to("#ct22-open", { opacity: 1, duration: 0.1 }, t0 + WK);
          tl.to("#ct22-smile", { opacity: 1, duration: 0.3 }, t0 + F("wake", 0, 1));
          Fx.heart(tl, t0, D("wake"), 0.45, 0.45);
        },
      });
      add("glint", {
        set: "chaemTop", setOpts: { id: "ct23", smile: true }, dark: 0.12,
        cam: { keys: [{ t: 0, ...fr(540, 610, 2.3, 540, 900), drift: { s: 0.06 } }] },
        captions: caps("glint"),
        fx(tl, id, t0) {
          tl.set("#ct23-shut", { opacity: 0 }, t0); tl.set("#ct23-open", { opacity: 1 }, t0);
          const g = t0 + F("glint", 0, 1) + 0.35;
          tl.set("#ct23-eyes", { opacity: 1 }, g); tl.set("#ct23-eyes", { opacity: 0 }, g + 0.16);
          Fx.heart(tl, g, D("glint") - F("glint", 0, 1) - 0.35, 0.45, 0.5);
        },
      });

      add("night", {
        set: "floodVillage", setOpts: { id: "f24", lights: [[1200, 900, 0.8]], seed: 324 }, dark: 0.16,
        cam: { keys: [{ t: 0, ...fr(560, 1000, 0.72, 540, 1000), drift: { x: 60, s: 0.03 } }] },
        captions: caps("night"),
        fx(tl, id, t0) { tl.fromTo(["#f24-l0", "#f24-lg0"], { x: 0 }, { x: -700, duration: D("night"), ease: "none", immediateRender: false }, t0); },
      });

      // ---------- 25. the light close: the face, calling "ฝน… เต้ย… มานี่สิลูก…" ----------
      add("call", {
        set: "floodVillage", setOpts: { id: "f25", dark: true, seed: 325 }, dark: 0.55,
        cam: { keys: [{ t: 0, ...fr(560, 900, 1.0, 540, 900), drift: { s: 0.02 } }, { t: 0.4, glide: D("call") - 2.0, ...fr(560, 880, 1.25, 540, 900), drift: { s: 0.02 } }] },
        captions: caps("call", undefined, { quote: true }),
        extra(L) { put(L.act, Krasue.lurk(600, 880, 0.42, { id: "k25", heart: 0.8 })); put(L.light, Krasue.lensFace("k25f")); },
        fx(tl, id, t0) {
          const out = t0 + voEnd("call") + 0.1, hit = t0 + D("call") - 0.5;
          Fx.heart(tl, t0, voEnd("call"), 0.5, 0.55);
          tl.to("#k25", { opacity: 0, duration: 0.08 }, out);
          tl.to(`#${id}-dark`, { opacity: 0.9, duration: 0.3 }, out);
          tl.fromTo("#k25f", { opacity: 0, scale: 1.25, transformOrigin: "50% 47%" }, { opacity: 1, scale: 1, duration: 0.09, ease: "power4.out", immediateRender: false }, hit);
          Fx.glitch(tl, `#${id}`, hit + 0.05, 0.18, 16, 807);
          tl.set("#black", { opacity: 1 }, hit + 0.24);
        },
      });

      // ---------- 26. black, one green light far off; the rule ----------
      add("last", {
        set: "floodVillage", setOpts: { id: "f26", dark: true, lights: [[560, 980, 0.5]], seed: 326 }, dark: 0.6,
        cam: { keys: [{ t: 0, ...fr(560, 1000, 1.0, 540, 960), drift: { s: 0.02 } }] },
        captions: caps("last"),
        fx(tl, id, t0) {
          tl.set("#black", { opacity: 0 }, t0 + 0.5);
          tl.to(`#${id}-dark`, { opacity: 0.92, duration: F("last", 0, 2) }, t0);
          tl.to(["#f26-l0", "#f26-lg0"], { opacity: 0, duration: 0.6 }, t0 + D("last") - 1.0);
          Fx.heart(tl, t0, D("last") - 0.6, 0.6, 0.4);
          tl.set("#black", { opacity: 1 }, t0 + D("last") - 0.2);
        },
      });

      // ---------- 27. end card: the sign on the pole — the end ----------
      add("end", {
        set: "poleSign", setOpts: { id: "sg", ep: "ตอนจบ", title: "แสงกระสือ" }, dark: 0.08,
        cam: { keys: [{ t: 0, ...fr(540, 900, 1.0, 540, 900), drift: { s: 0.03 } }] },
        fx(tl, id, t0) {
          tl.set("#black", { opacity: 0 }, t0 + 0.3);
          tl.fromTo("#sg-sign", { attr: { transform: "rotate(-9 540 900)" } }, { attr: { transform: "rotate(-2 540 900)" }, duration: 1.6, ease: "elastic.out(1,0.4)", immediateRender: false }, t0 + 0.3);
        },
      });

      shots.forEach((sh) => { const f = sh.fx; sh.fx = (tl, id, t0, L) => { if (f) f(tl, id, t0, L); Krasue.life(tl, `#${id}`, t0, sh.dur); }; });
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">แสงกระสือ · EP.3</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);
      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
