<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{margin:0;background:#000} #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Kanit;font-weight:900}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;background:url(cover_hero.jpg) center/cover no-repeat;transform-origin:540px 760px;transform:scale(1.06)}
.cv2{position:absolute;inset:0;z-index:70;pointer-events:none}.ol{position:relative;display:inline-block;z-index:0}.ol::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:transparent;-webkit-text-stroke:22px #15101c}
.cv2-shade{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(0deg,rgba(8,6,12,.96) 0%,rgba(8,6,12,.82) 38%,rgba(8,6,12,0) 100%)}
.cv2-top{position:absolute;left:60px;top:150px;display:flex;align-items:center;gap:18px}
.cv2-series{background:#15101c;color:#ffd84a;font:800 46px/1 Kanit;padding:16px 30px 20px;border-radius:22px;border:4px solid #ffd84a;letter-spacing:1px}
.cv2-ep{background:#e2382e;color:#fff;font:900 46px/1 Kanit;padding:16px 26px 20px;border-radius:22px;box-shadow:0 0 0 4px #15101c}
.cv2-hook{position:absolute;left:0;right:0;bottom:150px;text-align:center}
.cv2-l1{font-size:104px;line-height:1.1;color:#fff;text-shadow:0 10px 0 rgba(0,0,0,.45)}.cv2-l1 .ol::before{-webkit-text-stroke-width:18px}
.cv2-l2{margin-top:6px;font-size:170px;line-height:1.05;color:#ffd84a;transform:rotate(-2deg);text-shadow:0 14px 0 rgba(0,0,0,.5),0 0 40px rgba(255,216,74,.45);letter-spacing:-2px}.cv2-l2 .ol::before{-webkit-text-stroke-width:28px}
</style></head><body><div id="stage"><div id="bg"></div><div class="cv2"><div class="cv2-shade"></div>
<div class="cv2-top"><span class="cv2-series">สกิลจอมโกหก</span><span class="cv2-ep">EP.1</span></div>
<div class="cv2-hook"><div class="cv2-l1"><span class="ol" data-t="ได้สกิลกากสุด">ได้สกิลกากสุด</span></div><div class="cv2-l2"><div><span class="ol" data-t="แต่ได้ที่ 1!?">แต่ได้ที่ 1!?</span></div></div></div></div></div></body></html>
