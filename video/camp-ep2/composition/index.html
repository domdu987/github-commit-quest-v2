      const CAMP_DUSK = { time: "dusk" }, CAMP_NIGHT = { time: "night" };
      const PIN_ARM = { sleeve: "#e8b98f", skin: "#e8b98f", cuff: "#4f8f86" }, KLA_ARM = { sleeve: "#9c4a3c", skin: "#d6a27c", cuff: "#6a2e25" };

      // ---------- 1. Kla's eyes: the pull toward "answer"… he breaks it and runs ----------
      const PICK = voEnd("open") + 0.15;
      const E1 = (id) => Fx.pov(id, { ...KLA_ARM, shake: (t) => ({ x: hand(t).x * 2, y: hand(t).y * 2 }), flicker: [[1.4, 0.4]], keys: [{ t: 0, x: 550, y: 900, r: 300 }, { t: PICK, x: 540, y: 880, r: 300 }, { t: PICK + 0.5, x: 200, y: 1300, r: 220 }, { t: 6.1, x: 300, y: 1200, r: 220 }] });
      add("open", {
        set: "forest", setOpts: { seed: 13, width: 2400, path: false }, dark: 0.3,
        cam: { from: { x: 0, y: 110, s: 1.08 }, to: { x: -120, y: 160, s: 1.0 } }, shake: (t) => hand(t).x * (t > PICK ? 3 : 1),
        captions: [cap("open", "ถ้าวันหนึ่ง… คุณต้อง[หนี]สิ่งที่ปลอมเป็นคนรู้จัก", vo("open"), PICK)],
        bubbles: [{ text: "“ปิ่น! [วิ่ง!]”", x: 340, y: 1180, t: vo("open", 1), end: D("open") - 0.05, tail: 160 }],
        ui: [
          { type: "pov", t: 0.05, name: "กล้า", bpm: [178, 196], top: 150, x: 36 },
          { type: "choice", t: 0.1, end: PICK + 1.1, q: "จะทำยังไง?", a: "ขานรับ", b: "วิ่งหนี", secs: 3, top: 330, pickAt: PICK, pick: "b", who: "กล้าเลือก… วิ่งหนี!",
            possessed: { at: 0.15, side: "a", glitch: "ขานสิ…", who: "…มีบางอย่างอยากให้คุณ ขาน" } },
        ],
        extra(L, id) {
          L.act.insertAdjacentHTML("beforeend", `<g id="${id}-jw" transform="translate(560,1660) scale(1.5)"></g>`);

        },
        fx(tl, id, t0) {

          tl.set("#flashw", { opacity: 0.8 }, t0 + PICK); tl.to("#flashw", { opacity: 0, duration: 0.3 }, t0 + PICK + 0.01);
          Fx.punch(tl, `#${id} .stage`, t0 + PICK, 1.12, 0.4); Fx.heart(tl, t0, D("open"), 0.36, 0.85); Fx.tunnel(tl, t0, t0 + PICK, 0.8);
          Fx.speed(tl, t0 + PICK + 0.4, t0 + D("open"));

      add("fall", {

        captions: [cap("herd", "พื้นดินสั่น… [ช้างป่าทั้งฝูง]", H(0), H(1) - 0.1), cap("herd", "ช้าง… หันไปทาง[เงาในป่า]", H(2))],
        ui: [
          { type: "qte", t: 2.9, end: H(1) - 0.1, label: "อยู่นิ่ง · ห้ามส่งเสียง", okAt: H(1) - 0.7, okText: "เงียบไว้ได้", meter: "เสียงของคุณ", top: 170 },
          { type: "tip", t: H(1), end: H(2) - 0.1, ill: "elephant", tone: "warn", label: "เจอช้างป่าระยะใกล้", text: "[อย่าส่งเสียงไล่] · หลบหลังต้นไม้ใหญ่<br>แล้วค่อยๆ ถอยออก", top: 160 },
        ],
        extra(L, id) {
          L.mid.insertAdjacentHTML("beforeend", `<g id="${id}-cw">${Sets.props.elephant(`${id}-calf`, 0, 0, 1)}</g><g id="${id}-bw">${Sets.props.elephant(`${id}-bull`, 0, 0, 1)}</g>`);
          L.mid.insertAdjacentHTML("beforeend", `<rect x="-800" y="1480" width="3200" height="200" fill="#16252c"/>`);
          L.act.insertAdjacentHTML("afterbegin", Sets.props.shade(`${id}-sh`, 1010, 1560, 0.8));
        },
        shake: (t) => (t < 3.2 ? Math.sin(t * 50) * 4 * (1 - t / 3.2) : t > H(2) && t < H(2) + 1.2 ? Math.sin(t * 60) * 7 : 0),
        fx(tl, id, t0) {
          flick(id, t0, "herd");
          const bw = document.getElementById(`${id}-bw`), cw = document.getElementById(`${id}-cw`), sh = document.getElementById(`${id}-sh`), m = { k: 0 };
          const stopAt = H(2) / D("herd");
          tl.to(m, { k: 1, duration: D("herd"), ease: "none", onUpdate: () => {
            const k = Math.min(m.k, stopAt);
            bw.setAttribute("transform", `translate(${(-500 + 1500 * k).toFixed(1)},1500) scale(-.68,.68)`);
            cw.setAttribute("transform", `translate(${(-900 + 1500 * k).toFixed(1)},1500) scale(-.42,.42)`);
          } }, t0);
          Camp.animElephant(tl, `${id}-bull`, t0, D("herd"), { period: 1.6, raise: H(2) - 0.1 });
          Camp.animElephant(tl, `${id}-calf`, t0, D("herd"), { period: 1.1 });
          tl.fromTo(sh, { x: 0 }, { x: -110, duration: H(2) - 1, ease: "none", immediateRender: false }, t0 + 1);
          tl.to(sh, { x: 320, opacity: 0, duration: 0.9, ease: "power2.in" }, t0 + H(2) + 0.5);
          Fx.punch(tl, `#${id} .stage`, t0 + H(2), 1.1, 0.8); Fx.heart(tl, t0 + 2.9, H(1) - 3, 0.5, 0.6);
          Fx.tunnel(tl, t0 + 2.9, t0 + H(1), 0.7);
        },
      });

      // ---------- 8. the bite ----------
      const STRIKE = 0.95;
      add("bite", {
        set: "forest", setOpts: { seed: 19, width: 2400, path: false, branch: false }, dark: 0.42,
        cam: { from: { x: 260, y: 520, s: 1.65 }, to: { x: 200, y: 330, s: 1.22 }, at: STRIKE, dur: 1.4 },
        actors: [
          { who: "pin", x: 560, y: 1600, s: 0.92, track: [{ t: 0, mode: "walk", eyes: "side" }, { t: STRIKE, mode: "fall", eyes: "pain", mouth: "scream", blend: 0.08 }], moveTo: { x: 560 + walkV(0.92) * STRIKE, dur: STRIKE } },
          { who: "kla", x: 300, y: 1592, s: 0.94, track: [{ t: 0, mode: "walk" }, { t: STRIKE + 0.2, mode: "idle", eyes: "wide", mouth: "o", blend: 0.3 }], moveTo: { x: 300 + walkV(0.94) * (STRIKE + 0.2), dur: STRIKE + 0.2 } },
        ],
        bubbles: [{ text: "“โอ๊ย! [งู!]”", x: 520, y: 700, t: vo("bite"), end: D("bite") - 0.1, tail: 120 }],
        ui: [{ type: "status", t: vo("bite") + 0.5, who: "pin", eyes: "wide", name: "ปิ่น", text: "บาดเจ็บ · งูกัด", tone: "danger", side: "left", top: 170 }],
        extra(L, id) { L.fg.innerHTML = ""; L.act.insertAdjacentHTML("beforeend", `<g transform="translate(${560 + walkV(0.92) * STRIKE + 130},1606) scale(-0.8,0.8)">${Sets.props.snake(`${id}-sn`, 0, 0, 1)}</g>`); },
        shake: (t) => (t > STRIKE && t < STRIKE + 0.5 ? Math.sin(t * 70) * 7 : 0),
        fx(tl, id, t0) {
          Camp.animSnake(tl, `${id}-sn`, t0, D("bite"), { strike: STRIKE - 0.12 });
          tl.set("#flashw", { opacity: 0.55 }, t0 + STRIKE); tl.to("#flashw", { opacity: 0, duration: 0.2 }, t0 + STRIKE + 0.01);
          Fx.punch(tl, `#${id} .stage`, t0 + STRIKE, 1.12, 0.6); Fx.heart(tl, t0 + STRIKE, D("bite") - STRIKE, 0.45, 0.85);
          flick(id, t0, "bite");
        },
      });

      // ---------- 9. first aid, know the snake, keep going together ----------
      add("aid", {
        set: "forest", setOpts: { seed: 23, width: 2400, path: false, branch: false }, dark: 0.45,
        cam: { from: { x: 40, y: 380, s: 1.25 }, to: { x: 60, y: 360, s: 1.32 } },
        actors: [
          { who: "pin", x: 400, y: 1640, s: 0.95, track: [{ t: 0, mode: "sitHurt", eyes: "pain", mouth: "frown", sweat: true }, { t: vo("aid", 2), mode: "sitHurt", eyes: "wide", mouth: "flat", blend: 0.4 }] },
          { who: "kla", x: 830, y: 1650, s: 0.92, flip: true, track: [{ t: 0, mode: "crouch", eyes: "wide", mouth: "flat" }, { t: vo("aid", 2), mode: "crouch", look: -10, mouth: "flat", blend: 0.4 }] },
        ],
        bubbles: [{ text: "“อย่าขยับนะปิ่น [ออกไปด้วยกัน]”", x: 260, y: 720, t: vo("aid", 2), end: voEnd("aid", 2) + 0.3, tail: 560 }],
        ui: [
          { type: "tip", t: 0.35, end: vo("aid", 1) - 0.1, ill: "snake", tone: "danger", label: "งูกัด · ปฐมพยาบาล", text: "ห้าม [กรีด · ดูด · ขันชะเนาะ]<br>ขยับให้น้อย → รีบไปโรงพยาบาล", top: 160 },
          { type: "figure", kind: "snakeid", t: vo("aid", 1), end: vo("aid", 2) - 0.1, artW: 330, tone: "warn", label: "จำลักษณะงู · ไม่ต้องจับ", text: "[งูเขียวหางไหม้]", text2: "กัดคนบ่อย · พิษต่อเลือด", second: vo("aid", 1) + 1.2, top: 150 },
          { type: "rel", t: vo("aid", 2) + 0.2, end: voEnd("aid", 2) + 0.5, a: "kla", b: "pin", text: "กล้า ↔ ปิ่น · ความไว้ใจ", from: 4, top: 170 },
        ],
        extra(L) { L.fg.innerHTML = ""; },
        fx(tl, id, t0) {
          document.getElementById(`${id}-a0-shF`).insertAdjacentHTML("beforeend", `<g id="${id}-splint" opacity="0"><rect x="-27" y="4" width="10" height="126" rx="4" fill="#7a5c3c" stroke="#2e2a26" stroke-width="3"/>
            <rect x="17" y="4" width="10" height="126" rx="4" fill="#7a5c3c" stroke="#2e2a26" stroke-width="3"/><rect x="-30" y="30" width="60" height="14" rx="5" fill="#e07a4f" stroke="#2e2a26" stroke-width="3"/>
            <rect x="-30" y="92" width="60" height="14" rx="5" fill="#e07a4f" stroke="#2e2a26" stroke-width="3"/></g>`);
          tl.fromTo(`#${id}-splint`, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, t0 + 2.6);
          flick(id, t0, "aid");
        },
      });

      // ---------- 10. a light: the ranger post ----------
      add("hut", {
        set: "hutFront", dark: 0.35,
        cam: { from: { x: 0, y: 60, s: 1.0 }, to: { x: 0, y: 120, s: 1.08 } },
        actors: [
          { who: "kla", x: 120, y: 1760, s: 0.78, track: [{ t: 0, mode: "walk", opts: { period: 1.15, stride: 11 }, eyes: "wide" }], moveTo: { x: 120 + Rig.footSpeed(1.15, 11) * 0.78 * D("hut"), dur: D("hut") } },
          { who: "pin", x: 10, y: 1770, s: 0.76, track: [{ t: 0, mode: "walk", opts: { period: 1.3, stride: 9 }, eyes: "pain", mouth: "frown" }], moveTo: { x: 10 + Rig.footSpeed(1.3, 9) * 0.76 * D("hut"), dur: D("hut") } },
        ],
        captions: [cap("hut", "แสงไฟ… [หน่วยพิทักษ์ป่า]")],
        ui: [{ type: "tip", t: 1.0, ill: "map", tone: "rule", label: "เป้าหมาย", text: "ถึง[ป้อมพิทักษ์ป่า] ✓", top: 160 }],
        fx(tl, id, t0) { tl.fromTo(`#${id} .hwglow`, { opacity: 0.7 }, { opacity: 1, duration: 0.6, repeat: 6, yoyo: true, immediateRender: false }, t0); },
      });

      // ---------- 11. the radio inside asks for the door; a shout from behind says no ----------
      const DV = (i) => vo("door", i), DE = (i) => voEnd("door", i);
      add("door", {
        set: "hutFront", dark: 0.4,
        cam: { from: { x: 0, y: 260, s: 1.25 }, to: { x: 0, y: 300, s: 1.45 } },
        actors: [
          { who: "kla", x: 380, y: 1700, s: 0.95, until: DV(1) + 0.3, track: [{ t: 0, mode: "point", eyes: "wide", mouth: "flat" }, { t: 1.2, mode: "idle", blend: 0.3, eyes: "wide" }, { t: DV(0), mode: "tremble", eyes: "wide", mouth: "o", sweat: true, blend: 0.2 }] },
          { who: "pin", x: 210, y: 1712, s: 0.92, until: DV(1) + 0.3, track: [{ t: 0, mode: "idle", eyes: "pain", mouth: "frown" }, { t: DV(0), mode: "tremble", eyes: "wide", mouth: "o", blend: 0.2 }] },
          { who: "kla", x: 380, y: 1700, s: 0.95, flip: true, from: DV(1) + 0.3, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o", sweat: true }] },
          { who: "pin", x: 210, y: 1712, s: 0.92, flip: true, from: DV(1) + 0.3, track: [{ t: 0, mode: "tremble", eyes: "wide", mouth: "o" }] },
        ],
        sfxText: [{ text: "ก๊อก ก๊อก", x: 520, y: 1100, t: 0.3, end: 1.2, size: 64 }, { text: "ซ่า…", x: 120, y: 940, t: DV(0) - 0.2, end: DE(0), size: 56, color: "#b9a8e8", rot: -5 }],
        bubbles: [
          { text: "“กล้า… [เปิดประตู]ให้พี่หน่อย”", x: 90, y: 760, t: DV(0), end: DE(0) + 0.2, tail: 120 },
          { text: "“[อย่าเปิดนะ!]”", x: 600, y: 1000, t: DV(1), end: D("door") - 0.1, tail: 300 },
        ],
        ui: [
          { type: "radar", t: DV(0), text: "เสียงจาก 2 ทาง", end: D("door") - 0.1, top: 160, side: "right", x: 30,
            sources: [{ dir: 0, label: "ในป้อม", ring: "#b9a8e8", color: "rgba(185,168,232,.3)", pulses: [DV(0), DV(0) + 1.6] }, { dir: 180, label: "ข้างหลัง", ring: "#f2c55c", color: "rgba(242,197,92,.3)", pulses: [DV(1)] }] },
          { type: "choice", t: DE(1) + 0.3, q: "เชื่อเสียงไหน?", a: "เปิดประตู", b: "เชื่อเสียงข้างหลัง", secs: 3, top: 520 },
        ],
        fx(tl, id, t0) {
          tl.fromTo(`#${id} .hwglow`, { opacity: 1 }, { opacity: 0.3, duration: 0.08, repeat: 15, yoyo: true, immediateRender: false }, t0 + DV(0));
          Fx.glitch(tl, `#${id}`, t0 + DV(0), 0.4, 10, 77); Fx.glitch(tl, `#${id}`, t0 + DV(1), 0.3, 14, 78);
          Fx.punch(tl, `#${id} .stage`, t0 + DV(1), 1.12, 0.6); Fx.heart(tl, t0 + DV(0), D("door") - DV(0), 0.42, 0.75);
          Fx.letterbox(tl, t0 + DV(0), undefined); Fx.tunnel(tl, t0 + DE(1), t0 + D("door") + 0.5, 0.8);
          tl.set("#black", { opacity: 1 }, t0 + D("door") - 0.22);
        },
      });

      // global overlays first: shot fx target them while the shots are being built
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">ค่ายคืนสุดท้าย · EP.2</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);

      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
