          BAND(`${id}-a2`); BAND(`${id}-a3`);
          tl.to(`#${id}-a3`, { opacity: 0, duration: 1.0 }, t0 + D("lure") - 1.1);
          const w0 = vo("lure", 1), pts = []; for (let t = w0 + 0.3; t < D("lure") - 0.8; t += 0.8) pts.push([t, 640 + LV * (t - w0) + 170, 1586]);
          taps(L, tl, t0, pts);
        },
      });

      // ---------- 16. the tracks he left: only one foot ----------
      add("tracks", {
        set: "stickTracks", setOpts: { id: "tk3" }, dark: 0.04,
        cam: { from: { ...fr(600, 2350, 1.05, 540, 1250) }, to: { ...fr(600, 1500, 0.8, 540, 1000) } },
        captions: caps("tracks"),
        fx(tl, id, t0) {
          const h = t0 + F("tracks", 0, 1);
          tl.fromTo("#tk3-hl", { opacity: 0 }, { opacity: 0.7, duration: 0.18, repeat: 5, yoyo: true, immediateRender: false }, h);
          Fx.punch(tl, `#${id} .stage`, h, 1.07, 0.4); Fx.glitch(tl, `#${id}`, h, 0.3, 12, 35); Fx.heart(tl, t0, D("tracks"), 0.5, 0.7);
          tl.fromTo("#fxred", { opacity: 0.6 }, { opacity: 0, duration: 0.6, immediateRender: false }, h);
        },
      });

      // ---------- 17. the helicopter sees the V ----------
      add("rescue", {
        set: "aerialClearing", setOpts: { id: "rs3" }, dark: 0.02,
        cam: { keys: [{ t: 0, ...fr(540, 1040, 0.9, 540, 960), drift: { s: 0.03 } }] }, shake: (t) => 3 * Math.sin(t * 9),
        captions: caps("rescue"),
        ui: [{ type: "rec", t: 0, dur: D("rescue"), tc0: 0, af: { at: F("rescue", 0, 1) - 0.1, x: 270, y: 650, w: 540, h: 670, label: "ตรวจพบ V" } }],
        fx(tl, id, t0) {
          document.querySelectorAll("#rs3-v path").forEach((p) => tl.set(p, { attr: { "stroke-dashoffset": 0 } }, t0));
          tl.set("#rs3-v", { scale: 1.3, svgOrigin: "540 1000" }, t0);
          Koi.life3(tl, `#${id}`, t0, D("rescue"));
          tl.fromTo("#rs3-hs", { attr: { transform: "translate(1500,200)" } }, { attr: { transform: "translate(760,760)" }, duration: 1.6, ease: "power2.out", immediateRender: false }, t0);
          tl.fromTo("#rs3-us", { y: 0 }, { y: -14, duration: 0.2, repeat: 11, yoyo: true, immediateRender: false }, t0 + 0.3);
        },
      });

      // ---------- 18. channel signature ----------
      add("sig", {
        set: "clearingSide", setOpts: { id: "sg3" }, dark: 0.3, blur: { far: 10, mid: 9, set: 8 },
        cam: { keys: Sig.cam(F, { ...fr(540, 1150, 0.9, 540, 960) }) }, shake: Sig.shake(F),
        captions: caps("sig"),
        ui: [Sig.ui(F, "ขากลับ · เช็กลิสต์เอาตัวรอด", [["ไม่ข้ามน้ำ", true], ["ต้มน้ำ", true], ["ทำตัว V", true], ["???", false]], D("sig"))],
        fx(tl, id, t0) { Sig.fx(tl, id, t0, F, D("sig")); },
      });

      // ---------- 19. three days later, hospital: "a guide called Mad...?" ----------
      const BED = (L, id) => L.act.insertAdjacentHTML("beforeend", Koi.blanket(`${id}-blk`, 330, 920, 1300));
      add("hosp", {
        set: "hospRoom", setOpts: { id: "hp3" }, dark: 0.16,
        cam: { keys: [{ t: 0, ...fr(640, 1250, 0.78, 540, 1000), drift: { s: 0.015 } }, { t: vo("hosp", 1) - 0.05, ...fr(880, 1180, 1.45, 540, 960), drift: { s: 0.02 } }] },
        actors: [{ who: "faGown", x: 420, y: 1300, s: 0.85, track: [{ t: 0, mode: "sit", eyes: "normal", mouth: "flat" }, { t: F("hosp", 1, 1), mode: "sit", eyes: "wide", mouth: "o" }] },
          { who: "nurse", x: 1050, y: 1640, s: 0.95, flip: true, prop: "clip", track: [{ t: 0, mode: "clipboard", eyes: "normal", mouth: "flat" }, { t: vo("hosp", 1), mode: "clipboard", eyes: "side", mouth: "flat", look: 6 }] }],
        captions: caps("hosp", [0]),
        bubbles: [bub("hosp", 1, 300, 560, 440)],
        ui: [{ type: "chapter", t: 0.2, end: vo("hosp", 1) - 0.2, small: "สามวันต่อมา", big: "โรงพยาบาล", top: 330 }],
        extra(L, id) { BED(L, id); },
        fx(tl, id, t0, L) { TOP(L, document.getElementById(`${id}-blk`)); },
      });

      // ---------- 20. "he disappeared in that forest... twenty years ago" ----------
      add("gone", {
        set: "posterBoard", setOpts: { id: "pb3" }, dark: 0.04,
        cam: { keys: [{ t: 0, ...fr(540, 960, 0.9, 540, 960), drift: { s: 0.02 } }, { t: F("gone", 0, 1) - 0.05, ...fr(500, 1000, 1.45, 540, 900), drift: { s: 0.02 } }] },
        actors: [{ who: "mad", x: 400, y: 1453, s: 1.1, track: [{ t: 0, mode: "idle", eyes: "normal", mouth: "flat" }], blinks: [] }],
        captions: caps("gone", [0], { quote: true }),
        fx(tl, id, t0, L) {
          const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.setAttribute("clip-path", "url(#pb3-clip)"); g.style.filter = "sepia(1) contrast(1.05) brightness(.95)";
          L.act.appendChild(g); g.appendChild(document.getElementById(`${id}-a0`));
          tl.fromTo("#pb3-stamp", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, svgOrigin: "560 1250", duration: 0.22, ease: "power3.in", immediateRender: false }, t0 + F("gone", 0, 1) + 0.35);
          Fx.punch(tl, `#${id} .stage`, t0 + F("gone", 0, 1) + 0.55, 1.05, 0.3); Fx.heart(tl, t0 + F("gone", 0, 1), D("gone") - F("gone", 0, 1), 0.55, 0.5);
        },
      });

      // ---------- 21. by ฟ้า's bed: บังหมาด's walking stick ----------
      add("stick", {
        set: "hospRoom", setOpts: { id: "sk3", stick: true }, dark: 0.04,
        cam: { keys: [{ t: 0, ...fr(680, 1260, 0.95, 540, 980), drift: { s: 0.02 } }, { t: F("stick", 0, 1) - 0.05, ...fr(910, 1330, 1.9, 540, 980), drift: { s: 0.03 } }] },
        actors: [{ who: "faGown", x: 420, y: 1300, s: 0.85, track: [{ t: 0, mode: "sit", eyes: "wide", mouth: "flat", look: 8 }] }],
        captions: caps("stick"),
        extra(L, id) { BED(L, id); },
        fx(tl, id, t0, L) {
          TOP(L, document.getElementById(`${id}-blk`));
          Fx.punch(tl, `#${id} .stage`, t0 + F("stick", 0, 1), 1.06, 0.4); Fx.heart(tl, t0, D("stick"), 0.55, 0.6);
        },
      });

      // ---------- 22. mud prints on the floor: only one foot ----------
      add("mud", {
        set: "stickTracks", setOpts: { id: "mu3", floor: 640, n: 6, seed: 137 }, dark: 0.04,
        cam: { from: { ...fr(600, 2300, 1.0, 540, 1250) }, to: { ...fr(600, 1300, 0.85, 540, 1000) } },
        captions: caps("mud"),
        fx(tl, id, t0) {
          const h = t0 + F("mud", 0, 1);
          tl.fromTo("#mu3-hl", { opacity: 0 }, { opacity: 0.6, duration: 0.18, repeat: 5, yoyo: true, immediateRender: false }, h);
          Fx.punch(tl, `#${id} .stage`, h, 1.07, 0.4); Fx.glitch(tl, `#${id}`, h, 0.3, 12, 36); Fx.heart(tl, t0, D("mud"), 0.45, 0.8);
        },
      });

      // ---------- 23. from under the bed: "koi..." ----------
      add("bed", {
        set: "underBed", setOpts: { id: "ub3" }, dark: 0.1,
        cam: { keys: [{ t: 0, ...fr(570, 900, 1.05, 540, 900), drift: { s: 0.05 } }] },
        captions: caps("bed", [0], { quote: true }),
        fx(tl, id, t0) {
          tl.fromTo("#ub3-hair", { opacity: 0 }, { opacity: 1, duration: 0.8, immediateRender: false }, t0 + 0.2);
          tl.fromTo("#ub3-eyes", { opacity: 0 }, { opacity: 1, duration: 0.12, immediateRender: false }, t0 + vo("bed") - 0.15);
          Fx.heart(tl, t0, D("bed"), 0.38, 0.9); Fx.tunnel(tl, t0, t0 + D("bed") + 0.2, 0.6);
        },
      });

      // ---------- 24. look under the bed? ----------
      add("choice", {
        set: "underBed", setOpts: { id: "ch3" }, dark: 0.25,
        cam: { keys: [{ t: 0, ...fr(570, 900, 1.15, 540, 900), drift: { s: 0.04 } }] }, shake: (t) => shakeH(t) * 2,
        ui: [{ type: "choice", t: 0.05, q: "จะก้มดูใต้เตียงมั้ย?", a: "ก้มดู", b: "ไม่ดู", secs: 3, top: 300,
          possessed: { at: 1.0, side: "a", glitch: "ก้มดูสิ…", who: "…บังรออยู่ใต้เตียง" } }],
        fx(tl, id, t0) {
          tl.set(["#ch3-hair", "#ch3-eyes"], { opacity: 1 }, t0);
          Fx.heart(tl, t0, D("choice"), 0.38, 0.85); Fx.tunnel(tl, t0, t0 + D("choice") + 0.5, 0.75);
          Fx.glitch(tl, `#${id}`, t0 + 1.0, 0.3, 12, 64);
          tl.fromTo("#ch3-hand", { opacity: 1, attr: { transform: "translate(140,1160)" } }, { opacity: 1, attr: { transform: "translate(420,1300)" }, duration: 0.2, ease: "power3.out", immediateRender: false }, t0 + D("choice") - 0.62);
          Fx.glitch(tl, `#${id}`, t0 + D("choice") - 0.6, 0.4, 18, 65);
          tl.set("#black", { opacity: 1 }, t0 + D("choice") - 0.2);
        },
      });
      root.insertAdjacentHTML("beforeend", `<div class="badge" id="badge">เสียงกอย · EP.3</div><div id="vig"></div><div id="flashw"></div><div id="black"></div>`);
      Fx.setup(root);
      Engine.build(root, tl, shots);

      root.appendChild(document.getElementById("grain"));
      const rnd = (() => { let s = 99; return () => ((s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296); })();
      for (let i = 0; i * 0.083 < SCHED.total; i++) tl.set("#grain", { x: Math.round(-50 + rnd() * 50), y: Math.round(-50 + rnd() * 50) }, i * 0.083);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
